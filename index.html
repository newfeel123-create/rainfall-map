<script src="map_data.js"></script>
<script>

function displayAmountNoMm(v) {
  // 지도 라벨/인덱스 표기용 최종 규칙
  // - 범례 항목/수치 박스에서는 m, mm, 밀리미터를 전부 제거
  // - (단위:mm)는 범례 하단에서만 별도로 유지
  // - 이상/초과만 ↑로 표시
  // - 미만/안팎은 한글 그대로 표시
  let s = String(v ?? "")
    .replace(/[∼－–—]/g, "~")
    .replace(/밀리미터/gi, "")
    .replace(/m{1,2}/gi, "")
    .replace(/\s+/g, "")
    .replace(/많은곳/g, "")
    .replace(/초과/g, "이상")
    .replace(/이상/g, "↑")
    .trim();

  // 잘못 잡힌 빈 최대값(예: 00↑)은 범례에 표시하지 않습니다.
  if (/^0+↑$/.test(s) || /^00+/.test(s)) return "";
  return s;
}
function __mapAmountOnly(v) {
  return displayAmountNoMm(v);
}
function __indexAmountWithMm(v) {
  return displayAmountNoMm(v);
}

// GEOJSON 데이터는 map_data.js에서 불러옵니다.


// COASTLINE_RINGS 데이터는 map_data.js에서 불러옵니다.

// SIDO_BOUNDARY_LINES 데이터는 map_data.js에서 불러옵니다.


const svg = document.getElementById('map');
const viewport = document.getElementById('viewport');
const regionsG = document.getElementById('regions');
const coastlineG = document.getElementById('coastline');
const sidoBoundariesG = document.getElementById('sidoBoundaries');
const amountLabelsG = document.getElementById('amountLabels');
const mountainIconsG = document.getElementById('mountainIcons');
const tooltip = document.getElementById('tooltip');

let selectedManualColor = '';
const MANUAL_COLOR_PALETTE = [
  '#FFD400', '#E53935', '#1E88E5', '#43A047', '#8E24AA',
  '#FB8C00', '#00ACC1', '#6D4C41', '#D81B60', '#3949AB'
];

const WIDTH = 900;
const HEIGHT = 1150;
const PAD = 32;

// 대한민국 원래 좌표 방향 그대로 표시합니다.
// 회전 보정 없이 한반도가 정상 방향으로 나오게 합니다.
const MAP_ROTATE_DEG = 0;
const ROT = MAP_ROTATE_DEG * Math.PI / 180;
const COS = Math.cos(ROT);
const SIN = Math.sin(ROT);

let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;

function scanCoords(coords) {
  if (typeof coords[0] === 'number') {
    const lon = coords[0], lat = coords[1];
    minLon = Math.min(minLon, lon);
    maxLon = Math.max(maxLon, lon);
    minLat = Math.min(minLat, lat);
    maxLat = Math.max(maxLat, lat);
  } else {
    coords.forEach(scanCoords);
  }
}
GEOJSON.features.forEach(f => scanCoords(f.geometry.coordinates));

const rawW = maxLon - minLon;
const rawH = maxLat - minLat;
const centerX = rawW / 2;
const centerY = rawH / 2;

function rotateRaw(coord) {
  const lon = coord[0], lat = coord[1];
  const x = lon - minLon;
  const y = maxLat - lat;
  const dx = x - centerX;
  const dy = y - centerY;
  return [
    centerX + dx * COS - dy * SIN,
    centerY + dx * SIN + dy * COS
  ];
}

let minRX = Infinity, minRY = Infinity, maxRX = -Infinity, maxRY = -Infinity;
function scanRotated(coords) {
  if (typeof coords[0] === 'number') {
    const [x, y] = rotateRaw(coords);
    minRX = Math.min(minRX, x);
    maxRX = Math.max(maxRX, x);
    minRY = Math.min(minRY, y);
    maxRY = Math.max(maxRY, y);
  } else {
    coords.forEach(scanRotated);
  }
}
GEOJSON.features.forEach(f => scanRotated(f.geometry.coordinates));

const scaleX = (WIDTH - PAD * 2) / (maxRX - minRX);
const scaleY = (HEIGHT - PAD * 2) / (maxRY - minRY);
const scale = Math.min(scaleX, scaleY);
const offsetX = (WIDTH - (maxRX - minRX) * scale) / 2;
const offsetY = (HEIGHT - (maxRY - minRY) * scale) / 2;

// Ver.1.8.4-v7.2 Boundary+Index
// 지도 비율 보정: 기존보다 가로는 살짝 줄이고, 세로는 살짝 늘려
// 한반도가 좌우로 퍼져 보이는 느낌을 줄입니다.
// 레이더 오버레이를 위한 1차 투영/비율 보정값입니다.
const MAP_X_SCALE = 0.95;
const MAP_Y_SCALE = 1.02;

function project(coord) {
  const [rx, ry] = rotateRaw(coord);
  const baseX = offsetX + (rx - minRX) * scale;
  const baseY = offsetY + (ry - minRY) * scale;

  // SVG 중앙 기준으로 비율만 보정합니다.
  // 그래서 지역 클릭, 강수량 라벨, 산지 아이콘, 시도경계가 모두 같이 움직입니다.
  const cx = WIDTH / 2;
  const cy = HEIGHT / 2;
  const x = cx + (baseX - cx) * MAP_X_SCALE;
  const y = cy + (baseY - cy) * MAP_Y_SCALE;
  return [x, y];
}

function ringToPath(ring) {
  return ring.map((pt, i) => {
    const [x, y] = project(pt);
    return (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
  }).join(' ') + ' Z';
}

function geomToPath(geom) {
  if (!geom) return '';
  if (geom.type === 'Polygon') {
    return geom.coordinates.map(ringToPath).join(' ');
  }
  if (geom.type === 'MultiPolygon') {
    return geom.coordinates.map(poly => poly.map(ringToPath).join(' ')).join(' ');
  }
  return '';
}


function renderCoastline() {
  coastlineG.innerHTML = '';
  const frag = document.createDocumentFragment();
  COASTLINE_RINGS.forEach(ring => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', ringToPath(ring));
    p.setAttribute('class', 'coastline');
    frag.appendChild(p);
  });
  coastlineG.appendChild(frag);
}


function lineToPath(line) {
  return line.map((pt, i) => {
    const [x, y] = project(pt);
    return (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
  }).join(' ');
}

function renderSidoBoundaries() {
  sidoBoundariesG.innerHTML = '';
  const frag = document.createDocumentFragment();
  SIDO_BOUNDARY_LINES.forEach(item => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', lineToPath(item.coords));
    p.setAttribute('class', 'sido-boundary');
    p.dataset.sido = item.sido || '';
    frag.appendChild(p);
  });
  sidoBoundariesG.appendChild(frag);
}





function moveTooltipToMouse(e) {
  if (!tooltip) return;

  tooltip.style.display = 'block';

  const gap = 14;
  const rect = tooltip.getBoundingClientRect();

  // 기본 위치: 마우스 포인트 바로 위 중앙
  let x = e.clientX - rect.width / 2;
  let y = e.clientY - rect.height - gap;

  // 위로 나가면 아래쪽에 표시
  if (y < 8) y = e.clientY + gap;

  // 좌우 화면 밖 보정
  if (x < 8) x = 8;
  if (x + rect.width > window.innerWidth - 8) {
    x = window.innerWidth - rect.width - 8;
  }

  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function render() {
  const frag = document.createDocumentFragment();
  GEOJSON.features.forEach((f, idx) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', geomToPath(f.geometry));
    p.setAttribute('class', 'region');
    p.dataset.name = f.properties.name || '';
    p.dataset.sido = f.properties.sido || '';
    p.dataset.sig = f.properties.sig || '';
    p.dataset.code = f.properties.code || '';
    p.addEventListener('mousemove', e => {
      const fullName = (p.dataset.sido && p.dataset.sido !== p.dataset.sig)
        ? p.dataset.sido + ' ' + p.dataset.sig
        : (p.dataset.sido || p.dataset.sig || p.dataset.name);
      tooltip.textContent = fullName;
      moveTooltipToMouse(e);
    });
    p.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    p.addEventListener('click', () => {
      // 지역 수동 매칭 패널이 열려 있고, 실제 지역 버튼을 선택한 상태에서만
      // 지도 클릭으로 지역을 추가/해제합니다.
      if (typeof toggleManualRegionPathFromMap === 'function' && isManualRegionEditModeActive()) {
        if (toggleManualRegionPathFromMap(p)) return;
      }

      // Ver.1.8.1
      // 수동 색상이 선택되지 않았을 때는 지도 클릭으로 색이 들어가지 않게 합니다.
      if (!selectedManualColor) return;

      // 이미 같은 수동 색상으로 칠해진 곳을 한 번 더 누르면 지워집니다.
      if (p.dataset.manualColor === selectedManualColor) {
        p.classList.remove('matched');
        p.classList.remove('selected');
        p.style.fill = '';
        delete p.dataset.manualColor;
        return;
      }

      p.classList.add('matched');
      p.classList.remove('selected');
      p.style.fill = selectedManualColor;
      p.dataset.manualColor = selectedManualColor;
    });
    frag.appendChild(p);
  });
  regionsG.appendChild(frag);
}
render();
renderCoastline();
renderSidoBoundaries();

// 강수량 구간별 고유 색 인덱스
// 핵심: 최대값 기준이 아니라 "10~60mm", "20~60mm" 같은 수치 문자열 자체를 서로 다른 색으로 배정합니다.
// 같은 예보문 안에서 서로 다른 강수량이 같은 색으로 나오지 않도록 팔레트 순서대로 1개씩 배정합니다.
const RAIN_PALETTE = [
  '#FFD400', '#E53935', '#1E88E5', '#43A047', '#8E24AA',
  '#FB8C00', '#00ACC1', '#6D4C41', '#D81B60', '#3949AB',
  '#F06292', '#F4511E', '#5E35B1', '#546E7A', '#C62828',
  '#1565C0', '#AD1457', '#EF6C00', '#4527A0', '#4E342E',
  '#0277BD', '#B71C1C', '#283593', '#880E4F', '#FF8F00',
  '#00838F', '#3E2723', '#311B92', '#BF360C', '#1A237E',
  '#263238', '#000000'
];
let amountColorMap = {};
let amountColorOrder = [];
let forecastAllowedAmountKeys = null;

function buildAllowedAmountKeysFromForecast(rawText) {
  const set = new Set();
  const text = String(rawText || '').replace(/[∼－–—]/g, '~');
  let m;
  const rangeRe = /(\d+)\s*~\s*(\d+)\s*mm/gi;
  while ((m = rangeRe.exec(text)) !== null) {
    set.add(normalizeAmountKey(`${m[1]}~${m[2]}mm`));
  }
  const suffixRe = /(\d+)\s*mm\s*(이상|초과|미만|안팎)/gi;
  while ((m = suffixRe.exec(text)) !== null) {
    const suffix = m[2] === '초과' ? '이상' : m[2];
    set.add(normalizeAmountKey(`${m[1]}mm${suffix}`));
  }

  // 80~150mm(많은 곳 200mm 이상)처럼 특정 지역명이 없는 많은 곳은
  // 별도 200↑ 범례가 아니라 80~150(200↑)로 같은 항목에 묶습니다.
  const genericHeavyRe = /(\d+)\s*~\s*(\d+)\s*mm\s*\([^)]*많은\s*곳\s*(\d+)\s*mm\s*(이상|초과)[^)]*\)/gi;
  while ((m = genericHeavyRe.exec(text)) !== null) {
    set.add(normalizeAmountKey(`${m[1]}~${m[2]}mm(${m[3]}mm이상)`));
  }
  return set;
}

function isForecastAllowedAmount(amount) {
  if (!forecastAllowedAmountKeys || !forecastAllowedAmountKeys.size) return true;
  return forecastAllowedAmountKeys.has(normalizeAmountKey(amount));
}

function normalizeAmountKey(amount) {
  return String(amount || '')
    .replace(/\s+/g, '')
    .replace(/[∼－–—]/g, '~')
    .trim();
}

function legendAmountSortValue(amount) {
  const nums = String(amount || '').match(/\d+/g);
  if (!nums || !nums.length) return 999999;
  const values = nums.map(Number);
  const max = Math.max(...values);
  const min = Math.min(...values);
  // 5~40처럼 최대값이 같은 경우 시작값이 작은 것을 먼저 둡니다.
  return max * 1000 + min;
}

function getActivePaintedAmountKeys() {
  // 범례는 실제 지도에 칠해진 수치만 사용합니다.
  // 이전 매칭값/팔레트에 남은 값 때문에 20↑, 50↑ 같은 없는 값이 나오는 것을 방지합니다.
  const set = new Set();
  document.querySelectorAll('.region.matched, .amount-label-group, .mountain-icon-group').forEach(el => {
    const raw = el && el.dataset ? (el.dataset.amount || '') : '';
    const key = normalizeAmountKey(raw);
    if (key) set.add(key);
  });
  return set;
}

function getSortedLegendAmounts() {
  const activeKeys = getActivePaintedAmountKeys();
  let list = (amountColorOrder || []).slice().filter(isForecastAllowedAmount);
  if (activeKeys.size) {
    list = list.filter(a => activeKeys.has(normalizeAmountKey(a)));
  }
  return list.sort((a, b) => {
    const av = legendAmountSortValue(a);
    const bv = legendAmountSortValue(b);
    if (av !== bv) return av - bv;
    return String(a).localeCompare(String(b), 'ko');
  });
}

function renderRainLegend() {
  const box = document.getElementById('rainLegend');
  const legendBox = document.getElementById('mapLegendBox') || document.querySelector('.map-legend');
  if (!box) return;
  const legendAmounts = getSortedLegendAmounts();
  if (!legendAmounts.length) {
    box.innerHTML = '';
    if (legendBox) legendBox.style.display = 'none';
    return;
  }
  if (legendBox) legendBox.style.display = 'block';
  const rows = legendAmounts.map((amount, i) => {
    const label = displayAmountNoMm(amount);
    if (!label) return '';
    return `<div class="rain-row"><span class="chip" style="background:${amountColorMap[amount]}"></span><span>${label}</span></div>`;
  }).join('');
  box.innerHTML = rows + `<div class="legend-unit">(단위:mm)</div>`;
}

function renderManualColorPalette() {

function relocateManualPanelsForMobile() {
  const colorPanel = document.getElementById('manualColorPanel');
  const regionPanel = document.getElementById('manualRegionPanel');
  const side = document.querySelector('.side');
  const mapcol = document.querySelector('.mapcol');
  const btns = document.querySelector('.btns');
  if (!colorPanel || !regionPanel || !side || !mapcol || !btns) return;

  if (window.matchMedia('(max-width: 768px)').matches) {
    // 휴대폰: 지도 아래에 수동 인덱스 → 지역 수동 매칭 순서로 표시
    const parent = mapcol.parentElement;
    if (colorPanel.parentElement !== parent || colorPanel.previousElementSibling !== mapcol) {
      parent.insertBefore(colorPanel, mapcol.nextSibling);
    }
    if (regionPanel.parentElement !== parent || regionPanel.previousElementSibling !== colorPanel) {
      parent.insertBefore(regionPanel, colorPanel.nextSibling);
    }
  } else {
    // PC: 왼쪽 버튼 바로 아래에 수동 인덱스 → 지역 수동 매칭 순서로 표시
    if (colorPanel.parentElement !== side || colorPanel.previousElementSibling !== btns) {
      side.insertBefore(colorPanel, btns.nextSibling);
    }
    if (regionPanel.parentElement !== side || regionPanel.previousElementSibling !== colorPanel) {
      side.insertBefore(regionPanel, colorPanel.nextSibling);
    }
  }
}

function maxRainValue(amount) {
  const nums = String(amount || '').match(/\d+/g);
  if (!nums || !nums.length) return 0;
  return Math.max(...nums.map(Number));
}

function amountColor(amount) {
  const key = normalizeAmountKey(amount);
  if (!key) return '#ffffff';
  if (!isForecastAllowedAmount(key)) return '#ffffff';
  if (!amountColorMap[key]) {
    const idx = amountColorOrder.length % RAIN_PALETTE.length;
    amountColorMap[key] = RAIN_PALETTE[idx];
    amountColorOrder.push(key);
    renderRainLegend();
  }
  return amountColorMap[key];
}

function normText(t) {
  return (t || '')
    .replace(/[·ㆍ.]/g, '.')
    .replace(/[，]/g, ',')
    .replace(/\s+/g, '')
    .trim();
}

function zoneName(zone) {
  const z = normText((zone || '').replace(/[()]/g, ''));
  if (z.includes('수도권')) return '수도권';
  if (z.includes('강원도')) return '강원도';
  if (z.includes('충청권')) return '충청권';
  if (z.includes('전라권')) return '전라권';
  if (z.includes('경상권')) return '경상권';
  if (z.includes('제주도')) return '제주도';
  return z;
}


// Ver.1.8.1: "많은 곳 A.B.C 100mm 이상" 다중 지역 처리

function expandGangwonInlandMountainTokenForParts(zone, area, amount) {
  const z = zoneName(zone);
  const a = normText(area);
  const result = [];

  if (z !== '강원도') return null;

  if (a === '강원북부내륙.산지' || a === '강원북부내륙산지') {
    result.push({ zone, area:'강원북부내륙', amount });
    result.push({ type:'mountain', zone, area:'강원북부산지', amount });
    return result;
  }

  if (a === '강원중부내륙.산지' || a === '강원중부내륙산지') {
    result.push({ zone, area:'강원중부내륙', amount });
    result.push({ type:'mountain', zone, area:'강원중부산지', amount });
    return result;
  }

  if (a === '강원남부내륙.산지' || a === '강원남부내륙산지') {
    result.push({ zone, area:'강원남부내륙', amount });
    result.push({ type:'mountain', zone, area:'강원남부산지', amount });
    return result;
  }

  return null;
}

function addHeavyMultiAreasFromText(parts, zone, amountText) {
  amountText = normalizeGangwonHeavyAreaColon(amountText);
  const z = zoneName(zone);
  const raw = normText(amountText);
  const m = raw.match(/많은곳(.+?)([0-9]+mm(?:이상|안팎|미만)?)/);
  if (!m) return;

  let areaPart = m[1];
  const heavyAmount = m[2];

  // 강원도 산지 세부 치환
  // split(/[,.\/]+/) 전에 먼저 바꿔야 합니다.
  // 그렇지 않으면 강원북부내륙.산지가 '강원북부내륙' + '산지'로 쪼개져
  // 산지가 강원산지 전체로 인식됩니다.
  if (z === '강원도') {
    areaPart = areaPart
      .replace(/강원북부내륙\.?산지/g, '강원북부내륙,강원북부산지')
      .replace(/강원중부내륙\.?산지/g, '강원중부내륙,강원중부산지')
      .replace(/강원남부내륙\.?산지/g, '강원남부내륙,강원남부산지');
  }

  const pushHeavyArea = (scoped) => {
    if (!scoped || scoped === '__NO_MATCH__' || scoped === '많은곳') return;

    // 괄호 안 '많은 곳'은 기본 예보보다 나중에 칠해져야 하므로 parts 뒤에 추가합니다.
    parts.push({ zone, area: scoped, amount: heavyAmount });

    // 산지는 해당 산지 아이콘도 같은 수치로 나중에 덮어쓰기합니다.
    if (/산지|지리산|덕유산|소백산|중산간/.test(scoped)) {
      parts.push({ type:'mountain', zone, area: scoped, amount: heavyAmount });
    }
  };

  // 강원도 괄호 안 '많은 곳' 전용 규칙.
  // 예: (많은 곳 강원북부내륙.산지 80mm 이상)
  // 여기서 '산지'는 강원산지 전체가 아니라 '강원북부산지'만 의미합니다.
  if (z === '강원도') {
    [
      ['북부', '강원북부내륙', '강원북부산지'],
      ['중부', '강원중부내륙', '강원중부산지'],
      ['남부', '강원남부내륙', '강원남부산지']
    ].forEach(([part, inlandToken, mountainToken]) => {
      const re = new RegExp('강원' + part + '내륙\\.?산지', 'g');
      if (re.test(areaPart)) {
        pushHeavyArea(inlandToken);
        pushHeavyArea(mountainToken);
        // 뒤쪽 일반 split에서 '산지'가 다시 강원산지 전체로 들어가지 않도록 제거합니다.
        areaPart = areaPart.replace(re, '');
      }
    });
  }

  areaPart
    .replace(/[()]/g, '')
    .split(/[,.\/]+/)
    .map(v => v.trim())
    .filter(Boolean)
    .forEach(area => {
      const gangwonExpanded = expandGangwonInlandMountainTokenForParts(zone, area, heavyAmount);
      if (gangwonExpanded) {
        gangwonExpanded.forEach(p => parts.push(p));
        return;
      }

      let scoped = scopedToken(zone, area);

      // 권역별 짧은 해안 표현 보정
      if (area === '남해안' && z === '전라권') scoped = '전남남해안';
      if (area === '남해안' && z === '경상권') scoped = '경남남해안';
      if (area === '서해안' && z === '전라권') scoped = '전남서해안';
      if (area === '동해안' && z === '경상권') scoped = '경북동해안';
      if (area === '북동산지' && z === '경상권') scoped = '경북북동산지';
      if (area === '산지' && z === '제주도') scoped = '제주산지';
      if (area === '산지' && z === '강원도') scoped = '강원산지';

      pushHeavyArea(scoped);
    });
}



function normalizeGangwonHeavyAreaColon(input) {
  return String(input || '').replace(
    /(많은\s*곳\s*)(강원(?:북부|중부|남부)내륙\s*[.]?\s*산지)\s+([0-9]+(?:\s*~\s*[0-9]+)?\s*m{1,2}\s*(?:이상|미만|안팎)?)/g,
    '$1$2: $3'
  );
}

function splitForecastParts(line) {
  line = normalizeGangwonHeavyAreaColon(line);
  let text = line.replace(/^[-–]\s*/, '').trim();
  const zoneMatch = text.match(/^\s*(\([^)]*\))\s*/);
  const zone = zoneMatch ? zoneName(zoneMatch[1]) : '';
  if (zoneMatch) text = text.slice(zoneMatch[0].length).trim();

  const segs = text.split('/').map(v => v.trim()).filter(Boolean);
  const parts = [];
  let lastAmount = '';

  segs.forEach(seg => {
    const c = seg.indexOf(':');
    if (c < 0) return;
    let area = seg.slice(0, c).trim();
    let amountText = seg.slice(c + 1).trim();
    // 구간 앞에 붙는 날짜 괄호는 지역명에서 제거합니다. 예: (25일) 울릉도.독도
    area = area.replace(/\s*\([^)]*일[^)]*\)\s*/g, '').trim();
    let am = (amountText.match(/[0-9]+\s*~\s*[0-9]+m{1,2}|[0-9]+m{1,2}\s*안팎|[0-9]+m{1,2}\s*미만|[0-9]+m{1,2}\s*이상|[0-9]+m{1,2}/) || [''])[0].replace(/\s+/g, '');
    am = am.replace(/m$/,'mm').replace(/m(안팎|미만|이상)$/,'mm$1');

    // 80~150mm(많은 곳 200mm 이상)처럼 특정 지역명이 없는 경우는
    // 같은 색/범례 항목에 80~150(200↑)로 묶어 표시합니다.
    // 단, 경기남부 150mm 이상처럼 지역명이 있는 경우는 기존처럼 별도 지역으로 처리합니다.
    const genericHeavyMatch = amountText.match(/많은\s*곳\s*(\d+)\s*mm\s*(이상|초과)/i);
    if (am && genericHeavyMatch && /~/.test(am)) {
      am = `${am}(${genericHeavyMatch[1]}mm이상)`;
    }

    lastAmount = am || lastAmount;
    const cleanArea = normText(area);
    // 제주도산지/제주산지는 면 색칠이 아니라 ▲ 산지 수치로만 처리합니다.
    // 제주도(산지 제외)는 아래 tokensFromArea에서 제주도__EXCEPT_산지로 처리합니다.
    if (!/^(제주도산지|제주산지)$/.test(cleanArea)) {
      parts.push({ zone, area: cleanArea, amount: am || lastAmount });
    }

    const heavyText = normText(amountText);
    addHeavyMultiAreasFromText(parts, zone, amountText);
    // 많은 곳 중산간 120mm, 산지 150mm 이상 처럼 여러 수치를 모두 추출

      if (!/이상|미만|안팎/.test(hAmount) && heavyText.slice(hm.index, hm.index + 30).includes('이상')) hAmount += '이상';

    // 제주도(산지 제외), 경남내륙(지리산부근 제외)처럼 '제외'가 붙은 구역은

}

}

function inList(sido, sig, targetSido, arr) {
  if (sido !== targetSido) return false;

function regionMatchesKmaGroup(sido, sig, token, seen) {
  token = normText(token);

  if (!token || seen.has(token)) return false;

  // Ver.1.8.1: 산지/중산간은 시군구 면을 덮어쓰지 않고 ▲ 아이콘으로만 표시

function regionMatchesSavedManualOverride(sido, sig, code, token) {
  token = resolveManualRegionCanonical(normText(token));
  if (!token || typeof localStorage === 'undefined') return null;

    const raw = localStorage.getItem('kmaManualRegionOverride_v1_' + token);
    if (!raw) return null;
    const ids = JSON.parse(raw);
    if (!Array.isArray(ids)) return null;

    const id = (sido || '') + '|' + (sig || '') + '|' + (code || '');
    return ids.includes(id);
  } catch(e) {
    return null;
  }
}

function regionMatchesToken(sido, sig, token, code) {

  if (token === '경북북동내륙') return sido === '경북' && NORTHEAST_MOUNTAIN_GYEONGBUK.includes(sig);

  if (token === '지리산부근') return (sido === '경남' || sido === '전남') && JIRISAN_AREA.includes(sig);

  if (token === '제주도남부') return sido === '제주' && sig === '서귀포시';

  return token === sig || token === (sido + sig);

  [
    '경기내륙','경기북서내륙','경기북동내륙','경기남동내륙','경기남서내륙','경기남부서해안',
    '강원북부내륙','강원중부내륙','강원남부내륙','강원북부동해안','강원중부동해안','강원남부동해안','강원북부산지','강원중부산지','강원남부산지',
    '충남북부내륙','충남중부내륙','충남남동내륙','충남남서내륙','충남북부서해안','충남남부서해안',
    '전남중부내륙','전남동부내륙','전남북서부','전남북동부','전남서해안','전남남부서해안','전남중부남해안','전남서부남해안','전남동부남해안','전남남동부해안',
    '전북중부내륙','전북북동내륙','전북남동내륙','전북북서부','전북남서부','전북북부서해안','전북남부서해안',
    '경북북부내륙','경북중북부내륙','경북북서내륙','경북북동내륙','경북서부내륙','경북남서내륙','경북남동내륙','경북북부동해안','경북남부동해안',
    '경남북서내륙','경남남서내륙','경남중부내륙','경남동부내륙','경남서부내륙','경남서부남해안','경남중부남해안',
    '제주도북부','제주도남부','제주도동부','제주도서부'
  ].forEach(k => { if (a.includes(k)) add(k); });

  // 중.남부 / 중.북부 / 남.동부 형태 보정
  if (a.includes('강원남부내륙.산지') || a.includes('강원남부내륙산지') || a.includes('강원남부산지내륙')) { add('강원남부내륙'); add('강원남부산지'); }
  if (a.includes('강원남부동해안')) add('강원남부동해안');
  if (a.includes('강원중.남부내륙') || a.includes('강원중남부내륙')) {
    add('강원중부내륙');
    add('강원남부내륙');
  } else if (a.includes('강원중.남부') || a.includes('강원중남부')) add('강원중남부');
  if (a.includes('강원중.북부') || a.includes('강원중북부')) { add('강원중부'); add('강원북부'); }
  if (a.includes('경북중.북부') || a.includes('경북중북부')) add('경북북부');
  if (z === '경상권' && /(^|[,.])북동산지/.test(a)) add('경북북동산지');
  if (a.includes('경북동해안.북동산지') || a.includes('경북동해안북동산지')) { add('경북동해안'); add('경북북동산지'); }
  if (a.includes('경북내륙.북동산지') || a.includes('경북내륙북동산지')) { add('경북내륙'); add('경북북동산지'); }
  if (a.includes('경북북동내륙.산지') || a.includes('경북북동내륙산지')) { add('경북북동내륙'); add('경북북동산지'); }
  if (a.includes('경남중부남해안')) add('경남중부남해안');
  if (a.includes('경남중.동부내륙') || a.includes('경남중동부내륙')) { add('경남중부내륙'); add('경남동부내륙'); }
  else if (a.includes('경남중.동부') || a.includes('경남중동부')) add('경남동부');
  if (a.includes('전남남부서해안')) add('전남남부서해안');


  // Ver.1.8.1: 괄호 제외 표현을 표준 예보구역으로 단순 치환
  // 예: 대구.경북(동해안.북동산지 제외) => 대구 + 경북내륙
  const compactExcept = a.replace(/[,.\/()\s]/g, '');
  if (compactExcept.includes('대구경북') && compactExcept.includes('동해안북동산지제외')) {
    add('대구');
    add('경북내륙');
  } else if (compactExcept.includes('경북') && compactExcept.includes('동해안북동산지제외')) {
    add('경북내륙');
  }

  // 괄호 제외 표현
  if (a.includes('제주도') && a.includes('산지제외')) add('제주도__EXCEPT_산지');
  if (a.includes('전남') && a.includes('남해안제외')) add('전남__EXCEPT_남해안');
  if (a.includes('전남') && a.includes('북서부제외')) add('전남__EXCEPT_북서부');
  if (a.includes('경남') && a.includes('서부남해안제외')) add('경남__EXCEPT_서부남해안');
  if (a.includes('경남내륙') && a.includes('지리산부근제외')) add('경남내륙__EXCEPT_지리산부근');

  // 대구.경북, 부산.울산.경남 같은 묶음은 split으로도 되지만 안전하게 보정
  if (a.includes('대구경북')) add('대구경북');
  return out;
}


// Ver.1.8.1: 권역별 생략 표현 자동 완성
function addZoneImpliedTokens(areaText, zone, addToken) {
  const z = zoneName(zone);
  const parts = normText(areaText)
    .replace(/[()]/g, '')
    .split(/[,.\/]+/)
    .map(v => v.trim())
    .filter(Boolean);

  let lastPrefix = '';
  let lastSuffix = '';

  function detectPrefix(t) {
    const prefixes = ['경기','강원','충남','충북','전남','전북','경북','경남','제주도','제주'];
    return prefixes.find(p => t.startsWith(p)) || '';
  }

  function defaultPrefixByZone(shortToken) {
    if (z === '수도권') return '경기';
    if (z === '강원도') return '강원';
    if (z === '충청권') return lastPrefix || '충남';
    if (z === '전라권') return lastPrefix || '전남';
    if (z === '경상권') return lastPrefix || '경북';
    if (z === '제주도') return '제주도';
    return lastPrefix;
  }

  function completeToken(prefix, shortToken, suffixHint) {
    if (!prefix || !shortToken) return '';

    // 해안/산지 계열은 권역별 표준명으로 보정
    if (shortToken === '남해안') {
      if (prefix === '전남') return '전남남해안';
      if (prefix === '경남') return '경남남해안';
    }
    if (shortToken === '동해안') {
      if (prefix === '강원') return '강원동해안';
      if (prefix === '경북') return '경북동해안';
    }
    if (shortToken === '서해안') {
      if (prefix === '경기') return '경기서해안';
      if (prefix === '충남') return '충남서해안';
      if (prefix === '전남') return '전남서해안';
      if (prefix === '전북') return '전북서해안';
    }
    if (shortToken === '북동산지' && prefix === '경북') return '경북북동산지';
    if (shortToken === '산지') {
      if (prefix === '강원') return '강원산지';
      if (prefix === '제주도' || prefix === '제주') return '제주도산지';
      if (prefix === '경북') return '경북북동산지';
    }

    // 앞 토큰이 내륙이면 뒤의 남부/동부/서부 등을 내륙으로 해석
    if (suffixHint === '내륙' && ['북부','중부','남부','동부','서부','북서','북동','남서','남동'].includes(shortToken)) {
      return prefix + shortToken + '내륙';
    }

    // 예: 경기남부.동부 => 경기남부 + 경기동부
    if (['북부','중부','남부','동부','서부'].includes(shortToken)) {
      return prefix + shortToken;
    }

    // 예: 남동내륙, 북서내륙
    if (/^(북서|북동|남서|남동|북부|중부|남부|동부|서부)내륙$/.test(shortToken)) {
      return prefix + shortToken;
    }

    return prefix + shortToken;
  }

  parts.forEach(part => {
    const p = detectPrefix(part);
    if (p) {
      lastPrefix = p;
      lastSuffix = part.includes('내륙') ? '내륙' : '';
      addToken(part);
      return;
    }

    if (!lastPrefix) lastPrefix = defaultPrefixByZone(part);
    const inferred = completeToken(lastPrefix, part, lastSuffix);
    if (inferred) addToken(inferred);
  });
}

function tokensFromArea(areaText, zone) {
  const a = normText(areaText);
  const z = zoneName(zone);
  const tokens = [];
  const addToken = t => { if (t) tokens.push(t); };
  addZoneImpliedTokens(areaText, zone, addToken);

  expandCompoundTokens(a, zone).forEach(addToken);

  // 경상권은 예보문에서 부산.울산.경남남해안 / 경남내륙, 경북동해안 / 울릉도.독도처럼
  // 점(.)·쉼표(,)로 한 줄에 여러 구역이 붙어서 나오는 경우가 많습니다.
  // 일반 split 전에 자주 쓰는 묶음을 확실히 보정해서 경상권 색칠이 엉뚱하게 넓어지거나 빠지지 않게 합니다.
  if (z === '경상권') {
    const compact = a.replace(/[,.\/()]/g, '');
    if (compact.includes('부산울산경남남해안')) {
      addToken('부산');
      addToken('울산');
      addToken('경남남해안');
    }
    if (compact.includes('경남내륙경북동해안')) {
      addToken('경남내륙');
      addToken('경북동해안');
    }
    if (compact.includes('경북동해안북동산지')) {
      addToken('경북동해안');
      addToken('경북북동산지');
    }


    if (compact.includes('대구경북동해안북동산지제외')) {
      addToken('대구');
      addToken('경북내륙');
    }

    if (compact.includes('울릉도독도')) {
      addToken('울릉도독도');
    }
  }

  a.replace(/\([^)]*\)/g,'')
    .split(/[,.\/]+/)
    .map(v => scopedToken(zone, v.trim()))
    .filter(Boolean)
    .forEach(addToken);

  // split 후 생길 수 있는 조각 보정: 강원중.남부 → 강원중 / 남부 문제
  if (tokens.includes('강원중') && tokens.includes('남부')) tokens.push('강원중남부');
  if (tokens.includes('강원중') && tokens.includes('북부')) { tokens.push('강원중부'); tokens.push('강원북부'); }
  if (tokens.includes('경북중') && tokens.includes('북부')) tokens.push('경북북부');

  let filtered = tokens.filter(t => !['강원중','경북중','남부','북부','동부','서부','중부','산지제외','북동산지'].includes(t));

  // 괄호 제외가 붙은 경우 일반 광역명까지 같이 들어가면 앞 구역 색을 덮어쓰므로 제외 토큰만 남깁니다.
  // 예: 광주.전남(남해안 제외) => 광주 + 전남__EXCEPT_남해안
  // 예: 부산.울산.경남(서부남해안 제외) => 부산 + 울산 + 경남__EXCEPT_서부남해안
  if (a.includes('전남') && a.includes('남해안제외')) {
    filtered = filtered.filter(t => t !== '전남');
    if (!filtered.includes('전남__EXCEPT_남해안')) filtered.push('전남__EXCEPT_남해안');
  }
  // v7.13: 광주.전남(북서부 제외) => 광주 + 전남 전체에서 전남북서부 제외
  if (a.includes('전남') && a.includes('북서부제외')) {
    filtered = filtered.filter(t => t !== '전남' && t !== '전남북서부');
    if (!filtered.includes('전남__EXCEPT_북서부')) filtered.push('전남__EXCEPT_북서부');
  }
  if (a.includes('경남') && a.includes('서부남해안제외')) {
    filtered = filtered.filter(t => t !== '경남' && t !== '경남남해안' && t !== '경남서부남해안');
    if (!filtered.includes('경남__EXCEPT_서부남해안')) filtered.push('경남__EXCEPT_서부남해안');
  }
  // 강원남부내륙.산지는 전체 강원산지가 아니라 남부내륙 + 남부산지 아이콘만 적용
  if (a.includes('강원남부내륙.산지') || a.includes('강원남부내륙산지') || a.includes('강원남부산지내륙')) {
    filtered = filtered.filter(t => t !== '강원산지' && t !== '강원남부산지' && t !== '강원남부내륙산지' && t !== '강원남부산지내륙');
    filtered.push('강원남부내륙');
  }
  // v7.13: 강원중.남부내륙은 강원중부내륙 + 강원남부내륙만 적용합니다.
  if (z === '강원도' && (a.includes('강원중.남부내륙') || a.includes('강원중남부내륙'))) {
    filtered = filtered.filter(t => !['강원중남부','강원중부','강원남부','강원내륙','강원중','남부내륙'].includes(t));
    filtered.push('강원중부내륙');
    filtered.push('강원남부내륙');
  }
  // 대구.경북내륙.북동산지는 대구 + 경북내륙 + 경북북동산지로 해석
  if (z === '경상권' && (a.includes('경북내륙.북동산지') || a.includes('경북내륙북동산지'))) {
    filtered.push('경북내륙');
    filtered.push('경북북동산지');
  }
  // 경남중.동부내륙은 경남 전체/남해안이 아니라 경남중부내륙 + 경남동부내륙으로만 적용
  if (z === '경상권' && (a.includes('경남중.동부내륙') || a.includes('경남중동부내륙'))) {
    filtered = filtered.filter(t => !['경남동부','경남내륙','경남중동부내륙','경남중'].includes(t));
    filtered.push('경남중부내륙');
    filtered.push('경남동부내륙');
  }
  // .북동산지처럼 앞에 경북이 생략되면 경북북동산지만 적용.
  // 단, '경북내륙.북동산지'처럼 앞에 경북내륙이 명시된 경우는
  // 경북내륙 + 경북북동산지 둘 다 유지합니다.
  if (z === '경상권' && /(^|[,.])북동산지/.test(a)) {
    const hasExplicitGyeongbukInland = a.includes('경북내륙.북동산지') || a.includes('경북내륙북동산지');
    const hasExplicitGyeongbukEastCoast = a.includes('경북동해안.북동산지') || a.includes('경북동해안북동산지');
    filtered = filtered.filter(t => !['산지','강원산지','경북'].includes(t) && (hasExplicitGyeongbukInland || t !== '경북내륙'));
    if (hasExplicitGyeongbukInland) filtered.push('경북내륙');
    if (hasExplicitGyeongbukEastCoast) filtered.push('경북동해안');
    filtered.push('경북북동산지');
  }


  // Ver.1.8.1: 대구.경북(동해안.북동산지 제외)은 대구 + 경북내륙만 남김
  if (a.replace(/[,.\/()\s]/g, '').includes('대구경북동해안북동산지제외')) {
    filtered = filtered.filter(t => !['대구경북','경북','경북동해안','경북북동산지','동해안','북동산지'].includes(t));
    if (!filtered.includes('대구')) filtered.push('대구');
    if (!filtered.includes('경북내륙')) filtered.push('경북내륙');
  } else if (a.replace(/[,.\/()\s]/g, '').includes('경북동해안북동산지제외')) {
    filtered = filtered.filter(t => !['경북','경북동해안','경북북동산지','동해안','북동산지'].includes(t));
    if (!filtered.includes('경북내륙')) filtered.push('경북내륙');
  }


  // Ver.1.8.1: 경북동해안.북동산지 표현에서 동해안 면 색칠 보장
  if (z === '경상권' && (a.includes('경북동해안.북동산지') || a.includes('경북동해안북동산지'))) {
    if (!filtered.includes('경북동해안')) filtered.push('경북동해안');
    if (!filtered.includes('경북북동산지')) filtered.push('경북북동산지');
  }


  // Ver.1.8.1: area 원문에 경북동해안이 있으면 무조건 색칠 토큰 유지
  if (z === '경상권' && a.includes('경북동해안')) {
    if (!filtered.includes('경북동해안')) filtered.push('경북동해안');
  }


  // Ver.1.8.1: 경북동해안 원문 포함 시 직접 토큰 유지
  if (z === '경상권' && a.includes('경북동해안')) {
    if (!filtered.includes('경북동해안')) filtered.push('경북동해안');
  }

  return Array.from(new Set(filtered));
}

function labelStorageKey(amount) {

function loadLabelPos(amount) {
  try {
    const v = localStorage.getItem(labelStorageKey(amount));
    return v ? JSON.parse(v) : null;
  } catch(e) { return null; }
}

function saveLabelPos(amount, x, y) {
  try {
    localStorage.setItem(labelStorageKey(amount), JSON.stringify({x, y}));
  } catch(e) {}
}

function svgPointFromClient(evt) {
  const rect = svg.getBoundingClientRect();
  const rawX = (evt.clientX - rect.left) / rect.width * WIDTH;
  const rawY = (evt.clientY - rect.top) / rect.height * HEIGHT;
  return { x:(rawX - view.x) / view.k, y:(rawY - view.y) / view.k };
}

const DISPLAY_MOUNTAIN_KEYS = ['강원북부산지','강원중부산지','강원남부산지','경북북동산지','제주산지','지리산부근'];

const MOUNTAIN_POINTS = {

function mountainStorageKey(key, amount) {
  return 'kmaMountainIconPos_v3_cluster_' + key + '_' + normalizeAmountKey(amount);
}
function loadMountainPos(key, amount) {

function saveMountainPos(key, amount, x, y) {

function findMountainKeys(area, zone) {
  const a = normText(area);
  const z = zoneName(zone);
  const keys = [];
  const addGangwonMountains = () => {
    keys.push('강원북부산지');
    keys.push('강원중부산지');
    keys.push('강원남부산지');
  };
  // v7.39: 지도에 표시하는 산지 ▲는 강원 3개, 경북북동산지, 제주산지, 지리산부근을 사용합니다.
  if (a.includes('경북북동산지') || a.includes('경북내륙북동산지') || a.includes('경북북동내륙산지') || (a.includes('북동산지') && z === '경상권') || (a.includes('경북북동') && a.includes('산지'))) keys.push('경북북동산지');
  if (a.includes('강원남부내륙산지') || a.includes('강원남부산지내륙') || (a.includes('강원남부') && a.includes('산지'))) keys.push('강원남부산지');
  else if (a.includes('강원산지') || (a.includes('산지') && z === '강원도')) addGangwonMountains();
  if (a.includes('지리산부근') || a.includes('지리산')) keys.push('지리산부근');
  if (a.includes('제주산지') || (a.includes('산지') && z === '제주도')) keys.push('제주산지');
  // 제주중산간 ▲는 표시하지 않습니다.
  if (a === '산지' && z === '제주도') keys.push('제주산지');
  if (a === '산지' && z === '강원도') addGangwonMountains();
  return Array.from(new Set(keys)).filter(key => DISPLAY_MOUNTAIN_KEYS.includes(key));
}
function addMountainIcon(area, zone, amount) {
  if (!isForecastAllowedAmount(amount)) return;
  findMountainKeys(area, zone).forEach(key => {
    // 같은 산지 아이콘은 한 번만 생성합니다.
    // 예: 제주도산지 + 제주도(산지 제외) 입력 시 제주산지가 2개 생기지 않게 방지.
    if (!mountainIconGroups[key]) {
      mountainIconGroups[key] = {key, amount};
    }
  });
}
function makeDraggableMountain(g, key, amount) {
  let draggingIcon = false, start = null, base = null;
  function mountainMoveAllowed() {
    return (typeof mapMoveEnabled !== 'undefined') && !!mapMoveEnabled;
  }
  function currentPos() { return {x:parseFloat(g.dataset.x || '0'), y:parseFloat(g.dataset.y || '0')}; }
  function moveMountainToClientPoint(clientEvt) {
    if (!mountainMoveAllowed() || !draggingIcon || !start || !base) return;
    const pt = svgPointFromClient(clientEvt);
    const nx = base.x + (pt.x - start.x);
    const ny = base.y + (pt.y - start.y);
    g.dataset.x = nx; g.dataset.y = ny;
    g.setAttribute('transform', `translate(${nx} ${ny})`);
  }
  function finishMountainDrag() {
    if (!draggingIcon) return;
    draggingIcon = false;
    const p = currentPos();
    saveMountainPos(key, amount, p.x, p.y);
  }
  g.addEventListener('mousedown', e => {
    if (!mountainMoveAllowed()) return;
    e.stopPropagation();
    draggingIcon = true; start = svgPointFromClient(e); base = currentPos();
  });
  window.addEventListener('mousemove', e => {
    moveMountainToClientPoint(e);
  });
  window.addEventListener('mouseup', finishMountainDrag);

  // iPhone/Safari: 길게 누른 상태로 움직여도 확실히 드래그되도록 Pointer Event를 추가합니다.
  g.addEventListener('pointerdown', e => {
    if (!mountainMoveAllowed()) return;
    if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
    e.preventDefault();
    e.stopPropagation();
    draggingIcon = true;
    start = svgPointFromClient(e);
    base = currentPos();
    try { g.setPointerCapture(e.pointerId); } catch(_) {}
  }, {passive:false});
  g.addEventListener('pointermove', e => {
    if (!draggingIcon) return;
    e.preventDefault();
    e.stopPropagation();
    moveMountainToClientPoint(e);
  }, {passive:false});
  g.addEventListener('pointerup', e => {
    if (!draggingIcon) return;
    e.preventDefault();
    e.stopPropagation();
    finishMountainDrag();
    try { g.releasePointerCapture(e.pointerId); } catch(_) {}
  }, {passive:false});
  g.addEventListener('pointercancel', e => {
    if (!draggingIcon) return;
    e.preventDefault();
    e.stopPropagation();
    finishMountainDrag();
  }, {passive:false});

  // iPhone/Safari: 산지 ▲ 아이콘도 손가락으로 바로 움직일 수 있게 처리합니다.
  g.addEventListener('touchstart', e => {
    if (!mountainMoveAllowed()) return;
    if (!e.touches || e.touches.length !== 1) return;
    e.preventDefault();
    e.stopPropagation();
    draggingIcon = true;
    start = svgPointFromClient(e.touches[0]);
    base = currentPos();
  }, {passive:false});
  g.addEventListener('touchmove', e => {
    if (!draggingIcon || !e.touches || e.touches.length !== 1) return;
    e.preventDefault();
    e.stopPropagation();
    moveMountainToClientPoint(e.touches[0]);
  }, {passive:false});
  g.addEventListener('touchend', e => {
    e.preventDefault();
    e.stopPropagation();
    finishMountainDrag();

function hasRegionLabelForAmount(amount) {
  const key = String(amount || '').replace(/\s+/g, '');
  const group = amountLabelGroups[key];
  return !!(group && group.elements && group.elements.length);
}

function renderMountainIcons() {
  if (!mountainIconsG) return;
  mountainIconsG.innerHTML = '';
  Object.values(mountainIconGroups).forEach(item => {
    const ptInfo = MOUNTAIN_POINTS[item.key];
    if (!ptInfo) return;
    const basePt = project([ptInfo.lon, ptInfo.lat]);
    let x = basePt[0], y = basePt[1];
    const saved = loadMountainPos(item.key, item.amount);
    if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) {
      x = saved.x; y = saved.y;
    } else if (item.key.indexOf('강원') === 0 && item.key.indexOf('산지') >= 0) {
      // 강원산지 3개는 기본 표시에서 서로 겹치지 않도록 넓게 벌려 배치합니다.
      const c = project([128.50, 37.62]);
      x = c[0];
      y = c[1] - 10;
      if (item.key === '강원북부산지') { x -= 24; y -= 52; }
      else if (item.key === '강원남부산지') { x += 24; y += 52; }
    }

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class','mountain-icon-group');
    g.dataset.amount = item.amount;
    g.dataset.mountain = item.key;
    g.dataset.x = x; g.dataset.y = y;
    g.setAttribute('transform', `translate(${x} ${y})`);

    const tri = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    tri.setAttribute('class','mountain-triangle');
    tri.setAttribute('d','M 0 -16 L 17 14 L -17 14 Z');
    tri.setAttribute('fill', amountColor(item.amount));

    // 산지 수치가 일반 지역 수치박스와 같은 값이면 지도에는 삼각형만 표시합니다.
    // 예: 부산·경남남해안·지리산부근 모두 30~80mm이면 30~80mm 박스는 하나만 보이고, 지리산은 ▲만 표시.
    const hideTextBecauseSameAmount = hasRegionLabelForAmount(item.amount);

    g.appendChild(tri);

    if (!hideTextBecauseSameAmount) {
      // 산지 ▲와 산지 수치 박스를 분리합니다.
      // ▲는 mountainIcons 레이어에서 따로 움직이고,
      // 수치 박스는 amountLabels 레이어에서 일반 수치와 같은 방식으로 따로 움직입니다.
      // 산지 수치도 일반 수치와 동일하게 mm 포함 원문 크기/박스 계산을 사용합니다.
      const valueG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      valueG.setAttribute('class','amount-label-group mountain-value-label-group');
      valueG.dataset.amount = item.amount;
      valueG.dataset.mountain = item.key;
      // 제주 산지는 수치 박스가 산 아이콘 중앙을 가리지 않도록
      // 산 아이콘의 좌측 상단 모서리 위에 배치합니다.
      // 다른 산지/지리산부근은 기존처럼 산 아이콘 중앙에 유지합니다.
      const isJejuMountainValue = (item.key || '').indexOf('제주') >= 0 && (item.key || '').indexOf('산지') >= 0;
      // 기본 위치: 다른 산지는 산 아이콘 중앙.
      // 제주 산지는 아래 requestAnimationFrame에서 실제 박스 크기를 계산한 뒤,
      // 박스의 앞쪽(왼쪽 아래 모서리)이 ▲ 꼭짓점에 오도록 다시 배치합니다.
      const valueX = x;
      const valueY = y;
      valueG.dataset.x = valueX;
      valueG.dataset.y = valueY;
      valueG.setAttribute('transform', `translate(${valueX} ${valueY})`);

      const labelBox = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      labelBox.setAttribute('class','amount-label-box');
      labelBox.setAttribute('fill', amountColor(item.amount));
      valueG.appendChild(labelBox);

      const valueText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      valueText.setAttribute('class','amount-label');
      valueText.setAttribute('x','0');
      valueText.setAttribute('y','0');
      valueText.textContent = displayAmountNoMm(item.amount);
      valueG.appendChild(valueText);

      amountLabelsG.appendChild(valueG);

      requestAnimationFrame(() => {
        const b = valueText.getBBox();
        const boxX = b.x - 12;
        const boxY = b.y - 7;
        const boxW = b.width + 24;
        const boxH = b.height + 14;
        labelBox.setAttribute('x', boxX.toFixed(1));
        labelBox.setAttribute('y', boxY.toFixed(1));
        labelBox.setAttribute('width', boxW.toFixed(1));
        labelBox.setAttribute('height', boxH.toFixed(1));

        if (isJejuMountainValue) {
          // ▲ 꼭짓점은 산 아이콘 중심 기준 y-16입니다.
          // 수치 박스의 앞쪽(왼쪽 아래 모서리)이 그 꼭짓점에 닿게 배치합니다.
          const tipX = x;
          const tipY = y - 16;
          const newX = tipX - boxX;
          const newY = tipY - (boxY + boxH);
          valueG.dataset.x = newX;
          valueG.dataset.y = newY;
          valueG.setAttribute('transform', `translate(${newX} ${newY})`);
        }
      });

      makeDraggableLabel(valueG, labelBox, valueText, item.key + '_' + item.amount);
    }

    mountainIconsG.appendChild(g);
    makeDraggableMountain(g, item.key, item.amount);
  });
}

function clearAmountHoverFocus() {
  document.querySelectorAll('.region').forEach(el => {
    el.classList.remove('hover-dim','hover-focus');
  });
  document.querySelectorAll('.amount-label-group').forEach(el => {
    el.classList.remove('hover-dim','hover-focus');
  });
  document.querySelectorAll('.mountain-icon-group').forEach(el => {
    el.classList.remove('hover-dim','hover-focus');
  });
}

function showOnlyAmount(amount) {
  const key = normalizeAmountKey(amount);
  document.querySelectorAll('.region').forEach(el => {
    const a = normalizeAmountKey(el.dataset.amount || '');
    el.classList.remove('hover-dim','hover-focus');
    if (a && a === key) {
      el.classList.add('hover-focus');
    } else {
      el.classList.add('hover-dim');
    }
  });
  document.querySelectorAll('.amount-label-group').forEach(el => {
    el.classList.remove('hover-dim','hover-focus');
    if (normalizeAmountKey(el.dataset.amount || '') === key) {
      el.classList.add('hover-focus');
    } else {
      el.classList.add('hover-dim');
    }
  });
  document.querySelectorAll('.mountain-icon-group').forEach(el => {
    el.classList.remove('hover-dim','hover-focus');
    if (normalizeAmountKey(el.dataset.amount || '') === key) {
      el.classList.add('hover-focus');
    } else {
      el.classList.add('hover-dim');
    }
  });
}

  const key = String(amount).replace(/\s+/g, '');
  if (!amountLabelGroups[key]) amountLabelGroups[key] = { amount, elements:[] };
  amountLabelGroups[key].elements.push(...elements);
}

function getGroupAutoCenter(elements) {
  const unique = Array.from(new Set(elements));
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

  unique.forEach(el => {
    const b = el.getBBox();
    minX = Math.min(minX, b.x);
    minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.width);
    maxY = Math.max(maxY, b.y + b.height);
  });

  if (!Number.isFinite(minX)) return {x: WIDTH / 2, y: HEIGHT / 2};

  // 여러 시군구가 같은 강수량이면 전체 영역의 중앙에 먼저 배치합니다.
  // 너무 바깥으로 튀는 것을 막기 위해 지도 안쪽으로 살짝 제한합니다.
  return {
    x: Math.max(35, Math.min(WIDTH - 35, (minX + maxX) / 2)),
    y: Math.max(25, Math.min(HEIGHT - 25, (minY + maxY) / 2))
  };
}


function adjustAmountLabelOverlapsLive() {
  try {
    const labelGroups = Array.from(document.querySelectorAll('#amountLabels .amount-label-group, #amountLabels .mountain-value-label-group'));
    if (labelGroups.length < 2) return;

    function parseTranslate(g) {
      const tr = g.getAttribute('transform') || '';
      const m = tr.match(/translate\(([-0-9.]+)[ ,]+([-0-9.]+)\)/);
      return m ? {x:parseFloat(m[1]), y:parseFloat(m[2])} : {x:parseFloat(g.dataset.x || '0'), y:parseFloat(g.dataset.y || '0')};
    }
    function setTranslate(g, x, y) {
      g.dataset.x = x;
      g.dataset.y = y;
      g.setAttribute('transform', `translate(${x} ${y})`);
    }
    function labelBox(g) {
      const p = parseTranslate(g);
      const r = g.querySelector('rect');
      let rx = -34, ry = -17, rw = 68, rh = 34;
      if (r) {
        rx = parseFloat(r.getAttribute('x') || rx);
        ry = parseFloat(r.getAttribute('y') || ry);
        rw = parseFloat(r.getAttribute('width') || rw);
        rh = parseFloat(r.getAttribute('height') || rh);
      }
      return {g, p, x:p.x + rx - 7, y:p.y + ry - 7, w:rw + 14, h:rh + 14};
    }
    function overlap(a, b) {
      return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
    }

    for (let pass = 0; pass < 28; pass++) {
      let moved = false;
      const boxes = labelGroups.map(labelBox).sort((a,b)=>a.y-b.y);
      for (let i = 0; i < boxes.length; i++) {
        for (let j = i + 1; j < boxes.length; j++) {
          const a = boxes[i], b = boxes[j];
          if (!overlap(a,b)) continue;
          const push = Math.max(14, (a.y + a.h - b.y) + 12);
          let ny = b.p.y + push;
          const bottomLimit = HEIGHT - b.h - 12;
          if (ny > bottomLimit) ny = a.p.y - push;
          setTranslate(b.g, b.p.x, ny);
          moved = true;
        }
      }
      if (!moved) break;
    }
  } catch (e) {
    console.warn('live label overlap adjust failed', e);
  }
}

function renderAmountLabels(options = {}) {

  amountLabelsG.innerHTML = '';
  Object.values(amountLabelGroups).forEach(group => {
    const unique = Array.from(new Set(group.elements));
    if (!unique.length) return;

    const center = getGroupAutoCenter(unique);
    let x = center.x;
    let y = center.y;

    if (!ignoreSaved) {
      const saved = loadLabelPos(group.amount);
      if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) {
        x = saved.x;
        y = saved.y;
      }

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'amount-label-group');

    g.dataset.x = x;

function applyForecastMatch() {
  clearRainMatch();
  const raw = document.getElementById('forecastText').value;
  const lines = raw.split(/\n+/).map(v => v.trim()).filter(Boolean);
  let matchedCount = 0;
  let summaries = [];

  lines.forEach(line => {
    splitForecastParts(line).forEach(part => {
      if (part.type === 'mountain') {
        addMountainIcon(part.area, part.zone, part.amount);
        summaries.push(`▲ ${part.area} → ${part.amount || '수치 없음'}`);
        return;
      }

      const tokens = tokensFromArea(part.area, part.zone);
      const color = amountColor(part.amount);
      let count = 0;
      tokens.forEach(token => {
        document.querySelectorAll('.region').forEach(el => {
          const sido = el.dataset.sido || '';
          const sig = el.dataset.sig || el.dataset.name || '';
          if (regionMatchesToken(sido, sig, token, el.dataset.code || '')) {
            // 뒤에 나온 세부 예보가 앞의 광역 예보보다 우선입니다.
            // 예: 인천 10~60mm 뒤에 서해5도 10~40mm가 나오면 서해5도는 10~40mm 색으로 덮어씁니다.
            el.classList.add('matched');
            el.style.fill = color;
            el.dataset.amount = part.amount;
            count++;
          }
        });
      });
      matchedCount += count;
      summaries.push(`${tokens.join(', ')} → ${part.amount || '수치 없음'} / ${count}개 지역`);
    });
  });

  // 최종 칠해진 지도 기준으로 수치 박스를 다시 만들기 때문에
  // 지도 색과 박스 색이 서로 다르게 나오는 문제가 없습니다.
  rebuildAmountLabelGroupsFromMap();
  renderAmountLabels({ignoreSaved:true});
  renderMountainIcons();
  renderRainLegend();

  const box = document.getElementById('matchResult');
  box.innerHTML = matchedCount
    ? `매칭 완료: ${matchedCount}개 지역<br>${summaries.join('<br>')}`
    : '매칭된 지역이 없습니다. 지역명 표기를 확인해 주세요.';

  // Ver.1.8.1: 지도 매칭 적용 완료/실패 효과음
  if (matchedCount > 0 && typeof window.playUiDoneSound === 'function') {
    window.playUiDoneSound();
  } else if (matchedCount === 0 && typeof window.playUiErrorSound === 'function') {
    window.playUiErrorSound();
  }
}



function stripHtmlToText(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,noscript').forEach(el => el.remove());
  return (doc.body ? doc.body.innerText : doc.documentElement.innerText || '')
    .replace(/\r/g, '')
    .replace(/[ \t]+/g, ' ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function normalizeKmaRainText(text) {
  return String(text || '')
    .replace(/\r/g, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/[ \t]+/g, ' ')
    // 제목/지역 줄이 한 줄로 붙어서 들어오는 경우 강제 줄바꿈
    .replace(/\s*[※*]\s*(소나기에\s*의한\s*)?예상\s*강수량\s*/g, '\n* $1예상 강수량')
    .replace(/\s*-\s*\(/g, '\n- (')
    .replace(/\s*□\s*/g, '\n□ ')
    .replace(/\s*○\s*/g, '\n○ ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function getTodayKoreaDayNumber() {
  // 한국 기준 오늘 날짜만 사용합니다. PC 시간이 달라도 Asia/Seoul 기준으로 계산합니다.
  const parts = new Intl.DateTimeFormat('ko-KR', {
    timeZone: 'Asia/Seoul',
    day: 'numeric'
  }).formatToParts(new Date());
  const dayPart = parts.find(p => p.type === 'day');
  return dayPart ? parseInt(dayPart.value, 10) : new Date().getDate();
}

function rainfallTitleMatchesToday(titleLine, todayDay) {
  const line = String(titleLine || '');
  const m = line.match(/예상\s*강수량\s*\(([^)]*)\)/);
  if (!m) return true; // 날짜가 없는 제목은 현재 예보로 보고 사용

  const inside = m[1].replace(/\s/g, '');
  const nums = [...inside.matchAll(/(\d{1,2})\s*일?/g)].map(v => parseInt(v[1], 10));
  if (!nums.length) return true;

  // 예: (4일), (4~6일), (4일부터), (4일 밤~5일)
  if (nums.length === 1) {
    if (/부터/.test(inside)) return todayDay >= nums[0];
    return nums[0] === todayDay;
  }

  const start = nums[0];
  const end = nums[nums.length - 1];
  if (start <= end) return todayDay >= start && todayDay <= end;
  // 월말을 넘어가는 범위 예: 30~1일
  return todayDay >= start || todayDay <= end;
}

function extractRainfallTextFromNotice(text, onlyToday) {
  const normalized = normalizeKmaRainText(text);
  const lines = normalized.split(/\n+/).map(v => v.trim()).filter(Boolean);
  const blocks = [];
  let current = null;
  let grabbing = false;

  function isRainTitle(line) {
    return /^[※*]\s*(소나기에\s*의한\s*)?예상\s*강수량/.test(line) || /^예상\s*강수량/.test(line);
  }
  function isRainAreaLine(line) {
    return /^-\s*\([^)]*\).*mm/.test(line) || /^-\s*.*:\s*.*mm/.test(line);
  }
  function isStopLine(line) {
    if (isRainTitle(line) || isRainAreaLine(line)) return false;
    return /^(\*\s*)?(예상\s*적설|최저기온|최고기온|아침최저|낮최고|기온|하늘상태|강수확률|파고|해상|기상\s*전망|유의사항|특보|안개|돌풍|너울|황사|건조|폭염|열대야|현재위치|예보요소|□|○)/.test(line);
  }
  function pushCurrent() {
    if (current && current.lines.some(isRainAreaLine)) blocks.push(current);
    current = null;
  }

  for (const line of lines) {
    if (isRainTitle(line)) {
      pushCurrent();
      grabbing = true;
      const title = line.replace(/^[※]\s*/, '* ').replace(/^예상/, '* 예상');
      current = { title, lines: [title] };
      continue;
    }

    if (grabbing && isRainAreaLine(line)) {
      if (!current) current = { title: '', lines: [] };
      current.lines.push(line);
      continue;
    }

    if (grabbing && isStopLine(line)) {
      pushCurrent();
      grabbing = false;
      continue;
    }

    // 제목 없이 지역 줄만 잡히는 경우도 대비
    if (!grabbing && isRainAreaLine(line) && /mm/.test(line)) {
      if (!current) current = { title: '', lines: [] };
      current.lines.push(line);
    }
  }
  pushCurrent();

  let selectedBlocks = blocks;
  if (onlyToday) {
    const todayDay = getTodayKoreaDayNumber();
    selectedBlocks = blocks.filter(b => rainfallTitleMatchesToday(b.title, todayDay));
  }

  return selectedBlocks
    .map(b => b.lines.join('\n'))
    .join('\n\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function __withNoCache(u) {
  const sep = u.includes('?') ? '&' : '?';
  return u + sep + '_t=' + Date.now();
}

async function __fetchOneText(u, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 9000);
  try {
    const res = await fetch(__withNoCache(u), {
      cache: 'no-store',
      signal: controller.signal,
      headers: { 'Accept': 'text/html,text/plain,application/json,*/*' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let text = await res.text();

    // allorigins / 일부 프록시는 { contents: "..." } JSON으로 반환합니다.
    const trimmed = text.trim();
    if (trimmed.startsWith('{') && trimmed.includes('contents')) {
      try {
        const json = JSON.parse(trimmed);
        if (json && json.contents) text = json.contents;
      } catch (e) {}
    }
    return text || '';
  } finally {
    clearTimeout(timer);
  }
}

async function fetchTextWithFallback(url, onTry) {
  // 1순위: Jina Reader. 기상청 CORS를 우회하면서 본문 텍스트를 잘 뽑아줍니다.
  // 2순위: 공개 CORS 프록시들. 하나가 막히면 다음 것으로 자동 재시도합니다.
  const urls = [
    'https://r.jina.ai/' + url,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
    'https://api.allorigins.win/get?url=' + encodeURIComponent(url),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
    'https://corsproxy.io/?' + encodeURIComponent(url),
    'https://thingproxy.freeboard.io/fetch/' + url,
    url
  ];

  let lastError = null;
  for (let i = 0; i < urls.length; i++) {
    const u = urls[i];
    try {
      if (onTry) onTry(i + 1, urls.length);
      const text = await __fetchOneText(u, 10000);
      if (text && text.length > 100 && /(예상\s*강수량|강수량|mm)/.test(text)) {
        return text;
      }
      lastError = new Error('예상 강수량 문구 없음');
    } catch (err) {
      lastError = err;
    }
  }
  throw lastError || new Error('불러오기 실패');
}

async function loadRainfallFromKma() {

  const urls = [
    'https://www.weather.go.kr/w/forecast/overall/short-term.do',
    'https://www.weather.go.kr/w/forecast/notice.do'
  ];

  const todayDay = getTodayKoreaDayNumber();
  box.innerHTML = '기상청 오늘 예상 강수량을 자동으로 불러오는 중입니다...';

  for (let pageNo = 0; pageNo < urls.length; pageNo++) {
    const url = urls[pageNo];
    try {
      const html = await fetchTextWithFallback(url, (tryNo, totalTry) => {
        box.innerHTML = '기상청 오늘 예상 강수량 자동 불러오기 중입니다...<br>' +
                        '오늘 날짜: ' + todayDay + '일<br>' +

                        ', 경로 ' + tryNo + '/' + totalTry + ' 시도 중';
      });
      const plain = stripHtmlToText(html);

      // 오늘 날짜 제목이 따로 안 잡히는 경우에는 전체 강수량을 한 번 더 추출합니다.
      if (!rain || !/mm/.test(rain)) {

      if (rain && /mm/.test(rain)) {
        input.value = rain;
        box.innerHTML = '오늘 예상 강수량을 입력 박스에 넣고 지도 매칭까지 실행합니다...';
        applyForecastMatch();
        return;
      }
    } catch (err) {
      // 다음 주소로 계속 시도
    }
  }

  box.innerHTML = '자동 불러오기에 실패했습니다.<br>현재 PC/브라우저에서 외부 프록시 접속이 막혔거나 기상청 페이지 형식이 바뀐 상태일 수 있습니다.';
}

// ===== 기상청 불러오기 안정화 버전 =====
// 위쪽에 같은 이름 함수가 있어도 아래 함수가 최종 적용됩니다.
function __kmaPlainText(raw) {
  let text = String(raw || '');
  const trimmed = text.trim();
  if (trimmed.startsWith('{') && trimmed.includes('contents')) {
    try {
      const json = JSON.parse(trimmed);
      text = json.contents || json.data || text;
    } catch(e) {}
  }
  if (/<html|<body|<div|<script/i.test(text)) {
    try { text = stripHtmlToText(text); } catch(e) {}
  }
  return String(text || '')
    .replace(/\r/g, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/\u00a0/g, ' ')
    .replace(/[ \t]+/g, ' ')
    .replace(/\s*[※*]\s*(소나기에\s*의한\s*)?예상\s*강수량\s*/g, '\n* $1예상 강수량')
    .replace(/\s*-\s*\(/g, '\n- (')
    .replace(/\s*□\s*/g, '\n□ ')
    .replace(/\s*○\s*/g, '\n○ ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function __extractKmaRainBlocks(raw) {
  const text = __kmaPlainText(raw);
  const lines = text.split(/\n+/).map(v => v.trim()).filter(Boolean);
  const result = [];
  let grab = false;
  let current = [];

  function isTitle(line) {
    return /^(\*\s*)?(소나기에\s*의한\s*)?예상\s*강수량/.test(line) ||
           /^※\s*(소나기에\s*의한\s*)?예상\s*강수량/.test(line);
  }
  function isArea(line) {
    return /^-\s*\([^)]*\).*\d+\s*(~|∼|-)\s*\d+\s*mm/.test(line) ||
           /^-\s*\([^)]*\).*\d+\s*mm/.test(line) ||
           /^-\s*.*:\s*.*\d+\s*mm/.test(line);
  }
  function isStop(line) {
    if (isTitle(line) || isArea(line)) return false;
    return /^(\*\s*)?(예상\s*적설|최저기온|최고기온|기온|파고|해상|예보요소|현재위치|유의사항|특보|안개|폭염|열대야|너울|풍랑|□|○)/.test(line);
  }
  function flush() {
    if (current.some(isArea)) result.push(current.join('\n'));
    current = [];
  }

  for (const line of lines) {
    if (isTitle(line)) {
      flush();
      grab = true;
      current.push(line.replace(/^※\s*/, '* ').replace(/^예상/, '* 예상'));
      continue;
    }
    if (grab && isArea(line)) {
      current.push(line);
      continue;
    }
    if (grab && isStop(line)) {
      flush();
      grab = false;
      continue;
    }
  }
  flush();

  let out = result.join('\n\n').trim();

  // 줄바꿈이 깨져서 전체가 한 줄로 들어온 경우를 위한 최종 보정
  if (!out || !/mm/.test(out)) {
    const fixed = text
      .replace(/(\*\s*(?:소나기에\s*의한\s*)?예상\s*강수량\([^)]*\))/g, '\n$1')
      .replace(/(-\s*\([^)]*\))/g, '\n$1');
    const arr = fixed.split(/\n+/).map(v => v.trim()).filter(Boolean);
    const temp = [];
    let on = false;
    for (const line of arr) {
      if (isTitle(line)) { on = true; temp.push(line); continue; }
      if (on && isArea(line)) { temp.push(line); continue; }
      if (on && isStop(line)) on = false;
    }
    out = temp.join('\n').trim();
  }

  return out;
}

async function __fetchOneText(u, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 12000);
  try {
    const res = await fetch(__withNoCache(u), {
      cache: 'no-store',
      signal: controller.signal,
      headers: { 'Accept': 'text/html,text/plain,application/json,*/*' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.text();
  } finally {
    clearTimeout(timer);
  }
}

async function fetchTextWithFallback(url, onTry) {
  const encoded = encodeURIComponent(url);
  const urls = [
    'https://r.jina.ai/' + url,
    'https://api.allorigins.win/raw?url=' + encoded,
    'https://api.allorigins.win/get?url=' + encoded,
    'https://api.codetabs.com/v1/proxy?quest=' + encoded,
    'https://api.codetabs.com/v1/proxy/?quest=' + encoded,
    'https://corsproxy.io/?' + encoded,
    'https://corsproxy.io/?url=' + encoded,
    'https://thingproxy.freeboard.io/fetch/' + url
  ];
  let lastError = null;
  for (let i = 0; i < urls.length; i++) {
    try {
      if (onTry) onTry(i + 1, urls.length);
      const raw = await __fetchOneText(urls[i], 12000);
      const plain = __kmaPlainText(raw);
      if (plain && plain.length > 80 && /(예상\s*강수량|소나기).*mm|mm/.test(plain)) return raw;
      lastError = new Error('예상 강수량 문구 없음');
    } catch(err) {
      lastError = err;
    }
  }
  throw lastError || new Error('불러오기 실패');
}

function __formatKmaNoticeTime(raw) {
  const text = __kmaPlainText(raw || '').replace(/\s+/g, ' ').trim();

  // 기상청 예보통보문 표기 예:
  // 2026년 07월 05일 (일)요일 17:00 발표
  // 2026년 07월 05일 (일) 17:00 발표
  // 2026.07.05. 17:00 발표
  let m = text.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(?:\(([^)]*)\)\s*요일|\(([^)]*)\)|([월화수목금토일])요일)?\s*(\d{1,2})\s*:\s*(\d{2})\s*발표/);
  if (m) {
    const y = m[1];
    const mo = String(parseInt(m[2], 10)).padStart(2, '0');
    const d = String(parseInt(m[3], 10)).padStart(2, '0');
    const dow = m[4] || m[5] || m[6] || '';
    const hh = String(parseInt(m[7], 10)).padStart(2, '0');
    const mm = String(parseInt(m[8], 10)).padStart(2, '0');
    return y + '년 ' + mo + '월 ' + d + '일 ' + (dow ? '(' + dow + ')요일 ' : '') + hh + ':' + mm + ' 발표';
  }

  m = text.match(/(\d{4})\s*[.\-/]\s*(\d{1,2})\s*[.\-/]\s*(\d{1,2})\s*\.?\s*(?:\(([^)]*)\))?\s*(\d{1,2})\s*:\s*(\d{2})\s*발표/);
  if (m) {
    const y = m[1];
    const mo = String(parseInt(m[2], 10)).padStart(2, '0');
    const d = String(parseInt(m[3], 10)).padStart(2, '0');
    const dow = m[4] || '';
    const hh = String(parseInt(m[5], 10)).padStart(2, '0');
    const mm = String(parseInt(m[6], 10)).padStart(2, '0');
    return y + '년 ' + mo + '월 ' + d + '일 ' + (dow ? '(' + dow + ')요일 ' : '') + hh + ':' + mm + ' 발표';
  }

  // 날짜가 안 잡혀도 발표 시각만 있으면 표시
  m = text.match(/(\d{1,2})\s*:\s*(\d{2})\s*발표/);
  if (m) {
    return String(parseInt(m[1], 10)).padStart(2, '0') + ':' + m[2] + ' 발표';
  }
  return '';
}

function __kmaDateInfo(dayOffset) {
  const d = new Date();
  d.setDate(d.getDate() + Number(dayOffset || 0));
  return {
    date: d,
    day: d.getDate(),
    month: d.getMonth() + 1,
    label: dayOffset === 1 ? '내일' : '오늘'
  };
}

function __lineDateMatches(line, dayOffset) {
  const info = __kmaDateInfo(dayOffset);
  const t = String(line || '').replace(/\s+/g, '');
  const day = info.day;
  const month = info.month;

  // 날짜가 없는 강수량 제목은 오늘/내일이 명확하지 않으므로 공통 후보로 인정합니다.
  const hasAnyDay = /\d{1,2}일/.test(t) || /\d{1,2}월\d{1,2}일/.test(t);
  if (!hasAnyDay) return true;

  // 5~6일, 5∼6일, 5-6일처럼 기간으로 표기된 줄도 선택 날짜에 포함되면 인정합니다.
  const rangeRe = /(\d{1,2})(?:~|∼|-|－|–|—)(\d{1,2})일/;
  const m = t.match(rangeRe);
  if (m) {
    const start = Number(m[1]);
    const end = Number(m[2]);
    if (Number.isFinite(start) && Number.isFinite(end) && day >= start && day <= end) return true;
  }

  // 7월5~6일, 7월5일~6일 같은 월 포함 기간도 보정합니다.
  const monthRangeRe = /(\d{1,2})월(\d{1,2})(?:일)?(?:~|∼|-|－|–|—)(\d{1,2})일/;
  const mm = t.match(monthRangeRe);
  if (mm) {
    const mth = Number(mm[1]);
    const start = Number(mm[2]);
    const end = Number(mm[3]);
    if (mth === month && day >= start && day <= end) return true;
  }

  return t.includes(day + '일') || t.includes(month + '월' + day + '일');
}

function __blockKind(block) {
  const first = String(block || '').split(/\n+/).find(Boolean) || '';
  const all = String(block || '');
  if (/소나기/.test(first) || /소나기에\s*의한/.test(all)) return 'shower';
  return 'rain';
}

function __extractKmaRainBlocksDetailed(raw) {
  const text = __kmaPlainText(raw);
  const lines = text.split(/\n+/).map(v => v.trim()).filter(Boolean);
  const blocks = [];
  let current = [];
  let grab = false;

  function isTitle(line) {
    return /^(\*\s*)?(소나기에\s*의한\s*)?예상\s*강수량/.test(line) ||
           /^※\s*(소나기에\s*의한\s*)?예상\s*강수량/.test(line);
  }
  function isArea(line) {
    return /^-\s*\([^)]*\).*\d+\s*(~|∼|-)\s*\d+\s*mm/.test(line) ||
           /^-\s*\([^)]*\).*\d+\s*mm/.test(line) ||
           /^-\s*.*:\s*.*\d+\s*mm/.test(line);
  }
  function isStop(line) {
    if (isTitle(line) || isArea(line)) return false;
    return /^(\*\s*)?(예상\s*적설|최저기온|최고기온|기온|파고|해상|예보요소|현재위치|유의사항|특보|안개|폭염|열대야|너울|풍랑|□|○)/.test(line);
  }
  function flush() {
    if (current.some(isArea)) blocks.push(current.join('\n'));
    current = [];
  }

  for (const line of lines) {
    if (isTitle(line)) {
      flush();
      grab = true;
      current.push(line.replace(/^※\s*/, '* ').replace(/^예상/, '* 예상'));
      continue;
    }
    // 일부 기상청 문구는 제목보다 먼저 '- (제주도, 5~6일) ...' 같은 지역 줄이 나옵니다.
    // 이 줄도 별도 강수량 블록으로 잡아야 30~80mm 일반 강수량이 누락되지 않습니다.
    if (!grab && isArea(line)) {
      flush();
      current.push(line);
      grab = true;
      continue;
    }
    if (grab && isArea(line)) { current.push(line); continue; }
    if (grab && isStop(line)) { flush(); grab = false; continue; }
  }
  flush();

  return blocks.map(block => ({
    text: block,
    kind: __blockKind(block),
    firstLine: (block.split(/\n+/).find(Boolean) || '')
  }));
}

function __filterKmaBlocks(blocks, dayOffset, kind) {
  let filtered = blocks.filter(b => __lineDateMatches(b.firstLine, dayOffset));

  // 날짜 표기가 제목이 아니라 본문 중간에만 있거나, 날짜 표기를 추출 못한 경우 대비
  if (!filtered.length) filtered = blocks;

  if (kind === 'rain') filtered = filtered.filter(b => b.kind === 'rain');
  else if (kind === 'shower') filtered = filtered.filter(b => b.kind === 'shower');
  else filtered = filtered.filter(b => b.kind === 'rain' || b.kind === 'shower');

  return filtered;
}

// 오늘/내일 버튼에서 항목 존재 여부를 확인할 때는 fallback을 쓰지 않습니다.
// 핵심 수정(v7.8): 날짜가 제목이 아니라 본문 줄에만 있는 경우까지 확인하고,
// 날짜가 전혀 없는 소나기/강수 블록은 내일 버튼에서 공통 문구로 착각하지 않게 오늘만 인정합니다.
function __blockDateMatchesStrict(block, dayOffset) {
  const info = __kmaDateInfo(dayOffset);
  const text = String((block && block.text) || block || '').replace(/\s+/g, '');
  const day = info.day;
  const month = info.month;

  const hasAnyDay = /\d{1,2}일/.test(text) || /\d{1,2}월\d{1,2}일/.test(text);
  if (!hasAnyDay) return Number(dayOffset || 0) === 0;

  const rangeRe = /(\d{1,2})(?:~|∼|-|－|–|—)(\d{1,2})일/g;
  let m;
  while ((m = rangeRe.exec(text)) !== null) {
    const start = Number(m[1]);
    const end = Number(m[2]);
    if (Number.isFinite(start) && Number.isFinite(end) && day >= start && day <= end) return true;
  }

  const monthRangeRe = /(\d{1,2})월(\d{1,2})(?:일)?(?:~|∼|-|－|–|—)(\d{1,2})일/g;
  while ((m = monthRangeRe.exec(text)) !== null) {
    const mth = Number(m[1]);
    const start = Number(m[2]);
    const end = Number(m[3]);
    if (mth === month && day >= start && day <= end) return true;
  }

  return text.includes(day + '일') || text.includes(month + '월' + day + '일');
}

function __filterKmaBlocksStrict(blocks, dayOffset, kind) {
  let filtered = blocks.filter(b => __blockDateMatchesStrict(b, dayOffset));

  if (kind === 'rain') filtered = filtered.filter(b => b.kind === 'rain');
  else if (kind === 'shower') filtered = filtered.filter(b => b.kind === 'shower');
  else filtered = filtered.filter(b => b.kind === 'rain' || b.kind === 'shower');

  return filtered;
}

async function loadKmaByDayAndKind(dayOffset, kind) {
  const box = document.getElementById('matchResult');
  const input = document.getElementById('forecastText');
  const info = __kmaDateInfo(dayOffset);
  const kindLabel = kind === 'rain' ? '예상 강수량' : (kind === 'shower' ? '소나기' : '예상 강수량/소나기');
  const urls = [
    'https://www.weather.go.kr/w/forecast/overall/short-term.do',
    'https://www.weather.go.kr/w/forecast/notice.do'
  ];

  __startKmaLoadingTitle();
  if (box) box.innerHTML = '기상청 ' + info.label + ' ' + kindLabel + ' 정보를 불러오는 중입니다...';

  let lastMessage = '';
  for (let pageNo = 0; pageNo < urls.length; pageNo++) {
    try {
      const raw = await fetchTextWithFallback(urls[pageNo], (tryNo, totalTry) => {
        if (box) box.innerHTML = '기상청 ' + info.label + ' ' + kindLabel + ' 불러오는 중입니다...<br>' +
          '페이지 ' + (pageNo + 1) + '/' + urls.length + ', 경로 ' + tryNo + '/' + totalTry + ' 시도 중';
      });
      __stopKmaLoadingTitle(false);
      __updateKmaForecastTimeFromRaw(raw);
      const blocks = __extractKmaRainBlocksDetailed(raw);
      const selected = __filterKmaBlocks(blocks, dayOffset, kind);
      const result = selected.map(b => b.text).join('\n\n').trim();
      if (result && /mm/.test(result)) {
        input.value = result;
        if (box) box.innerHTML = '기상청 ' + info.label + ' ' + kindLabel + ' 정보를 불러왔습니다.<br>지도 매칭을 실행합니다.';
        applyForecastMatch();
        return;
      }
      lastMessage = info.label + ' ' + kindLabel + ' 문구를 찾지 못했습니다.';
    } catch(err) {
      lastMessage = err && err.message ? err.message : String(err);
    }
  }

  __stopKmaLoadingTitle(true);
  if (box) box.innerHTML = '자동 불러오기에 실패했습니다.<br>원인: ' + (lastMessage || '브라우저에서 외부 프록시 접속이 막힘');
}

function __setKmaChoiceButtonVisible(id, visible) {
  const btn = document.getElementById(id);
  if (!btn) return;

  // 모바일 CSS에 display:flex !important가 있어서 일반 display:none이 무시될 수 있습니다.
  // 그래서 버튼 유무는 항상 !important + hidden으로 강제합니다.
  if (visible) {
    btn.hidden = false;
    btn.style.removeProperty('display');
  } else {
    btn.hidden = true;
    btn.style.setProperty('display', 'none', 'important');
  }
}

  const selected = __filterKmaBlocks(blocks, dayOffset, kind);

  const result = selected.map(b => b.text).join('\n\n').trim();

function __applyKmaChoiceAvailability(dayOffset, hasRain, hasShower) {
  const panel = document.getElementById('kmaChoicePanel');
  const title = document.getElementById('kmaChoiceTitle');
  const info = __kmaDateInfo(dayOffset);

  __setKmaChoiceButtonVisible('kmaChoiceRain', hasRain);
  __setKmaChoiceButtonVisible('kmaChoiceShower', hasShower);
  __setKmaChoiceButtonVisible('kmaChoiceBoth', hasRain && hasShower);

  if (title) {
    if (hasRain && hasShower) title.textContent = info.label + ' 불러올 항목 선택';
    else if (hasRain) title.textContent = info.label + ' 예상 강수량만 있습니다';
    else if (hasShower) title.textContent = info.label + ' 소나기만 있습니다';
    else title.textContent = info.label + ' 예상 강수량/소나기 문구 없음';
  }

  if (panel) {
    panel.classList.add('active');
    panel.classList.toggle('no-buttons', !(hasRain || hasShower));

async function showKmaChoice(dayOffset) {
  __resetKmaChoiceForNewDay(dayOffset);
  const input = document.getElementById('forecastText');
  if (input) input.value = '';
  const panel = document.getElementById('kmaChoicePanel');
  const title = document.getElementById('kmaChoiceTitle');
  const info = __kmaDateInfo(__selectedKmaDayOffset);
  const urls = [
    'https://www.weather.go.kr/w/forecast/overall/short-term.do',
    'https://www.weather.go.kr/w/forecast/notice.do'
  ];

  // 날짜를 누른 직후에는 확인 중 글씨만 가운데 표시하고, 실제 있는 버튼만 나중에 보여줍니다.
  __setKmaChoiceNoButtons(info.label + ' 강수 항목 확인 중...');

  let lastError = '';
  for (let pageNo = 0; pageNo < urls.length; pageNo++) {
    try {
      const raw = await fetchTextWithFallback(urls[pageNo]);
      __updateKmaForecastTimeFromRaw(raw);
      const blocks = __extractKmaRainBlocksDetailed(raw);
      const hasRain = __hasKmaKindStrict(blocks, __selectedKmaDayOffset, 'rain');
      const hasShower = __hasKmaKindStrict(blocks, __selectedKmaDayOffset, 'shower');
      __applyKmaChoiceAvailability(__selectedKmaDayOffset, hasRain, hasShower);
      return;
    } catch (err) {
      lastError = err && err.message ? err.message : String(err);
    }
  }

  __setKmaChoiceNoButtons(info.label + ' 강수 항목 확인 실패');
  console.warn('KMA choice check failed:', lastError);
}

function isMobileMapView() {
  return window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
}
function defaultMapView() {
  // PC는 기존 120% 시작, 휴대폰은 더 타이트한 145% 시작
  return isMobileMapView() ? {x:-210, y:-250, k:1.45} : {x:-90, y:-110, k:1.2};
}
function mapViewStorageKey() {
  return isMobileMapView() ? 'kmaRainMapView_mobile' : 'kmaRainMapView_pc';
}
function normalizeMapView(v) {
  if (!v || !Number.isFinite(v.x) || !Number.isFinite(v.y) || !Number.isFinite(v.k)) return null;
  return {
    x: Number(v.x),
    y: Number(v.y),
    k: Math.max(0.7, Math.min(12, Number(v.k)))
  };
}
function loadSavedMapView() {
  try {
    const raw = localStorage.getItem(mapViewStorageKey());
    if (!raw) return null;
    return normalizeMapView(JSON.parse(raw));
  } catch(e) {
    return null;
  }
}
function saveMapView() {
  try {
    const v = normalizeMapView(view);
    if (v) localStorage.setItem(mapViewStorageKey(), JSON.stringify(v));
  } catch(e) {}
}
function clearSavedMapView() {
  try {
    localStorage.removeItem(mapViewStorageKey());
  } catch(e) {}
}

let view = loadSavedMapView() || defaultMapView();
let viewRaf = 0;
function applyView() {
  if (viewRaf) return;
  viewRaf = requestAnimationFrame(() => {
    viewport.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
    viewRaf = 0;
  });
}

function zoomMapAtSvgPoint(cx, cy, factor) {
  const oldK = view.k;
  const newK = Math.max(0.7, Math.min(12, oldK * factor));
  if (newK === oldK) return;
  view.x = cx - (cx - view.x) * (newK / oldK);
  view.y = cy - (cy - view.y) * (newK / oldK);
  view.k = newK;
  applyView();
  saveMapView();
}

// iPhone/Safari에서 손가락 확대가 페이지 전체 확대가 되지 않도록 차단합니다.
// 지도 이동 ON 상태에서는 아래 touchmove 로직이 지도 안의 한반도만 확대/이동합니다.
document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});

svg.addEventListener('wheel', e => {
  if (!mapMoveEnabled) return;
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.88;
  const oldK = view.k;
  const newK = Math.max(0.7, Math.min(12, oldK * factor));
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * WIDTH;
  const my = (e.clientY - rect.top) / rect.height * HEIGHT;
  view.x = mx - (mx - view.x) * (newK / oldK);
  view.y = my - (my - view.y) * (newK / oldK);
  view.k = newK;
  applyView();
  saveMapView();
}, {passive:false});

let dragging = false, last = null;
svg.addEventListener('mousedown', e => {
  if (!mapMoveEnabled) return;
  if (labelMoveMode) return;
  if (e.target.closest && (e.target.closest('.amount-label-group') || e.target.closest('.mountain-icon-group'))) return;
  dragging = true;
  svg.classList.add('panning');
  last = {x:e.clientX, y:e.clientY};
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const rect = svg.getBoundingClientRect();
  view.x += (e.clientX - last.x) / rect.width * WIDTH;
  view.y += (e.clientY - last.y) / rect.height * HEIGHT;
  last = {x:e.clientX, y:e.clientY};
  applyView();
});
window.addEventListener('mouseup', () => { if (dragging) saveMapView(); dragging = false; svg.classList.remove('panning'); });

let lastTapTime = 0;
svg.addEventListener('touchend', e => {
  if (!mapMoveEnabled || touchMode === 'pinch') return;
  const now = Date.now();
  if (now - lastTapTime < 280 && e.changedTouches && e.changedTouches.length) {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    const t = e.changedTouches[0];
    const cx = (t.clientX - rect.left) / rect.width * WIDTH;
    const cy = (t.clientY - rect.top) / rect.height * HEIGHT;
    zoomMapAtSvgPoint(cx, cy, 1.35);
    lastTapTime = 0;
  } else {
    lastTapTime = now;
  }
}, {passive:false});

// Mobile touch pan / pinch zoom
let touchMode = null, touchLast = null, touchStartDist = 0, touchStartK = 1;
function touchPoint(t){ return {x:t.clientX, y:t.clientY}; }
function touchDistance(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
svg.addEventListener('touchstart', e => {
  if (!mapMoveEnabled) return;
  if (labelMoveMode) { e.preventDefault(); return; }
  if (e.target.closest && (e.target.closest('.amount-label-group') || e.target.closest('.mountain-icon-group'))) return;
  if (e.touches.length === 1) {
    touchMode = 'pan';
    touchLast = touchPoint(e.touches[0]);
    svg.classList.add('panning');
  } else if (e.touches.length >= 2) {
    touchMode = 'pinch';
    touchStartDist = touchDistance(e.touches[0], e.touches[1]);
    touchStartK = view.k;
  }
}, {passive:false});
svg.addEventListener('touchmove', e => {
  if (!touchMode) return;
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  if (touchMode === 'pan' && e.touches.length === 1) {
    const p = touchPoint(e.touches[0]);
    view.x += (p.x - touchLast.x) / rect.width * WIDTH;
    view.y += (p.y - touchLast.y) / rect.height * HEIGHT;
    touchLast = p;
    applyView();
  } else if (e.touches.length >= 2) {
    const dist = touchDistance(e.touches[0], e.touches[1]);
    const newK = Math.max(0.7, Math.min(12, touchStartK * (dist / Math.max(1, touchStartDist))));
    const cx = ((e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left) / rect.width * WIDTH;
    const cy = ((e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top) / rect.height * HEIGHT;
    const oldK = view.k;
    view.x = cx - (cx - view.x) * (newK / oldK);
    view.y = cy - (cy - view.y) * (newK / oldK);
    view.k = newK;
    applyView();
  }
}, {passive:false});
window.addEventListener('touchend', () => { if (touchMode) saveMapView(); touchMode = null; touchLast = null; svg.classList.remove('panning'); }, {passive:true});
window.addEventListener('touchcancel', () => { if (touchMode) saveMapView(); touchMode = null; touchLast = null; svg.classList.remove('panning'); }, {passive:true});

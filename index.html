// ===== 지도 이미지 저장 =====
// 사용자가 올려준 예시처럼 PC/휴대폰 모두 같은 비율의 PNG로 저장합니다.
// 화면에 보이는 모바일 CSS 크기가 아니라 SVG 지도 전체 + 수치 + 산지 아이콘을 기준으로 저장합니다.
function saveCurrentMapImage() {
  const btn = document.getElementById('saveImageBtn');
  if (btn) btn.classList.add('btn-active');

  try {
    const originalSvg = document.getElementById('map');
    const mapWrap = document.querySelector('.mapwrap') || (originalSvg && originalSvg.parentElement);
    if (!originalSvg || !mapWrap) throw new Error('map element not found');

    // 저장 직전 현재 지도 이동/확대값을 실제 SVG에 강제 반영합니다.
    try {
      if (typeof viewRaf !== 'undefined' && viewRaf) { cancelAnimationFrame(viewRaf); viewRaf = 0; }
      const liveViewport = originalSvg.querySelector('#viewport');
      if (liveViewport && typeof view !== 'undefined') {
        liveViewport.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
      }
    } catch (_) {}

    const rect = mapWrap.getBoundingClientRect();
    const outW = Math.max(1, Math.round(rect.width || originalSvg.clientWidth || 900));
    const outH = Math.max(1, Math.round(rect.height || originalSvg.clientHeight || 520));

    // 아이폰에서도 화면에 보이는 비율과 위치가 그대로 나오도록 DPR은 선명도에만 사용합니다.
    const S = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const isMobileExport = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
    // Ver.1.8.1: 휴대폰 저장 때만 한반도를 1.25배로 저장합니다.
    const EXPORT_MOBILE_ZOOM = 1.25;
    const EXPORT_ZOOM = isMobileExport ? EXPORT_MOBILE_ZOOM : 1;
    const EXPORT_CENTER_X = WIDTH / 2;
    const EXPORT_CENTER_Y = HEIGHT / 2;

    const clonedSvg = originalSvg.cloneNode(true);
    clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clonedSvg.setAttribute('width', String(outW));
    clonedSvg.setAttribute('height', String(outH));
    // iPhone 저장 시 하단 라벨/산지 아이콘이 잘리는 문제 방지용 저장 전용 여백입니다.
    // 화면 비율은 유지하되 SVG viewBox 바깥으로 살짝 나간 요소까지 PNG에 들어오게 합니다.
    const EXPORT_PAD_X = 28;
    const EXPORT_PAD_TOP = 38;
    const EXPORT_PAD_BOTTOM = 300;
    clonedSvg.setAttribute('viewBox', `${-EXPORT_PAD_X} ${-EXPORT_PAD_TOP} ${WIDTH + EXPORT_PAD_X * 2} ${HEIGHT + EXPORT_PAD_TOP + EXPORT_PAD_BOTTOM}`);
    clonedSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    clonedSvg.setAttribute('overflow', 'visible');
    clonedSvg.removeAttribute('style');
    clonedSvg.style.background = '#ffffff';

    const clonedViewport = clonedSvg.querySelector('#viewport');
    if (clonedViewport && typeof view !== 'undefined') {
      const exportK = view.k * EXPORT_ZOOM;
      const exportX = (view.x * EXPORT_ZOOM) + ((1 - EXPORT_ZOOM) * EXPORT_CENTER_X);
      const exportY = (view.y * EXPORT_ZOOM) + ((1 - EXPORT_ZOOM) * EXPORT_CENTER_Y);
      clonedViewport.setAttribute('transform', `translate(${exportX} ${exportY}) scale(${exportK})`);
    }

    const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = `
      .region { shape-rendering:geometricPrecision; fill:#ffffff; stroke:#6F6F6F; stroke-width:0.28; vector-effect:non-scaling-stroke; }
      .region.matched { stroke:#666666; stroke-width:0.28; }
      .region.selected { fill:#ffe08a; }
      .coastline { fill:none; stroke:#111111; stroke-width:0.95; vector-effect:non-scaling-stroke; opacity:0.98; stroke-linejoin:round; stroke-linecap:round; }
      .sido-boundary { fill:none; stroke:#222222; stroke-width:0.85; vector-effect:non-scaling-stroke; opacity:0.95; stroke-linejoin:round; stroke-linecap:round; }
      .amount-label-box { stroke:#111; stroke-width:1.1; rx:6; ry:6; vector-effect:non-scaling-stroke; }
      .amount-label { font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif; font-size:18px; font-weight:900; fill:#ffffff; stroke:#000000; stroke-width:1.2px; paint-order:stroke fill; stroke-linejoin:round; text-anchor:middle; dominant-baseline:middle; }
      .mountain-triangle { stroke:#000; stroke-width:0.8; vector-effect:non-scaling-stroke; }
      .mountain-text { fill:#fff; stroke:#000; stroke-width:1.2px; paint-order:stroke fill; stroke-linejoin:round; font-family:'Malgun Gothic','맑은 고딕'; font-weight:900; font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .region { stroke:#AEB8C3 !important; stroke-width:0.24 !important; stroke-linejoin:round !important; stroke-linecap:round !important; }
      .region.matched { stroke:#5B6675 !important; stroke-width:0.34 !important; }
      .coastline { stroke:#0F2A44 !important; stroke-width:1.05 !important; opacity:.96 !important; stroke-linejoin:round !important; stroke-linecap:round !important; }
      .sido-boundary { stroke:#2F3A46 !important; stroke-width:0.88 !important; opacity:.86 !important; stroke-linejoin:round !important; stroke-linecap:round !important; }
      .amount-label-box { stroke:#111827 !important; stroke-width:1.25 !important; }

    `;
    clonedSvg.insertBefore(style, clonedSvg.firstChild);

    const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgRect.setAttribute('x', String(-EXPORT_PAD_X));
    bgRect.setAttribute('y', String(-EXPORT_PAD_TOP));
    bgRect.setAttribute('width', String(WIDTH + EXPORT_PAD_X * 2));
    bgRect.setAttribute('height', String(HEIGHT + EXPORT_PAD_TOP + EXPORT_PAD_BOTTOM));
    bgRect.setAttribute('fill', '#ffffff');
    clonedSvg.insertBefore(bgRect, clonedSvg.querySelector('#viewport') || clonedSvg.firstChild.nextSibling);

    const svgText = new XMLSerializer().serializeToString(clonedSvg);
    const svgBlob = new Blob([svgText], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();

    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(outW * S);
      canvas.height = Math.round(outH * S);
      const ctx = canvas.getContext('2d');

      // CSS 픽셀 좌표계로 그립니다. 그래서 화면 박스와 저장 이미지가 1:1로 맞습니다.
      ctx.setTransform(S, 0, 0, S, 0, 0);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, outW, outH);
      ctx.drawImage(img, 0, 0, outW, outH);
      URL.revokeObjectURL(url);

      // 화면 오른쪽 아래에 보이는 자동 인덱스가 있으면, 화면 크기 그대로 다시 그립니다.
      // 기존처럼 저장 이미지에서 인덱스가 커지거나 위치가 밀리는 문제를 막습니다.
      try {
        drawVisibleMapLegend(ctx, mapWrap, outW, outH);
      } catch (e) {
        console.warn('legend draw skipped', e);
      }

      canvas.toBlob(function(blob) {
        if (!blob) {
          if (btn) btn.classList.remove('btn-active');
          alert('이미지 저장에 실패했습니다.');
          return;
        }
        const pngUrl = URL.createObjectURL(blob);
        const d = new Date();
        const fileName = `kma_map_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.png`;
        const a = document.createElement('a');
        a.href = pngUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(pngUrl), 10000);
        setTimeout(() => { if (btn) btn.classList.remove('btn-active'); }, 450);
      }, 'image/png');
    };

    img.onerror = function() {
      URL.revokeObjectURL(url);
      if (btn) btn.classList.remove('btn-active');
      alert('이미지 변환에 실패했습니다. 휴대폰에서는 캡쳐를 사용해주세요.');
    };

    img.src = url;
  } catch (err) {
    console.error(err);
    if (btn) btn.classList.remove('btn-active');
    alert('이미지 저장 중 오류가 발생했습니다.');
  }
}

function drawVisibleMapLegend(ctx, mapWrap, outW, outH) {
  const legendBox = document.getElementById('mapLegendBox');
  const rainLegend = document.getElementById('rainLegend');
  if (!legendBox || !rainLegend) return;
  const st = getComputedStyle(legendBox);
  if (st.display === 'none' || st.visibility === 'hidden' || legendBox.offsetWidth <= 0 || legendBox.offsetHeight <= 0) return;

  const mapRect = mapWrap.getBoundingClientRect();
  const lb = legendBox.getBoundingClientRect();
  let x = Math.round(lb.left - mapRect.left);
  let y = Math.round(lb.top - mapRect.top);
  const legendAmounts = ((typeof getSortedLegendAmounts === 'function') ? getSortedLegendAmounts() : (amountColorOrder || []))
    .map(amount => ({ amount, label: displayAmountNoMm(amount) }))
    .filter(item => item.label);
  if (!legendAmounts.length) return;

  const isMobile = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
  const fontSize = isMobile ? 9 : 9;
  const unitFontSize = isMobile ? 7.5 : 7.5;
  const chipW = isMobile ? 9 : 9;
  const chipH = isMobile ? 8 : 8;
  const rowH = isMobile ? 11 : 11;
  const unitH = isMobile ? 9 : 9;
  const padX = isMobile ? 4 : 4;
  const padY = isMobile ? 3 : 3;
  const gap = 3;
  const unitText = '(단위:mm)';

  ctx.save();
  ctx.font = `800 ${fontSize}px Malgun Gothic, Arial, sans-serif`;
  const maxTextW = Math.max(...legendAmounts.map(item => ctx.measureText(item.label).width));
  ctx.font = `800 ${unitFontSize}px Malgun Gothic, Arial, sans-serif`;
  const unitW = ctx.measureText(unitText).width;
  ctx.font = `800 ${fontSize}px Malgun Gothic, Arial, sans-serif`;
  let w = Math.ceil(padX * 2 + Math.max(chipW + gap + maxTextW, unitW));
  let h = Math.ceil(padY * 2 + legendAmounts.length * rowH + unitH);
  if (w <= 0 || h <= 0) { ctx.restore(); return; }

  // 혹시 경계 밖으로 나가면 화면 안으로 보정합니다.
  x = Math.max(0, Math.min(outW - w, x));
  y = Math.max(0, Math.min(outH - h, y));

  ctx.globalAlpha = 0.96;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#888888';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#111111';

  let cy = y + padY + rowH / 2;
  legendAmounts.forEach((item) => {
    const color = amountColorMap[item.amount] || '#ffffff';
    ctx.fillStyle = color;
    ctx.fillRect(x + padX, cy - chipH / 2, chipW, chipH);
    ctx.strokeStyle = '#888888';
    ctx.strokeRect(x + padX + 0.5, cy - chipH / 2 + 0.5, chipW - 1, chipH - 1);
    ctx.fillStyle = '#111111';
    ctx.fillText(item.label, x + padX + chipW + gap, cy + 0.5);
    cy += rowH;
  });

  ctx.font = `800 ${unitFontSize}px Malgun Gothic, Arial, sans-serif`;
  ctx.fillStyle = '#333333';
  ctx.textBaseline = 'top';
  ctx.fillText(unitText, x + w - padX - unitW, y + padY + legendAmounts.length * rowH + 0.5);

  ctx.restore();
}

// 수동매칭 별칭: 예보문에 다른 표현이 와도 대표 예보구역으로 인식합니다.
// 예: 충남남동내륙 (충남동부) (충남동부내륙)
const DEFAULT_MANUAL_REGION_ALIASES = {};

function manualRegionAliasStorageKey(regionName) {
  return 'kmaManualRegionAliases_v2_' + normText(regionName);
}

function getSavedManualRegionAliases(regionName) {
  try {
    const raw = localStorage.getItem(manualRegionAliasStorageKey(regionName));
    const arr = raw ? JSON.parse(raw) : null;
    return Array.isArray(arr) ? arr.map(normText).filter(Boolean) : [];
  } catch(e) {
    return [];
  }
}

function getManualRegionAliases(regionName) {
  const key = normText(regionName);
  const base = DEFAULT_MANUAL_REGION_ALIASES[key] || [];
  const saved = getSavedManualRegionAliases(key);
  const hiddenAliases = new Set(['강원중.남부내륙','강원중남부내륙']);
  return Array.from(new Set([...base, ...saved].map(normText).filter(Boolean).filter(v => v !== key).filter(v => !hiddenAliases.has(v))));
}

function saveManualRegionAliases(regionName, aliases) {
  try {
    const key = normText(regionName);
    const base = new Set((DEFAULT_MANUAL_REGION_ALIASES[key] || []).map(normText));
    const cleaned = Array.from(new Set((aliases || []).map(normText).filter(Boolean).filter(v => v !== key)));
    // 기본 별칭은 코드에 이미 들어 있으므로 추가 저장에는 기본값 외 별칭만 저장합니다.
    const extra = cleaned.filter(v => !base.has(v));
    localStorage.setItem(manualRegionAliasStorageKey(key), JSON.stringify(extra));
  } catch(e) {}
}

function manualRegionDisplayName(regionName) {
  const key = normText(regionName);
  const aliases = getManualRegionAliases(key);
  return key + aliases.map(a => ' (' + a + ')').join('');
}

function manualRegionButtonName(regionName) {
  return normText(regionName);
}

function allManualRegionNames() {
  const names = [];
  Object.keys(MANUAL_REGION_MENU).forEach(zone => (MANUAL_REGION_MENU[zone] || []).forEach(name => names.push(normText(name))));
  return Array.from(new Set(names));
}

function resolveManualRegionCanonical(token) {
  const t = normText(token);
  if (!t) return t;
  const names = allManualRegionNames();
  if (names.includes(t)) return t;
  for (const name of names) {
    if (getManualRegionAliases(name).includes(t)) return name;
  }
  return t;
}

function parseManualAliasText(text) {
  return String(text || '')
    .replace(/[()]/g, ',')
    .split(/[,\n\/]+/)
    .map(normText)
    .filter(Boolean);
}

function editManualRegionAliases(regionName, btn) {
  const key = normText(regionName || currentManualRegionName);
  if (!key) {
    alert('먼저 별칭을 수정할 지역 버튼을 눌러주세요.');
    return;
  }

  const existing = getManualRegionAliases(key).filter(v => normText(v) !== key);
  // Ver.1.8.4-v7.1
  // 치환 수정 입력창에는 대표명(key)을 기본값으로 넣지 않습니다.
  // 대표명은 입력하지 않아도 항상 기본 지역명으로 인식합니다.
  const current = existing.join(' / ');
  const text = prompt(
    key + ' 지역 치환명을 수정하세요.\n예: 충남남동내륙 / 충남남동부 / 충남동부내륙\n\n쉼표, 줄바꿈, / 로 여러 개를 입력할 수 있습니다.\n대표 지역명은 입력하지 않아도 자동으로 인식됩니다.\n입력창에서 지운 치환명은 저장 후 삭제됩니다.',
    current
  );
  if (text === null) return;

  const typed = parseManualAliasText(text);
  // 대표명(key)은 항상 기본으로 인식합니다.
  // 입력창에 남아 있는 치환명만 저장하고, 지운 치환명은 삭제합니다.
  const aliases = Array.from(new Set(typed.map(normText).filter(Boolean).filter(v => v !== key)));
  saveManualRegionAliases(key, aliases);

  if (btn) btn.textContent = manualRegionDisplayName(key);
  if (currentManualRegionName === key) updateManualRegionInfo();
  alert(key + ' 지역 치환명을 저장했습니다.');
}

function saveCurrentManualRegionAliases() {

}

let currentManualRegionName = '';
let currentManualRegionPaths = [];

function manualRegionStorageKey(regionName) {
  return 'kmaManualRegionOverride_v1_' + resolveManualRegionCanonical(normText(regionName));
}

function pathRegionId(p) {
  return (p.dataset.sido || '') + '|' + (p.dataset.sig || p.dataset.name || '') + '|' + (p.dataset.code || '');
}

function getPathDisplayName(p) {
  const sido = p.dataset.sido || '';
  const sig = p.dataset.sig || p.dataset.name || '';
  if (!sido) return sig;
  if (!sig || sig === sido) return sido;
  return sig;
}

function allRegionPaths() {
  return Array.from(document.querySelectorAll('.region'));
}

function findPathById(id) {
  return allRegionPaths().find(p => pathRegionId(p) === id) || null;
}

function getDefaultManualRegionPaths(regionName) {
  const token = resolveManualRegionCanonical(normText(regionName));
  const paths = [];

  document.querySelectorAll('.region').forEach(p => {
    const sido = p.dataset.sido || '';
    const sig = p.dataset.sig || p.dataset.name || '';

    let ok = false;
    try { ok = regionMatchesToken(sido, sig, token); } catch(e) { ok = false; }

    if (!ok) {
      const sidoAlias = token === '강원도' ? '강원' : (token === '제주도' ? '제주' : token);
      if (sido === sidoAlias) ok = true;
    }
    if (!ok && (sig === token || sig.startsWith(token))) ok = true;

    if (ok) paths.push(p);
  });
  return paths;
}

function getSavedManualRegionIds(regionName) {
  try {
    const raw = localStorage.getItem(manualRegionStorageKey(regionName));
    const arr = raw ? JSON.parse(raw) : null;
    return Array.isArray(arr) ? arr : null;
  } catch(e) {
    return null;
  }
}

function saveManualRegionIds(regionName, ids) {
  try {
    localStorage.setItem(manualRegionStorageKey(regionName), JSON.stringify(ids));
  } catch(e) {}
}

function clearSavedManualRegion(regionName) {
  try { localStorage.removeItem(manualRegionStorageKey(regionName)); } catch(e) {}
}

function clearManualPreviewPaint() {
  document.querySelectorAll('.region').forEach(p => {
    if (p.dataset.manualPreview === '1') {
      p.style.fill = p.dataset.manualOldFill || '';
      p.classList.toggle('matched', p.dataset.manualOldMatched === '1');
      delete p.dataset.manualPreview;
      delete p.dataset.manualOldFill;
      delete p.dataset.manualOldMatched;
    }
  });
}

function getManualRegionPaths(regionName) {
  const savedIds = getSavedManualRegionIds(regionName);
  if (savedIds) {
    return savedIds.map(findPathById).filter(Boolean);
  }
  return getDefaultManualRegionPaths(regionName);
}

function paintOneManualPath(p) {
  if (p.dataset.manualPreview !== '1') {
    p.dataset.manualOldFill = p.style.fill || '';
    p.dataset.manualOldMatched = p.classList.contains('matched') ? '1' : '0';
    p.dataset.manualPreview = '1';
  }
  p.classList.add('matched');
  p.style.fill = '#000000';
}

function unpaintOneManualPath(p) {
  if (p.dataset.manualPreview === '1') {
    p.style.fill = p.dataset.manualOldFill || '';
    p.classList.toggle('matched', p.dataset.manualOldMatched === '1');
    delete p.dataset.manualPreview;
    delete p.dataset.manualOldFill;
    delete p.dataset.manualOldMatched;
  }
}

function updateManualRegionInfo() {
  const info = document.getElementById('manualRegionIncluded');
  if (!info) return;
  const actions = document.getElementById('manualRegionActions');
  if (actions) actions.style.display = 'flex';

  if (!currentManualRegionName) {
    info.style.display = 'block';
    info.innerHTML = '<b>지역을 선택하세요.</b><br>' +
      '<span style="color:#666;">권역을 누른 뒤 지역 버튼을 선택하면 상세 내용이 표시됩니다.</span><br>' +
      '<span style="color:#666;">지역을 선택한 후 지도에서 시군구를 누르면 추가/해제됩니다.</span>';
    return;
  }

  const names = currentManualRegionPaths.map(getPathDisplayName).filter(Boolean);
  const saved = getSavedManualRegionIds(currentManualRegionName) ? ' <span style="color:#d00;font-weight:900;">저장됨</span>' : '';
  const displayName = manualRegionDisplayName(currentManualRegionName);
  info.style.display = 'block';
  info.innerHTML = '<b>' + displayName + '</b>' + saved + '<br>' +
    (names.length ? names.join(', ') : '매칭 지역 없음') +
    '<br><span style="color:#666;">지도에서 시군구를 누르면 추가/해제됩니다.</span>';
}


function paintManualPreview(regionName) {
  clearManualPreviewPaint();
  currentManualRegionName = regionName;
  currentManualRegionPaths = getManualRegionPaths(regionName);

  currentManualRegionPaths.forEach(p => paintOneManualPath(p));
  updateManualRegionInfo();
}

function isManualRegionEditModeActive() {
  const body = document.getElementById('manualRegionBody');
  return !!(body && body.style.display !== 'none' && currentManualRegionName);
}

function toggleManualRegionPathFromMap(p) {
  if (!isManualRegionEditModeActive()) return false;

  const id = pathRegionId(p);
  const idx = currentManualRegionPaths.findIndex(x => pathRegionId(x) === id);

  if (idx >= 0) {
    currentManualRegionPaths.splice(idx, 1);
    unpaintOneManualPath(p);
  } else {
    currentManualRegionPaths.push(p);
    paintOneManualPath(p);
  }

  updateManualRegionInfo();
  return true;
}

function saveCurrentManualRegion() {
  if (!currentManualRegionName) {
    alert('먼저 저장할 지역 버튼을 눌러주세요.');

  }
  const ids = currentManualRegionPaths.map(pathRegionId);
  saveManualRegionIds(currentManualRegionName, ids);
  updateManualRegionInfo();
  alert(currentManualRegionName + ' 구성을 저장했습니다.');

  clearSavedManualRegion(currentManualRegionName);

function initManualRegionPanel() {
  const toggle = document.getElementById('manualRegionToggle');

// ===== Ver.1.8.1 버튼 효과음 =====
(function initButtonSound(){
  const KEY = 'rainMapButtonSoundEnabled';
  let soundEnabled = localStorage.getItem(KEY);
  soundEnabled = soundEnabled === null ? true : soundEnabled === '1';
  let audioCtx = null;

  function getAudioCtx(){
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function uiVibrate(type){
    if (soundEnabled) return;
    if (!navigator.vibrate) return;
    try {
      if (type === 'done') navigator.vibrate([35, 25, 45]);
      else if (type === 'save' || type === 'image') navigator.vibrate([22, 18, 22]);
      else if (type === 'reset') navigator.vibrate(35);
      else if (type === 'error') navigator.vibrate([60, 30, 60]);
      else navigator.vibrate(18);
    } catch(e) {}
  }

  function tone(freq1, freq2, duration, peak, wave){
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = wave || 'sine';
    osc.frequency.setValueAtTime(freq1, now);
    if (freq2 && freq2 !== freq1) osc.frequency.exponentialRampToValueAtTime(freq2, now + Math.max(0.02, duration * 0.55));
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak || 0.045, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function playTone(type){
    if (!soundEnabled) { uiVibrate(type); return; }

    if (type === 'done') {
      // 매칭 적용 완료만 띠링 소리
      tone(660, 880, 0.11, 0.055, 'sine');
      setTimeout(() => tone(880, 1175, 0.14, 0.065, 'sine'), 90);
      return;
    }
    // 그 외 모든 버튼/동작은 같은 톡 소리
    tone(620, 760, 0.075, 0.04, 'sine');
  }

  function updateSoundButton(){
    const btn = document.getElementById('soundToggle');
    if (!btn) return;
    btn.textContent = soundEnabled ? '🔊 ON' : '🔇 OFF';
    btn.classList.toggle('sound-on', soundEnabled);
    btn.classList.toggle('sound-off', !soundEnabled);
  }

  window.playUiClickSound = () => playTone('click');
  window.playUiDoneSound = () => playTone('done');
  window.playUiErrorSound = () => playTone('click');

  document.addEventListener('DOMContentLoaded', updateSoundButton);
  updateSoundButton();

  document.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if (!btn) return;

    if (btn.id === 'soundToggle') {
      soundEnabled = !soundEnabled;
      localStorage.setItem(KEY, soundEnabled ? '1' : '0');
      updateSoundButton();
      if (soundEnabled) playTone('click');
      else uiVibrate('click');
      return;
    }

    // 모든 버튼은 같은 톡 소리로 통일
    playTone('click');
  }, true);
})();
















/* ===== v7.34 시작 시 산지 아이콘 기본 표시 =====
   - 기존 자동 매칭/수동 인덱스/지역 수동 매칭 로직은 변경하지 않습니다.
   - 예보 매칭 전에도 산지 대표 ▲만 보이게 합니다.
   - 예보 매칭이 실행되어 실제 산지 수치가 생기면 기존 renderMountainIcons가 그대로 사용됩니다.
*/
(function(){
  const STARTUP_MOUNTAIN_KEYS = [
    '강원북부산지',
    '강원중부산지',
    '강원남부산지',
    '경북북동산지',
    '제주산지',
    '지리산부근'
  ];

  function hasForecastMountainIcons(){
    try {
      return !!(typeof mountainIconGroups === 'object' && mountainIconGroups && Object.keys(mountainIconGroups).length);
    } catch(_) { return false; }
  }

  window.renderStartupMountainMarkers = function renderStartupMountainMarkers(){
    if (!mountainIconsG || typeof MOUNTAIN_POINTS !== 'object') return;
    if (hasForecastMountainIcons()) return;
    if (mountainIconsG.querySelector('.startup-mountain-icon')) return;

    STARTUP_MOUNTAIN_KEYS.forEach(key => {
      const info = MOUNTAIN_POINTS[key];
      if (!info) return;
      let p = project([info.lon, info.lat]);
      let x = p[0], y = p[1];

      // 강원산지 3개는 예보 매칭 때와 같은 위치감으로 넓게 벌려 보이게 맞춥니다.
      if (key.indexOf('강원') === 0 && key.indexOf('산지') >= 0) {
        const c = project([128.50, 37.62]);
        x = c[0];
        y = c[1] - 10;
        if (key === '강원북부산지') { x -= 24; y -= 52; }
        else if (key === '강원남부산지') { x += 24; y += 52; }
      }

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class','mountain-icon-group startup-mountain-icon');
      g.dataset.mountain = key;
      g.dataset.amount = '';
      g.dataset.x = x;
      g.dataset.y = y;
      g.setAttribute('transform', `translate(${x} ${y})`);

      const tri = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      tri.setAttribute('class','mountain-triangle');
      tri.setAttribute('d','M 0 -16 L 17 14 L -17 14 Z');
      tri.setAttribute('fill','#ffffff');
      tri.setAttribute('stroke','#111');
      tri.setAttribute('stroke-width','0.8');
      g.appendChild(tri);

      const title = document.createElementNS('http://www.w3.org/2000/svg','title');
      title.textContent = info.label || key;
      g.appendChild(title);

      // 수동 인덱스가 선택된 상태에서 산지 ▲를 누르면 해당 색으로 칠하기/해제됩니다.
      g.addEventListener('click', function(e){
        e.stopPropagation();
        if (!selectedManualColor) return;
        if (g.dataset.manualColor === selectedManualColor) {
          tri.setAttribute('fill','#ffffff');
          g.dataset.manualColor = '';
          return;
        }
        tri.setAttribute('fill', selectedManualColor);
        g.dataset.manualColor = selectedManualColor;
      });

      try { makeDraggableMountain(g, key, 'startup'); } catch(_) {}
      mountainIconsG.appendChild(g);
    });
  };

  const __oldClearRainMatch = window.clearRainMatch || (typeof clearRainMatch === 'function' ? clearRainMatch : null);
  if (__oldClearRainMatch) {
    window.clearRainMatch = clearRainMatch = function(){
      __oldClearRainMatch.apply(this, arguments);
      setTimeout(window.renderStartupMountainMarkers, 0);
    };
  }

  const __oldRenderMountainIcons = window.renderMountainIcons || (typeof renderMountainIcons === 'function' ? renderMountainIcons : null);
  if (__oldRenderMountainIcons) {
    window.renderMountainIcons = renderMountainIcons = function(){
      __oldRenderMountainIcons.apply(this, arguments);
      if (!hasForecastMountainIcons()) setTimeout(window.renderStartupMountainMarkers, 0);
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(window.renderStartupMountainMarkers, 0));
  } else {
    setTimeout(window.renderStartupMountainMarkers, 0);
  }
})();

</script>

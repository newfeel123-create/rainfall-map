        docs.push({ url: KMA_PRELOAD_URLS[index], raw: result.value });
      }
    });
    if (!docs.length) throw new Error('예보통보문 불러오기 실패');
    return docs;
  }

  function __acceptDocs(docs, statusText){
    if (!docs || !docs.length) return false;
    __kmaPreloadedDocs = docs;
    __kmaPreloadedAt = Date.now();
    try { __updateKmaForecastTimeFromRaw(docs[0].raw); } catch(e) {}
return true;
  }

  async function __refreshLiveInBackground(){
    if (__kmaBackgroundRefreshing) return;
    __kmaBackgroundRefreshing = true;
    try {
      const liveDocs = await __fetchLiveDocs();
      __acceptDocs(liveDocs, '');
      __saveLocalCache(liveDocs);
    } catch(e) {
      // 캐시로 이미 준비된 경우에는 연결 실패로 바꾸지 않습니다.
      if (!__kmaPreloadedDocs.length)
} finally {
      __kmaBackgroundRefreshing = false;
    }
  }

  async function __preloadKmaDocuments(force){
    const fresh = __kmaPreloadedDocs.length &&
                  (Date.now() - __kmaPreloadedAt < KMA_MEMORY_TTL);
    if (!force && fresh) {
      __refreshLiveInBackground();
      return __kmaPreloadedDocs;
    }
    if (__kmaPreloadPromise) return __kmaPreloadPromise;
__kmaPreloadPromise = (async () => {
      // 1. 브라우저 저장 캐시를 즉시 사용합니다.
      if (!force) {
        const localDocs = __readLocalCache();
        if (__acceptDocs(localDocs, '')) {
          __refreshLiveInBackground();
          return localDocs;
        }
      }

      // 2. GitHub Pages의 정적 JSON을 짧게 기다려 사용합니다.
      if (!force) {
        try {
          const staticDocs = await __fetchStaticJson();
          if (__acceptDocs(staticDocs, '')) {
            __saveLocalCache(staticDocs);
            __refreshLiveInBackground();
            return staticDocs;
          }
        } catch(e) {}
      }

      // 3. 캐시가 없을 때만 실시간 예보통보문을 불러옵니다.
      const liveDocs = await __fetchLiveDocs();
      __acceptDocs(liveDocs, '');
      __saveLocalCache(liveDocs);
      return liveDocs;
    })().catch(err => {
if (!__kmaRetryTimer) {
        __kmaRetryTimer = setTimeout(() => {
          __kmaRetryTimer = null;
          __preloadKmaDocuments(true).catch(() => {});
        }, 15000);
      }
      throw err;
    }).finally(() => {
      __kmaPreloadPromise = null;
    });

    return __kmaPreloadPromise;
  }

  function __combinedKmaBlocks(docs){
    const blocks = [];
    (docs || []).forEach(doc => {
      try {
        const list = __extractKmaRainBlocksDetailed(doc.raw);
        if (Array.isArray(list)) blocks.push.apply(blocks, list);
      } catch(e) {}
    });
    return blocks;
  }

  window.showKmaChoice = async function(dayOffset){
    __resetKmaChoiceForNewDay(dayOffset);
    const input = document.getElementById('forecastText');
    if (input) input.value = '';

    const info = __kmaDateInfo(__selectedKmaDayOffset);
    __setKmaChoiceNoButtons(info.label + ' 강수 항목 확인 중...');

    try {
      const docs = await __preloadKmaDocuments(false);
      const blocks = __combinedKmaBlocks(docs);
      const hasRain = __hasKmaKindStrict(blocks, __selectedKmaDayOffset, 'rain');
      const hasShower = __hasKmaKindStrict(blocks, __selectedKmaDayOffset, 'shower');
      __applyKmaChoiceAvailability(__selectedKmaDayOffset, hasRain, hasShower);
    } catch(err) {
      __setKmaChoiceNoButtons(info.label + ' 강수 항목 확인 실패');
      console.warn('KMA cached choice check failed:', err);
    }
  };

  window.loadKmaByDayAndKind = async function(dayOffset, kind){
    const box = document.getElementById('matchResult');
    const input = document.getElementById('forecastText');
    const info = __kmaDateInfo(dayOffset);
    const kindLabel = kind === 'rain' ? '예상 강수량' :
                      (kind === 'shower' ? '소나기' : '예상 강수량/소나기');

    try {
      const docs = await __preloadKmaDocuments(false);
      const blocks = __combinedKmaBlocks(docs);
      const selected = __filterKmaBlocks(blocks, dayOffset, kind);
      const result = selected.map(b => b.text).join('

').trim();

      if (!result || !/mm/.test(result)) {
        throw new Error(info.label + ' ' + kindLabel + ' 문구를 찾지 못했습니다.');
      }

      if (input) input.value = result;
      if (box) box.innerHTML = '미리 준비된 기상청 ' + info.label + ' ' + kindLabel +
        ' 정보를 사용합니다.<br>지도 매칭을 실행합니다.';
      applyForecastMatch();
    } catch(err) {
      if (box) box.innerHTML = '자동 불러오기에 실패했습니다.<br>원인: ' +
        (err && err.message ? err.message : String(err));
    }
  };

  window.loadRainfallFromKma = async function(){
    const box = document.getElementById('matchResult');
    const input = document.getElementById('forecastText');
    try {
      const docs = await __preloadKmaDocuments(false);
      let result = '';
      for (const doc of docs) {
        const rain = __extractKmaRainBlocks(doc.raw);
        if (rain && /mm/.test(rain)) {
          result = rain;
          break;
        }
      }
      if (!result) throw new Error('예상 강수량/소나기 문구를 찾지 못했습니다.');
      if (input) input.value = result;
      if (box) box.innerHTML = '미리 준비된 기상청 예보통보문을 사용합니다.<br>지도 매칭을 실행합니다.';
      applyForecastMatch();
    } catch(err) {
      if (box) box.innerHTML = '자동 불러오기에 실패했습니다.<br>원인: ' +
        (err && err.message ? err.message : String(err));
    }
  };

  function __startKmaPreload(){
    setTimeout(() => __preloadKmaDocuments(false).catch(() => {}), 20);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', __startKmaPreload, {once:true});
  } else {
    __startKmaPreload();
  }

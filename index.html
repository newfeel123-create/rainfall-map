// v7.76: PC/모바일 항상 고화질 저장
function getImageSaveScale() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const isMobile = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
  // PC는 항상 3배, 모바일은 기기 해상도 기준 최소 3배~최대 4배로 저장합니다.
  return isMobile ? Math.max(3, Math.min(4, dpr)) : 3;
}

// ===== 지도 이미지 저장 =====
// 사용자가 올려준 예시처럼 PC/휴대폰 모두 같은 비율의 PNG로 저장합니다.
// 화면에 보이는 모바일 CSS 크기가 아니라 SVG 지도 전체 + 수치 + 산지 아이콘을 기준으로 저장합니다.
function saveCurrentMapImage() {
  const btn = document.getElementById('saveImageBtn');
  if (btn) btn.classList.add('btn-active');

  try {
    const originalSvg = document.getElementById('map');
    const mapWrap = document.querySelector('.mapwrap') || (originalSvg && originalSvg.parentElement);
    if (!originalSvg || !mapWrap) throw new Error('map element not found');

    // 저장 직전 현재 지도 이동/확대값을 실제 SVG에 강제 반영합니다.
    try {
      if (typeof viewRaf !== 'undefined' && viewRaf) { cancelAnimationFrame(viewRaf); viewRaf = 0; }
      const liveViewport = originalSvg.querySelector('#viewport');
      if (liveViewport && typeof view !== 'undefined') {
        liveViewport.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
      }
    } catch (_) {}

    const rect = mapWrap.getBoundingClientRect();
    const outW = Math.max(1, Math.round(rect.width || originalSvg.clientWidth || 900));
    const outH = Math.max(1, Math.round(rect.height || originalSvg.clientHeight || 520));

    // 아이폰에서도 화면에 보이는 비율과 위치가 그대로 나오도록 DPR은 선명도에만 사용합니다.
    const S = (typeof getImageSaveScale === "function") ? getImageSaveScale() : Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const isMobileExport = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
    // Ver.1.8.1: 휴대폰 저장 때만 한반도를 1.25배로 저장합니다.
    const EXPORT_MOBILE_ZOOM = 1.25;
    const EXPORT_ZOOM = isMobileExport ? EXPORT_MOBILE_ZOOM : 1;
    const EXPORT_CENTER_X = WIDTH / 2;
    const EXPORT_CENTER_Y = HEIGHT / 2;

    const clonedSvg = originalSvg.cloneNode(true);

    // 저장 이미지에서는 현재 선택/흐림 상태를 제거하고 모든 요소를 정상 표시합니다.
    clonedSvg.querySelectorAll(
      '.hover-dim, .hover-focus, .manual-index-selected, .hidden'
    ).forEach(function(el){
      el.classList.remove('hover-dim', 'hover-focus', 'manual-index-selected');
      // 소나기 캐릭터의 hidden 클래스만 현재 모드에 따라 별도 처리합니다.
      if (!el.classList.contains('shower-character-group')) {
        el.classList.remove('hidden');
      }
      el.style.removeProperty('opacity');
      el.style.removeProperty('display');
      el.style.removeProperty('visibility');
    });

    // 이미지 저장에서는 지도 안 '소나기' 모드일 때만 소나기 캐릭터를 포함합니다.
    const isShowerImageExport = (
      typeof currentMapColorMode !== 'undefined' &&
      currentMapColorMode === 'shower'
    );

    if (isShowerImageExport) {
      clonedSvg.querySelectorAll('.shower-character-group').forEach(function(el){
        el.classList.remove('hidden');
        el.style.display = '';
        el.style.visibility = 'visible';
        el.style.opacity = '1';
      });
    } else {
      // 저장용 CSS가 강제로 다시 표시하지 못하도록 복제 SVG에서 완전히 제거합니다.
      clonedSvg.querySelectorAll('.shower-character-group').forEach(function(el){
        el.remove();
      });
    }

    clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clonedSvg.setAttribute('width', String(outW));
    clonedSvg.setAttribute('height', String(outH));
    // iPhone 저장 시 하단 라벨/산지 아이콘이 잘리는 문제 방지용 저장 전용 여백입니다.
    // 화면 비율은 유지하되 SVG viewBox 바깥으로 살짝 나간 요소까지 PNG에 들어오게 합니다.
    const EXPORT_PAD_X = 28;
    const EXPORT_PAD_TOP = 38;
    const EXPORT_PAD_BOTTOM = 300;
    clonedSvg.setAttribute('viewBox', `${-EXPORT_PAD_X} ${-EXPORT_PAD_TOP} ${WIDTH + EXPORT_PAD_X * 2} ${HEIGHT + EXPORT_PAD_TOP + EXPORT_PAD_BOTTOM}`);
    clonedSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    clonedSvg.setAttribute('overflow', 'visible');
    clonedSvg.removeAttribute('style');
    clonedSvg.style.background = '#ffffff';

    const clonedViewport = clonedSvg.querySelector('#viewport');
    if (clonedViewport && typeof view !== 'undefined') {
      const exportK = view.k * EXPORT_ZOOM;
      const exportX = (view.x * EXPORT_ZOOM) + ((1 - EXPORT_ZOOM) * EXPORT_CENTER_X);
      const exportY = (view.y * EXPORT_ZOOM) + ((1 - EXPORT_ZOOM) * EXPORT_CENTER_Y);
      clonedViewport.setAttribute('transform', `translate(${exportX} ${exportY}) scale(${exportK})`);
    }

    const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = `
      .region { shape-rendering:geometricPrecision; fill:#ffffff; stroke:#6F6F6F; stroke-width:0.28; vector-effect:non-scaling-stroke; }
      .region.matched { stroke:#666666; stroke-width:0.28; }
      .region.selected { fill:#ffe08a; }
      .coastline { fill:none; stroke:#111111; stroke-width:0.95; vector-effect:non-scaling-stroke; opacity:0.98; stroke-linejoin:round; stroke-linecap:round; }
      .sido-boundary { fill:none; stroke:#222222; stroke-width:0.85; vector-effect:non-scaling-stroke; opacity:0.95; stroke-linejoin:round; stroke-linecap:round; }
      .amount-label-box { stroke:#111; stroke-width:1.1; rx:6; ry:6; vector-effect:non-scaling-stroke; }
      .amount-label { font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif; font-size:26px; font-weight:900; fill:#ffffff; stroke:#000000; stroke-width:1.35px; paint-order:stroke fill; stroke-linejoin:round; text-anchor:middle; dominant-baseline:middle; }
      .mountain-triangle { stroke:#000; stroke-width:0.8; vector-effect:non-scaling-stroke; }
      .mountain-text { fill:#fff; stroke:#000; stroke-width:1.2px; paint-order:stroke fill; stroke-linejoin:round; font-family:'Malgun Gothic','맑은 고딕'; font-weight:900; font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .region { stroke:#AEB8C3 !important; stroke-width:0.24 !important; stroke-linejoin:round !important; stroke-linecap:round !important; }
      .region.matched { stroke:#5B6675 !important; stroke-width:0.34 !important; }
      .coastline { stroke:#0F2A44 !important; stroke-width:1.05 !important; opacity:.96 !important; stroke-linejoin:round !important; stroke-linecap:round !important; }
      .sido-boundary { stroke:#2F3A46 !important; stroke-width:0.88 !important; opacity:.86 !important; stroke-linejoin:round !important; stroke-linecap:round !important; }
      .amount-label-box { stroke:#111827 !important; stroke-width:1.25 !important; }
      .amount-period-box { fill:#1976D2 !important; stroke:#0D47A1 !important; stroke-width:0.9 !important; rx:5; ry:5; vector-effect:non-scaling-stroke; }
      .amount-period-text { fill:#ffffff !important; stroke:none !important; font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif; font-size:15px; font-weight:900; text-anchor:middle; dominant-baseline:middle; }

      /* 저장 이미지용 소나기 캐릭터 스타일 */
      .shower-character-group {
        display:inline !important;
        visibility:visible !important;
        opacity:1 !important;
      }
      .shower-character-head,
      .shower-character-body {
        fill:#20b24b !important;
        stroke:#ffffff !important;
        stroke-width:2.8 !important;
        stroke-linejoin:round !important;
        stroke-linecap:round !important;
        vector-effect:non-scaling-stroke !important;
      }

      /* 저장 이미지용 수치 박스 정상 표시 */
      .amount-label-group {
        display:inline !important;
        visibility:visible !important;
        opacity:1 !important;
      }
      .amount-label-box {
        fill-opacity:1 !important;
        stroke:#111827 !important;
        stroke-width:1.25 !important;
      }
      .amount-label {
        display:inline !important;
        visibility:visible !important;
        opacity:1 !important;
      }

    `;
    clonedSvg.insertBefore(style, clonedSvg.firstChild);

    const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgRect.setAttribute('x', String(-EXPORT_PAD_X));
    bgRect.setAttribute('y', String(-EXPORT_PAD_TOP));
    bgRect.setAttribute('width', String(WIDTH + EXPORT_PAD_X * 2));
    bgRect.setAttribute('height', String(HEIGHT + EXPORT_PAD_TOP + EXPORT_PAD_BOTTOM));
    bgRect.setAttribute('fill', '#ffffff');
    clonedSvg.insertBefore(bgRect, clonedSvg.querySelector('#viewport') || clonedSvg.firstChild.nextSibling);

    const svgText = new XMLSerializer().serializeToString(clonedSvg);
    const svgBlob = new Blob([svgText], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();

    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(outW * S);
      canvas.height = Math.round(outH * S);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // CSS 픽셀 좌표계로 그립니다. 그래서 화면 박스와 저장 이미지가 1:1로 맞습니다.
      ctx.setTransform(S, 0, 0, S, 0, 0);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, outW, outH);
      ctx.drawImage(img, 0, 0, outW, outH);
      URL.revokeObjectURL(url);

      // 화면 오른쪽 아래에 보이는 자동 인덱스가 있으면, 화면 크기 그대로 다시 그립니다.
      // 기존처럼 저장 이미지에서 인덱스가 커지거나 위치가 밀리는 문제를 막습니다.
      try {
        drawVisibleMapLegend(ctx, mapWrap, outW, outH);
      } catch (e) {
        console.warn('legend draw skipped', e);
      }

      canvas.toBlob(function(blob) {
        if (!blob) {
          if (btn) btn.classList.remove('btn-active');
          alert('이미지 저장에 실패했습니다.');
          return;
        }
        const pngUrl = URL.createObjectURL(blob);
        const d = new Date();
        const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;

        let saveTitle = '매칭용 강수량';
        if (typeof currentMapColorMode !== 'undefined') {
          if (currentMapColorMode === 'rain') saveTitle = '예상 강우량';
          else if (currentMapColorMode === 'shower') saveTitle = '소나기';
        }

        const fileName = `${saveTitle}_${stamp}.png`;
        const a = document.createElement('a');
        a.href = pngUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(pngUrl), 10000);
        setTimeout(() => { if (btn) btn.classList.remove('btn-active'); }, 450);
      }, 'image/png');
    };

    img.onerror = function() {
      URL.revokeObjectURL(url);
      if (btn) btn.classList.remove('btn-active');
      alert('이미지 변환에 실패했습니다. 휴대폰에서는 캡쳐를 사용해주세요.');
    };

    img.src = url;
  } catch (err) {
    console.error(err);
    if (btn) btn.classList.remove('btn-active');
    alert('이미지 저장 중 오류가 발생했습니다.');
  }
}

function drawVisibleMapLegend(ctx, mapWrap, outW, outH) {
  const legendBox = document.getElementById('mapLegendBox');
  const rainLegend = document.getElementById('rainLegend');
  if (!legendBox || !rainLegend) return;
  const st = getComputedStyle(legendBox);
  if (st.display === 'none' || st.visibility === 'hidden' || legendBox.offsetWidth <= 0 || legendBox.offsetHeight <= 0) return;

  const mapRect = mapWrap.getBoundingClientRect();
  const lb = legendBox.getBoundingClientRect();
  let x = Math.round(lb.left - mapRect.left);
  let y = Math.round(lb.top - mapRect.top);
  const legendAmounts = ((typeof getSortedLegendAmounts === 'function') ? getSortedLegendAmounts() : (amountColorOrder || []))
    .map(amount => ({ amount, label: displayAmountNoMm(amount) }))
    .filter(item => item.label);
  if (!legendAmounts.length) return;

  const isMobile = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
  const fontSize = isMobile ? 9 : 9;
  const unitFontSize = isMobile ? 7.5 : 7.5;
  const chipW = isMobile ? 9 : 9;
  const chipH = isMobile ? 8 : 8;
  const rowH = isMobile ? 11 : 11;
  const unitH = isMobile ? 9 : 9;
  const padX = isMobile ? 4 : 4;
  const padY = isMobile ? 3 : 3;
  const gap = 3;
  const unitText = '(단위:mm)';

  ctx.save();
  ctx.font = `800 ${fontSize}px Malgun Gothic, Arial, sans-serif`;
  const maxTextW = Math.max(...legendAmounts.map(item => ctx.measureText(item.label).width));
  ctx.font = `800 ${unitFontSize}px Malgun Gothic, Arial, sans-serif`;
  const unitW = ctx.measureText(unitText).width;
  ctx.font = `800 ${fontSize}px Malgun Gothic, Arial, sans-serif`;
  let w = Math.ceil(padX * 2 + Math.max(chipW + gap + maxTextW, unitW));
  let h = Math.ceil(padY * 2 + legendAmounts.length * rowH + unitH);
  if (w <= 0 || h <= 0) { ctx.restore(); return; }

  // 혹시 경계 밖으로 나가면 화면 안으로 보정합니다.
  x = Math.max(0, Math.min(outW - w, x));
  y = Math.max(0, Math.min(outH - h, y));

  ctx.globalAlpha = 0.96;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#888888';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#111111';

  let cy = y + padY + rowH / 2;
  legendAmounts.forEach((item) => {
    const color = amountColorMap[item.amount] || '#ffffff';
    ctx.fillStyle = color;
    ctx.fillRect(x + padX, cy - chipH / 2, chipW, chipH);
    ctx.strokeStyle = '#888888';
    ctx.strokeRect(x + padX + 0.5, cy - chipH / 2 + 0.5, chipW - 1, chipH - 1);
    ctx.fillStyle = '#111111';
    ctx.fillText(item.label, x + padX + chipW + gap, cy + 0.5);
    cy += rowH;
  });

  ctx.font = `800 ${unitFontSize}px Malgun Gothic, Arial, sans-serif`;
  ctx.fillStyle = '#333333';
  ctx.textBaseline = 'top';
  ctx.fillText(unitText, x + w - padX - unitW, y + padY + legendAmounts.length * rowH + 0.5);

  ctx.restore();
}

const saveImageBtn = document.getElementById('saveImageBtn');
if (saveImageBtn) {
  saveImageBtn.addEventListener('click', saveCurrentMapImage);

const MANUAL_REGION_BASE_MENU = JSON.parse(JSON.stringify(MANUAL_REGION_MENU));

// Ver.1.8.4-v7.77: 프로그램 안에서 수동 매칭 지역 버튼 추가
// - 추가한 버튼은 현재 브라우저 localStorage에 저장됩니다.
// - 치환 내보내기/불러오기(region_replace.json)에 같이 포함됩니다.
// - 새로 만든 버튼을 누른 뒤 지도에서 시군구를 선택하고 "현재 선택 저장"을 누르면 자동 매칭에도 적용됩니다.
const MANUAL_REGION_CUSTOM_MENU_KEY = 'kmaManualRegionCustomMenu_v1';
const MANUAL_REGION_HIDDEN_MENU_KEY = 'kmaManualRegionHiddenMenu_v1';
const MANUAL_REGION_ORDER_MENU_KEY = 'kmaManualRegionMenuOrder_v1';

function getManualRegionCustomMenu() {
  try {
    const raw = localStorage.getItem(MANUAL_REGION_CUSTOM_MENU_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return obj && typeof obj === 'object' ? obj : {};
  } catch(e) {
    return {};
  }
}

function saveManualRegionCustomMenu(obj) {
  try { localStorage.setItem(MANUAL_REGION_CUSTOM_MENU_KEY, JSON.stringify(obj || {})); } catch(e) {}
}

function getManualRegionHiddenMenu() {
  try {
    const raw = localStorage.getItem(MANUAL_REGION_HIDDEN_MENU_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return obj && typeof obj === 'object' ? cleanManualRegionHiddenMenuForBase(obj) : {};
  } catch(e) { return {}; }
}
function saveManualRegionHiddenMenu(obj) {
  try { localStorage.setItem(MANUAL_REGION_HIDDEN_MENU_KEY, JSON.stringify(cleanManualRegionHiddenMenuForBase(obj || {}))); } catch(e) {}
}
function getManualRegionOrderMenu() {
  try {
    const raw = localStorage.getItem(MANUAL_REGION_ORDER_MENU_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return obj && typeof obj === 'object' ? obj : {};
  } catch(e) { return {}; }
}
function saveManualRegionOrderMenu(obj) {
  try { localStorage.setItem(MANUAL_REGION_ORDER_MENU_KEY, JSON.stringify(obj || {})); } catch(e) {}
}
function saveCurrentManualRegionOrder(zone) {
  const z = zoneName(zone);
  if (!z || !MANUAL_REGION_MENU[z]) return;
  const order = getManualRegionOrderMenu();
  order[z] = (MANUAL_REGION_MENU[z] || []).map(normText).filter(Boolean);
  saveManualRegionOrderMenu(order);
}
function applyManualRegionHiddenMenu(obj) {
  if (!obj || typeof obj !== 'object') return;
  const safeHidden = cleanManualRegionHiddenMenuForBase(obj);
  Object.keys(safeHidden).forEach(zone => {
    const z = zoneName(zone);
    if (!MANUAL_REGION_MENU[z]) return;
    const hidden = new Set((Array.isArray(safeHidden[zone]) ? safeHidden[zone] : []).map(normText).filter(Boolean));
    if (hidden.size) MANUAL_REGION_MENU[z] = (MANUAL_REGION_MENU[z] || []).filter(name => !hidden.has(normText(name)));
  });
}
function applyManualRegionOrderMenu(obj) {
  if (!obj || typeof obj !== 'object') return;
  Object.keys(obj).forEach(zone => {
    const z = zoneName(zone);
    if (!MANUAL_REGION_MENU[z] || !Array.isArray(obj[zone])) return;
    const current = (MANUAL_REGION_MENU[z] || []).map(normText).filter(Boolean);
    const seen = new Set();
    const ordered = [];
    obj[zone].map(normText).filter(Boolean).forEach(name => {
      if (current.includes(name) && !seen.has(name)) { ordered.push(name); seen.add(name); }
    });
    current.forEach(name => { if (!seen.has(name)) ordered.push(name); });
    MANUAL_REGION_MENU[z] = ordered;
  });
}

function applyManualRegionCustomMenu(obj) {
  if (!obj || typeof obj !== 'object') return;
  Object.keys(obj).forEach(zone => {
    const z = zoneName(zone);
    if (!MANUAL_REGION_MENU[z]) return;
    const arr = Array.isArray(obj[zone]) ? obj[zone] : [];
    arr.map(normText).filter(Boolean).forEach(name => {
      if (!MANUAL_REGION_MENU[z].map(normText).includes(name)) MANUAL_REGION_MENU[z].push(name);
    });
  });
}

function loadManualRegionCustomMenu() {
  applyManualRegionCustomMenu(getManualRegionCustomMenu());
  applyManualRegionHiddenMenu(getManualRegionHiddenMenu());
  applyManualRegionOrderMenu(getManualRegionOrderMenu());
}
loadManualRegionCustomMenu();

function addManualRegionButton() {
  const activeZoneBtn = document.querySelector('#manualRegionZones button.active');
  const zone = activeZoneBtn ? zoneName(activeZoneBtn.dataset.zone) : '';
  if (!zone || !MANUAL_REGION_MENU[zone]) {
    alert('먼저 추가할 권역을 선택해주세요.\n예: 경상권을 누른 뒤 지역 버튼 추가');
    return;
  }
  const input = prompt(zone + '에 추가할 지역 버튼 이름을 입력하세요.\n예: 경북남동부', '');
  if (input === null) return;
  const name = normText(input);
  if (!name) return;

  if (!MANUAL_REGION_MENU[zone].map(normText).includes(name)) {
    MANUAL_REGION_MENU[zone].push(name);
  }

  const custom = getManualRegionCustomMenu();
  const list = Array.isArray(custom[zone]) ? custom[zone].map(normText).filter(Boolean) : [];
  if (!list.includes(name)) list.push(name);
  custom[zone] = list;
  saveManualRegionCustomMenu(custom);

  renderManualRegionButtons(zone);
  // 방금 추가한 버튼을 바로 선택합니다.
  setTimeout(() => {
    const btn = Array.from(document.querySelectorAll('#manualRegionButtons button')).find(b => normText(b.dataset.region) === name);
    if (btn) btn.click();
  }, 0);
  alert(name + ' 버튼을 추가했습니다.\n지도에서 포함할 시군구를 선택한 뒤 "현재 선택 저장"을 눌러주세요.');
}

function getActiveManualRegionZone() {

  return activeZoneBtn ? zoneName(activeZoneBtn.dataset.zone) : '';
}
function getManualRegionIndexInZone(zone, regionName) {
  const z = zoneName(zone);

function deleteCurrentManualRegionButton() {
  const zone = getActiveManualRegionZone();
  const key = normText(currentManualRegionName);
  if (!zone || !MANUAL_REGION_MENU[zone]) { alert('먼저 권역을 선택해주세요.'); return; }
  if (!key) { alert('삭제할 지역 버튼을 먼저 선택해주세요.'); return; }
  if (isManualRegionBaseButton(zone, key)) {
    alert('기본 지역 버튼은 삭제하지 않도록 보호했습니다.\n사용자가 추가한 버튼만 삭제할 수 있습니다.');

  }
  if (!confirm(key + ' 지역 버튼을 삭제할까요?\n저장된 치환명/구성값도 함께 삭제됩니다.')) return;

  MANUAL_REGION_MENU[zone] = (MANUAL_REGION_MENU[zone] || []).filter(v => normText(v) !== key);

  const custom = getManualRegionCustomMenu();
  custom[zone] = (Array.isArray(custom[zone]) ? custom[zone] : []).map(normText).filter(v => v && v !== key);
  saveManualRegionCustomMenu(custom);

  const hidden = getManualRegionHiddenMenu();
  hidden[zone] = (Array.isArray(hidden[zone]) ? hidden[zone] : []).map(normText).filter(v => v && v !== key);
  saveManualRegionHiddenMenu(hidden);
  saveCurrentManualRegionOrder(zone);

  try { localStorage.removeItem(manualRegionAliasStorageKey(key)); } catch(e) {}
  try { localStorage.removeItem(manualRegionStorageKey(key)); } catch(e) {}

  clearManualPreviewPaint();
  currentManualRegionName = '';
  currentManualRegionPaths = [];
  renderManualRegionButtons(zone);
  alert(key + ' 버튼을 삭제했습니다.\n공유하려면 치환 내보내기 후 region_replace.json을 GitHub에 올려주세요.');
}
function renameCurrentManualRegionButton() {
  const zone = getActiveManualRegionZone();
  const oldName = normText(currentManualRegionName);
  if (!zone || !MANUAL_REGION_MENU[zone]) { alert('먼저 권역을 선택해주세요.'); return; }
  if (!oldName) { alert('이름을 바꿀 지역 버튼을 먼저 선택해주세요.'); return; }
  if (isManualRegionBaseButton(zone, oldName)) {
    alert('기본 지역 버튼은 이름을 변경하지 않도록 보호했습니다.\n사용자가 추가한 버튼만 이름을 바꿀 수 있습니다.');
    return;
  }
  const input = prompt(oldName + ' 버튼 이름을 새 이름으로 변경합니다.', oldName);
  if (input === null) return;
  const newName = normText(input);
  if (!newName || newName === oldName) return;
  if (MANUAL_REGION_MENU[zone].map(normText).includes(newName)) { alert('이미 같은 이름의 버튼이 있습니다.'); return; }

  const idx = getManualRegionIndexInZone(zone, oldName);
  if (idx < 0) return;
  MANUAL_REGION_MENU[zone][idx] = newName;

  // 기존 치환/구성 저장값을 새 이름으로 옮깁니다.
  try {
    const oldAliasKey = manualRegionAliasStorageKey(oldName);
    const newAliasKey = manualRegionAliasStorageKey(newName);
    const aliasVal = localStorage.getItem(oldAliasKey);
    if (aliasVal !== null) { localStorage.setItem(newAliasKey, aliasVal); localStorage.removeItem(oldAliasKey); }
    const oldOverrideKey = manualRegionStorageKey(oldName);
    const newOverrideKey = manualRegionStorageKey(newName);
    const overrideVal = localStorage.getItem(oldOverrideKey);
    if (overrideVal !== null) { localStorage.setItem(newOverrideKey, overrideVal); localStorage.removeItem(oldOverrideKey); }
  } catch(e) {}

  const custom = getManualRegionCustomMenu();
  const customList = Array.isArray(custom[zone]) ? custom[zone].map(normText).filter(Boolean) : [];
  const cidx = customList.indexOf(oldName);
  if (cidx >= 0) customList[cidx] = newName;
  else if (!customList.includes(newName)) customList.push(newName);
  custom[zone] = Array.from(new Set(customList));
  saveManualRegionCustomMenu(custom);

  const hidden = getManualRegionHiddenMenu();
  hidden[zone] = (Array.isArray(hidden[zone]) ? hidden[zone] : []).map(normText).filter(v => v && v !== oldName && v !== newName);
  saveManualRegionHiddenMenu(hidden);
  saveCurrentManualRegionOrder(zone);

  currentManualRegionName = '';
  renderManualRegionButtons(zone);
  setTimeout(() => {
    const btn = Array.from(document.querySelectorAll('#manualRegionButtons button')).find(b => normText(b.dataset.region) === newName);
    if (btn) btn.click();
  }, 0);
  alert(oldName + ' → ' + newName + ' 이름을 변경했습니다.');
}
function moveCurrentManualRegionButton(delta) {
  const zone = getActiveManualRegionZone();
  const key = normText(currentManualRegionName);
  if (!zone || !MANUAL_REGION_MENU[zone]) { alert('먼저 권역을 선택해주세요.'); return; }
  if (!key) { alert('이동할 지역 버튼을 먼저 선택해주세요.'); return; }
  const list = MANUAL_REGION_MENU[zone];
  const idx = list.map(normText).indexOf(key);
  if (idx < 0) return;
  const next = idx + delta;
  if (next < 0 || next >= list.length) return;
  const tmp = list[idx]; list[idx] = list[next]; list[next] = tmp;
  saveCurrentManualRegionOrder(zone);
  renderManualRegionButtons(zone);
  setTimeout(() => {
    const btn = Array.from(document.querySelectorAll('#manualRegionButtons button')).find(b => normText(b.dataset.region) === key);
    if (btn) btn.click();
  }, 0);
}

// 수동매칭 별칭: 예보문에 다른 표현이 와도 대표 예보구역으로 인식합니다.
// 예: 충남남동내륙 (충남동부) (충남동부내륙)
const DEFAULT_MANUAL_REGION_ALIASES = {};

function manualRegionAliasStorageKey(regionName) {
  return 'kmaManualRegionAliases_v2_' + normText(regionName);
}

function getSavedManualRegionAliases(regionName) {
  try {
    const raw = localStorage.getItem(manualRegionAliasStorageKey(regionName));
    const arr = raw ? JSON.parse(raw) : null;
    return Array.isArray(arr) ? arr.map(normText).filter(Boolean) : [];
  } catch(e) {
    return [];
  }
}

function getManualRegionAliases(regionName) {
  const key = normText(regionName);
  const base = DEFAULT_MANUAL_REGION_ALIASES[key] || [];
  const saved = getSavedManualRegionAliases(key);
  const hiddenAliases = new Set(['강원중.남부내륙','강원중남부내륙']);
  return Array.from(new Set([...base, ...saved].map(normText).filter(Boolean).filter(v => v !== key).filter(v => !hiddenAliases.has(v))));
}

function saveManualRegionAliases(regionName, aliases) {
  try {
    const key = normText(regionName);
    const base = new Set((DEFAULT_MANUAL_REGION_ALIASES[key] || []).map(normText));
    const cleaned = Array.from(new Set((aliases || []).map(normText).filter(Boolean).filter(v => v !== key)));
    // 기본 별칭은 코드에 이미 들어 있으므로 추가 저장에는 기본값 외 별칭만 저장합니다.
    const extra = cleaned.filter(v => !base.has(v));
    localStorage.setItem(manualRegionAliasStorageKey(key), JSON.stringify(extra));
  } catch(e) {}
}

function cleanupManualRegionAliasesOnce() {
  // 기존 브라우저 저장값에 남아 있던 대전 치환명(서울/중구)만 제거합니다.
  // 다른 지역/기능/저장값은 건드리지 않습니다.
  try {
    const key = manualRegionAliasStorageKey('대전');
    const raw = localStorage.getItem(key);
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    const removeSet = new Set(['서울', '중구']);
    const cleaned = arr.map(normText).filter(v => v && !removeSet.has(v));
    localStorage.setItem(key, JSON.stringify(Array.from(new Set(cleaned))));
  } catch(e) {}
}
cleanupManualRegionAliasesOnce();

function manualRegionAliasDisplayList(regionName) {
  const key = normText(regionName);
  const aliases = getManualRegionAliases(key);

  // 시군구 구성값이 실수로 치환명에 남아 있으면 제목 옆에는 표시하지 않습니다.
  // 예: 충남동부 (천안시) (아산시) ... 처럼 보이는 문제 방지
  const hidden = new Set([key]);
  try {
    const info = KMA_REGION_SIGS[key];
    if (info && Array.isArray(info.sigs)) {
      info.sigs.forEach(v => hidden.add(normText(v)));
    }
    getManualRegionPaths(key).map(getPathDisplayName).forEach(v => hidden.add(normText(v)));
  } catch(e) {}

  return Array.from(new Set(aliases.map(normText).filter(Boolean).filter(v => !hidden.has(v))));
}

function manualRegionDisplayName(regionName) {
  const key = normText(regionName);
  const aliases = manualRegionAliasDisplayList(key);
  return key + (aliases.length ? ' ' + aliases.map(v => '(' + v + ')').join(' ') : '');
}

function manualRegionButtonName(regionName) {
  return manualRegionDisplayName(regionName);
}

function allManualRegionNames() {
  const names = [];
  Object.keys(MANUAL_REGION_MENU).forEach(zone => (MANUAL_REGION_MENU[zone] || []).forEach(name => names.push(normText(name))));
  return Array.from(new Set(names));
}

function manualRegionZoneName(regionName) {
  const key = normText(regionName);
  for (const zone of Object.keys(MANUAL_REGION_MENU)) {
    if ((MANUAL_REGION_MENU[zone] || []).map(normText).includes(key)) return zoneName(zone);
  }
  return '';
}

function resolveManualRegionCanonical(token) {
  const t = normText(token);
  if (!t) return t;
  const names = allManualRegionNames();
  if (names.includes(t)) return t;
  for (const name of names) {
    if (getManualRegionAliases(name).includes(t)) return name;
  }
  return t;
}

function resolveForecastRegionCanonical(token, zone) {
  const t = normText(token);
  if (!t) return t;
  const z = zoneName(zone || '');
  const names = allManualRegionNames();
  // 치환은 사용자가 선택한 지역으로 들어가야 하므로
  // 예보문 매칭에서는 치환명을 대표 지역명보다 먼저 확인합니다.
  // 단, 애매한 치환명(예: 중부내륙)은 예보문 권역 안에서만 적용합니다.
  // 예: 강원도 권역의 중부내륙 -> 강원중부내륙, 충청권 권역의 중부내륙 -> 충청권 내부 지역만 확인
  const scopedNames = z ? names.filter(name => manualRegionZoneName(name) === z) : names;
  for (const name of scopedNames) {
    if (getManualRegionAliases(name).includes(t)) return name;
  }
  if (names.includes(t)) return t;
  return t;
}

function parseManualAliasText(text) {
  return String(text || '')
    .replace(/[()]/g, ',')
    .split(/[,\n\/]+/)
    .map(normText)
    .filter(Boolean);
}

function editManualRegionAliases(regionName, btn) {
  const key = normText(regionName || currentManualRegionName);
  if (!key) {
    alert('먼저 별칭을 수정할 지역 버튼을 눌러주세요.');
    return;
  }

  const existing = getManualRegionAliases(key).filter(v => normText(v) !== key);
  // Ver.1.8.4-v7.1
  // 치환 수정 입력창에는 대표명(key)을 기본값으로 넣지 않습니다.
  // 대표명은 입력하지 않아도 항상 기본 지역명으로 인식합니다.
  const current = existing.join(' / ');
  const text = prompt(
    key + ' 지역 치환명을 수정하세요.\n예: 충남남동내륙 / 충남남동부 / 충남동부내륙\n\n쉼표, 줄바꿈, / 로 여러 개를 입력할 수 있습니다.\n대표 지역명은 입력하지 않아도 자동으로 인식됩니다.\n입력창에서 지운 치환명은 저장 후 삭제됩니다.',
    current
  );
  if (text === null) return;

  const typed = parseManualAliasText(text);
  // 대표명(key)은 항상 기본으로 인식합니다.
  // 입력창에 남아 있는 치환명만 저장하고, 지운 치환명은 삭제합니다.
  const aliases = Array.from(new Set(typed.map(normText).filter(Boolean).filter(v => v !== key)));
  saveManualRegionAliases(key, aliases);

  if (btn) btn.textContent = manualRegionDisplayName(key);
  if (currentManualRegionName === key) updateManualRegionInfo();
  alert(key + ' 지역 치환명을 저장했습니다.');
}

function saveCurrentManualRegionAliases() {
  editManualRegionAliases(currentManualRegionName);
}

let currentManualRegionName = '';
let currentManualRegionPaths = [];

function manualRegionStorageKey(regionName) {
  return 'kmaManualRegionOverride_v1_' + resolveManualRegionCanonical(normText(regionName));
}

function pathRegionId(p) {
  return (p.dataset.sido || '') + '|' + (p.dataset.sig || p.dataset.name || '') + '|' + (p.dataset.code || '');
}

function getPathDisplayName(p) {
  const sido = p.dataset.sido || '';
  const sig = p.dataset.sig || p.dataset.name || '';
  if (!sido) return sig;
  if (!sig || sig === sido) return sido;
  return sig;
}

function allRegionPaths() {
  return Array.from(document.querySelectorAll('.region'));
}

function findPathById(id) {
  return allRegionPaths().find(p => pathRegionId(p) === id) || null;
}

function getDefaultManualRegionPaths(regionName) {
  const token = resolveManualRegionCanonical(normText(regionName));
  const paths = [];

  document.querySelectorAll('.region').forEach(p => {
    const sido = p.dataset.sido || '';
    const sig = p.dataset.sig || p.dataset.name || '';

    let ok = false;
    try { ok = regionMatchesToken(sido, sig, token, '', {noAlias:true}); } catch(e) { ok = false; }

    if (!ok) {
      const sidoAlias = token === '강원도' ? '강원' : (token === '제주도' ? '제주' : token);
      if (sido === sidoAlias) ok = true;
    }
    if (!ok && (sig === token || sig.startsWith(token))) ok = true;

    if (ok) paths.push(p);
  });
  return paths;
}

function getSavedManualRegionIds(regionName) {
  try {
    const raw = localStorage.getItem(manualRegionStorageKey(regionName));
    const arr = raw ? JSON.parse(raw) : null;
    return Array.isArray(arr) ? arr : null;
  } catch(e) {
    return null;
  }
}

function saveManualRegionIds(regionName, ids) {
  try {
    localStorage.setItem(manualRegionStorageKey(regionName), JSON.stringify(ids));
  } catch(e) {}
}

function clearSavedManualRegion(regionName) {
  try { localStorage.removeItem(manualRegionStorageKey(regionName)); } catch(e) {}
}

function clearManualPreviewPaint() {
  document.querySelectorAll('.region').forEach(p => {
    if (p.dataset.manualPreview === '1') {
      p.style.fill = p.dataset.manualOldFill || '';
      p.classList.toggle('matched', p.dataset.manualOldMatched === '1');
      delete p.dataset.manualPreview;
      delete p.dataset.manualOldFill;
      delete p.dataset.manualOldMatched;
    }
  });
}

function getManualRegionPaths(regionName) {
  const savedIds = getSavedManualRegionIds(regionName);
  if (savedIds) {
    return savedIds.map(findPathById).filter(Boolean);
  }
  return getDefaultManualRegionPaths(regionName);
}

function paintOneManualPath(p) {
  if (p.dataset.manualPreview !== '1') {
    p.dataset.manualOldFill = p.style.fill || '';
    p.dataset.manualOldMatched = p.classList.contains('matched') ? '1' : '0';
    p.dataset.manualPreview = '1';
  }
  p.classList.add('matched');
  p.style.fill = '#000000';
}

function unpaintOneManualPath(p) {
  if (p.dataset.manualPreview === '1') {
    p.style.fill = p.dataset.manualOldFill || '';
    p.classList.toggle('matched', p.dataset.manualOldMatched === '1');
    delete p.dataset.manualPreview;
    delete p.dataset.manualOldFill;
    delete p.dataset.manualOldMatched;
  }
}

function updateManualRegionInfo() {
  const info = document.getElementById('manualRegionIncluded');
  if (!info) return;
  const actions = document.getElementById('manualRegionActions');
  if (actions) actions.style.display = 'flex';

  if (!currentManualRegionName) {
    info.style.display = 'block';
    info.innerHTML = '<b>지역을 선택하세요.</b><br>' +
      '<span style="color:#666;">권역을 누른 뒤 지역 버튼을 선택하면 상세 내용이 표시됩니다.</span><br>' +
      '<span style="color:#666;">지역을 선택한 후 지도에서 시군구를 누르면 추가/해제됩니다.</span>';
    return;
  }

  const names = currentManualRegionPaths.map(getPathDisplayName).filter(Boolean);
  const saved = getSavedManualRegionIds(currentManualRegionName) ? ' <span style="color:#d00;font-weight:900;">저장됨</span>' : '';
  const displayName = manualRegionDisplayName(currentManualRegionName);
  info.style.display = 'block';
  info.innerHTML = '<b>' + displayName + '</b>' + saved + '<br>' +
    (names.length ? names.join(', ') : '매칭 지역 없음') +
    '<br><span style="color:#666;">지도에서 시군구를 누르면 추가/해제됩니다.</span>';
}


function paintManualPreview(regionName) {
  clearManualPreviewPaint();
  currentManualRegionName = regionName;
  currentManualRegionPaths = getManualRegionPaths(regionName);

  currentManualRegionPaths.forEach(p => paintOneManualPath(p));
  updateManualRegionInfo();
}

function isManualRegionEditModeActive() {
  const body = document.getElementById('manualRegionBody');
  return !!(body && body.style.display !== 'none' && currentManualRegionName);
}

function toggleManualRegionPathFromMap(p) {
  if (!isManualRegionEditModeActive()) return false;

  const id = pathRegionId(p);
  const idx = currentManualRegionPaths.findIndex(x => pathRegionId(x) === id);

  if (idx >= 0) {
    currentManualRegionPaths.splice(idx, 1);
    unpaintOneManualPath(p);
  } else {
    currentManualRegionPaths.push(p);
    paintOneManualPath(p);
  }

  updateManualRegionInfo();
  return true;
}

function saveCurrentManualRegion() {
  if (!currentManualRegionName) {
    alert('먼저 저장할 지역 버튼을 눌러주세요.');
    return;
  }
  const ids = currentManualRegionPaths.map(pathRegionId);
  saveManualRegionIds(currentManualRegionName, ids);
  updateManualRegionInfo();
  alert(currentManualRegionName + ' 구성을 저장했습니다.');
}

function resetCurrentManualRegion() {
  if (!currentManualRegionName) {
    alert('먼저 기본값으로 돌릴 지역 버튼을 눌러주세요.');
    return;
  }
  clearSavedManualRegion(currentManualRegionName);
  paintManualPreview(currentManualRegionName);
  alert(currentManualRegionName + ' 기본값으로 복귀했습니다.');
}

function renderManualRegionButtons(zone) {
  clearManualPreviewPaint();
  currentManualRegionName = '';
  currentManualRegionPaths = [];

  document.querySelectorAll('#manualRegionZones button').forEach(b => {
    b.classList.toggle('active', b.dataset.zone === zone);
  });

  const box = document.getElementById('manualRegionButtons');
  const subtitle = document.getElementById('manualRegionSubtitle');
  const info = document.getElementById('manualRegionIncluded');
  if (!box) return;

  box.innerHTML = '';
  if (subtitle) subtitle.textContent = zone + ' 지역';
  updateManualRegionInfo();

  (MANUAL_REGION_MENU[zone] || []).forEach(region => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = manualRegionButtonName(region);
    btn.dataset.region = region;
    btn.onclick = () => {
      const alreadyActive = btn.classList.contains('active') && normText(currentManualRegionName) === normText(region);
      document.querySelectorAll('#manualRegionButtons button').forEach(b => b.classList.remove('active'));
      if (alreadyActive) {
        clearManualPreviewPaint();
        currentManualRegionName = '';
        currentManualRegionPaths = [];
        updateManualRegionInfo();
        return;
      }
      btn.classList.add('active');
      paintManualPreview(region);
    };
    box.appendChild(btn);
  });
}


function __manualRegionBackupNowString() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes());
}

function collectManualRegionBackupData() {
  const data = {
    app: 'kma-rain-map',
    type: 'manual-region-backup',
    version: 1,
    savedAt: new Date().toISOString(),
    aliases: {},
    overrides: {},
    customMenu: getManualRegionCustomMenu(),
    hiddenMenu: getManualRegionHiddenMenu(),
    menuOrder: getManualRegionOrderMenu()
  };
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i) || '';
      if (key.startsWith('kmaManualRegionAliases_v2_')) {
        data.aliases[key.replace('kmaManualRegionAliases_v2_', '')] = JSON.parse(localStorage.getItem(key) || '[]');
      } else if (key.startsWith('kmaManualRegionOverride_v1_')) {
        data.overrides[key.replace('kmaManualRegionOverride_v1_', '')] = JSON.parse(localStorage.getItem(key) || '[]');
      }
    }
  } catch(e) {}
  return data;
}

function setManualRegionJsonStatus(message, state) {
  const el = document.getElementById('manualRegionJsonStatus');
  if (!el) return;
  el.textContent = message;
  el.classList.remove('ok','warn','err');
  if (state) el.classList.add(state);
}

function refreshManualRegionPanelAfterImport() {
  try {
    const activeZone = document.querySelector('#manualRegionZones button.active');
    const selectedRegion = currentManualRegionName;
    if (activeZone) renderManualRegionButtons(activeZone.dataset.zone);
    if (selectedRegion) paintManualPreview(selectedRegion);
    updateManualRegionInfo();
  } catch(e) {}
}

function applyManualRegionBackupObject(data, options) {
  options = options || {};
  if (typeof localStorage === 'undefined') {
    if (!options.silent) alert('이 브라우저에서는 저장소를 사용할 수 없습니다.');
    setManualRegionJsonStatus('치환 데이터: 브라우저 저장소 사용 불가', 'err');
    return false;
  }
  const normalized = normalizeManualRegionBackupData(data);
  const aliasCount = Object.keys(normalized.aliases).length;
  const overrideCount = Object.keys(normalized.overrides).length;
  const customCount = Object.keys(normalized.customMenu || {}).reduce((n,k)=>n + ((normalized.customMenu[k] || []).length), 0);
  const hiddenCount = Object.keys(normalized.hiddenMenu || {}).reduce((n,k)=>n + ((normalized.hiddenMenu[k] || []).length), 0);
  const orderCount = Object.keys(normalized.menuOrder || {}).reduce((n,k)=>n + ((normalized.menuOrder[k] || []).length), 0);
  if (!aliasCount && !overrideCount && !customCount && !hiddenCount && !orderCount) {
    if (!options.silent) alert('가져올 지역 치환/수동 매칭 데이터가 없습니다.');
    if (options.source === 'auto') setManualRegionJsonStatus('치환 데이터: region_replace.json은 있으나 적용할 데이터 없음', 'warn');
    return false;
  }

  Object.keys(normalized.aliases).forEach(k => {
    localStorage.setItem('kmaManualRegionAliases_v2_' + normText(k), JSON.stringify(normalized.aliases[k]));
  });
  Object.keys(normalized.overrides).forEach(k => {
    localStorage.setItem('kmaManualRegionOverride_v1_' + normText(k), JSON.stringify(normalized.overrides[k]));
  });
  if (normalized.customMenu && Object.keys(normalized.customMenu).length) {
    const currentCustom = getManualRegionCustomMenu();
    Object.keys(normalized.customMenu).forEach(zone => {
      const z = zoneName(zone);
      const base = Array.isArray(currentCustom[z]) ? currentCustom[z].map(normText).filter(Boolean) : [];
      const merged = Array.from(new Set([...base, ...(normalized.customMenu[zone] || []).map(normText).filter(Boolean)]));
      currentCustom[z] = merged;
    });
    saveManualRegionCustomMenu(currentCustom);
    applyManualRegionCustomMenu(currentCustom);
  }
  if (normalized.hiddenMenu && Object.keys(normalized.hiddenMenu).length) {
    const currentHidden = getManualRegionHiddenMenu();
    Object.keys(normalized.hiddenMenu).forEach(zone => {
      const z = zoneName(zone);
      const base = Array.isArray(currentHidden[z]) ? currentHidden[z].map(normText).filter(Boolean) : [];
      currentHidden[z] = Array.from(new Set([...base, ...(normalized.hiddenMenu[zone] || []).map(normText).filter(Boolean)]))
        .filter(name => !isManualRegionBaseButton(z, name));
    });
    saveManualRegionHiddenMenu(currentHidden);
    applyManualRegionHiddenMenu(currentHidden);
  }
  if (normalized.menuOrder && Object.keys(normalized.menuOrder).length) {
    const currentOrder = getManualRegionOrderMenu();
    Object.keys(normalized.menuOrder).forEach(zone => {
      const z = zoneName(zone);
      currentOrder[z] = (normalized.menuOrder[zone] || []).map(normText).filter(Boolean);
    });
    saveManualRegionOrderMenu(currentOrder);
    applyManualRegionOrderMenu(currentOrder);
  }

  refreshManualRegionPanelAfterImport();

  const savedAt = data && data.savedAt ? String(data.savedAt).replace('T',' ').replace(/\..*$/,'') : '';
  const suffix = savedAt ? ' / ' + savedAt : '';
  if (options.source === 'auto') {
    setManualRegionJsonStatus('치환 데이터: GitHub region_replace.json 자동 적용' + suffix, 'ok');
  } else {
    setManualRegionJsonStatus('치환 데이터: 파일 불러오기 적용' + suffix, 'ok');
  }
  return true;
}

function autoLoadManualRegionBackupJson() {
  // GitHub Pages에 region_replace.json을 같이 올려두면 모바일/PC에서 자동 적용됩니다.
  // 파일이 없으면 기존 localStorage 개인 저장값 또는 기본값을 그대로 사용합니다.
  if (location.protocol === 'file:') {
    setManualRegionJsonStatus('치환 데이터: 로컬 파일 실행 중 · GitHub 자동 불러오기 제외', 'warn');
    return;
  }
  fetch('region_replace.json?ts=' + Date.now(), { cache:'no-store' })
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(data => applyManualRegionBackupObject(data, { source:'auto', silent:true }))
    .catch(() => {
      setManualRegionJsonStatus('치환 데이터: region_replace.json 없음 · 개인 저장값/기본값 사용', 'warn');
    });
}

function exportManualRegionBackup() {
  if (typeof localStorage === 'undefined') {
    alert('이 브라우저에서는 저장소를 사용할 수 없습니다.');
    return;
  }
  const data = collectManualRegionBackupData();
  const hasData = Object.keys(data.aliases).length || Object.keys(data.overrides).length || Object.keys(data.customMenu || {}).length || Object.keys(data.hiddenMenu || {}).length || Object.keys(data.menuOrder || {}).length;
  if (!hasData && !confirm('저장된 지역 치환/수동 매칭값이 없습니다. 빈 백업 파일을 만들까요?')) return;

  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'region_replace.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function normalizeManualRegionBackupData(data) {
  const result = { aliases:{}, overrides:{}, customMenu:{}, hiddenMenu:{}, menuOrder:{} };
  if (!data || typeof data !== 'object') return result;

  if (data.aliases && typeof data.aliases === 'object') {
    Object.keys(data.aliases).forEach(k => {
      if (Array.isArray(data.aliases[k])) result.aliases[normText(k)] = data.aliases[k].map(normText).filter(Boolean);
    });
  }
  if (data.overrides && typeof data.overrides === 'object') {
    Object.keys(data.overrides).forEach(k => {
      if (Array.isArray(data.overrides[k])) result.overrides[normText(k)] = data.overrides[k].map(String).filter(Boolean);
    });
  }
  if (data.customMenu && typeof data.customMenu === 'object') {
    Object.keys(data.customMenu).forEach(k => {
      const z = zoneName(k);
      if (MANUAL_REGION_MENU[z] && Array.isArray(data.customMenu[k])) {
        result.customMenu[z] = data.customMenu[k].map(normText).filter(Boolean);
      }
    });
  }
  if (data.hiddenMenu && typeof data.hiddenMenu === 'object') {
    Object.keys(data.hiddenMenu).forEach(k => {
      const z = zoneName(k);
      if (MANUAL_REGION_MENU[z] && Array.isArray(data.hiddenMenu[k])) {
        result.hiddenMenu[z] = data.hiddenMenu[k].map(normText).filter(Boolean);
      }
    });
  }
  if (data.menuOrder && typeof data.menuOrder === 'object') {
    Object.keys(data.menuOrder).forEach(k => {
      const z = zoneName(k);
      if (MANUAL_REGION_MENU[z] && Array.isArray(data.menuOrder[k])) {
        result.menuOrder[z] = data.menuOrder[k].map(normText).filter(Boolean);
      }
    });
  }

  // 혹시 전체 localStorage 형식으로 백업한 파일도 받을 수 있게 처리합니다.
  if (data.localStorage && typeof data.localStorage === 'object') {
    Object.keys(data.localStorage).forEach(key => {
      try {
        const val = JSON.parse(data.localStorage[key]);
        if (key.startsWith('kmaManualRegionAliases_v2_') && Array.isArray(val)) {
          result.aliases[normText(key.replace('kmaManualRegionAliases_v2_', ''))] = val.map(normText).filter(Boolean);
        }
        if (key.startsWith('kmaManualRegionOverride_v1_') && Array.isArray(val)) {
          result.overrides[normText(key.replace('kmaManualRegionOverride_v1_', ''))] = val.map(String).filter(Boolean);
        }
        if (key === MANUAL_REGION_CUSTOM_MENU_KEY && val && typeof val === 'object') {
          Object.keys(val).forEach(z => {
            if (Array.isArray(val[z])) result.customMenu[zoneName(z)] = val[z].map(normText).filter(Boolean);
          });
        }
        if (key === MANUAL_REGION_HIDDEN_MENU_KEY && val && typeof val === 'object') {
          Object.keys(val).forEach(z => {
            if (Array.isArray(val[z])) result.hiddenMenu[zoneName(z)] = val[z].map(normText).filter(Boolean);
          });
        }
        if (key === MANUAL_REGION_ORDER_MENU_KEY && val && typeof val === 'object') {
          Object.keys(val).forEach(z => {
            if (Array.isArray(val[z])) result.menuOrder[zoneName(z)] = val[z].map(normText).filter(Boolean);
          });
        }
      } catch(e) {}
    });
  }
  return result;
}

function importManualRegionBackupFromObject(data) {
  if (typeof localStorage === 'undefined') {
    alert('이 브라우저에서는 저장소를 사용할 수 없습니다.');
    return;
  }
  const normalized = normalizeManualRegionBackupData(data);
  const aliasCount = Object.keys(normalized.aliases).length;
  const overrideCount = Object.keys(normalized.overrides).length;
  const customCount = Object.keys(normalized.customMenu || {}).reduce((n,k)=>n + ((normalized.customMenu[k] || []).length), 0);
  const hiddenCount = Object.keys(normalized.hiddenMenu || {}).reduce((n,k)=>n + ((normalized.hiddenMenu[k] || []).length), 0);
  const orderCount = Object.keys(normalized.menuOrder || {}).reduce((n,k)=>n + ((normalized.menuOrder[k] || []).length), 0);
  if (!aliasCount && !overrideCount && !customCount && !hiddenCount && !orderCount) {
    alert('가져올 지역 치환/수동 매칭 데이터가 없습니다.');
    return;
  }

  if (!confirm('지역 치환/수동 매칭 백업을 불러올까요?\n기존 같은 지역 저장값은 백업 파일 내용으로 교체됩니다.')) return;

  if (applyManualRegionBackupObject(data, { source:'file', silent:true })) {
    alert('지역 치환/수동 매칭 백업을 불러왔습니다.\n다음 매칭부터 적용됩니다.');
  }
}

function openManualRegionImportFile() {
  const input = document.getElementById('manualRegionImportFile');
  if (input) {
    input.value = '';
    input.click();
  }
}

function handleManualRegionImportFile(ev) {
  const file = ev && ev.target && ev.target.files ? ev.target.files[0] : null;
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result || ''));
      importManualRegionBackupFromObject(data);
    } catch(e) {
      alert('JSON 파일을 읽지 못했습니다. 파일을 확인해주세요.');
    }
  };
  reader.onerror = () => alert('파일을 읽지 못했습니다.');

// ===== Ver.1.8.1 버튼 효과음 =====
(function initButtonSound(){
  const KEY = 'rainMapButtonSoundEnabled';
  let soundEnabled = localStorage.getItem(KEY);
  soundEnabled = soundEnabled === null ? true : soundEnabled === '1';
  let audioCtx = null;

  function getAudioCtx(){
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function uiVibrate(type){
    if (soundEnabled) return;
    if (!navigator.vibrate) return;
    try {
      if (type === 'done') navigator.vibrate([35, 25, 45]);
      else if (type === 'save' || type === 'image') navigator.vibrate([22, 18, 22]);
      else if (type === 'reset') navigator.vibrate(35);
      else if (type === 'error') navigator.vibrate([60, 30, 60]);
      else navigator.vibrate(18);
    } catch(e) {}
  }

  function tone(freq1, freq2, duration, peak, wave){
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = wave || 'sine';
    osc.frequency.setValueAtTime(freq1, now);
    if (freq2 && freq2 !== freq1) osc.frequency.exponentialRampToValueAtTime(freq2, now + Math.max(0.02, duration * 0.55));
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak || 0.045, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function playTone(type){
    if (!soundEnabled) { uiVibrate(type); return; }

    if (type === 'done') {
      // 매칭 적용 완료만 띠링 소리
      tone(660, 880, 0.11, 0.055, 'sine');
      setTimeout(() => tone(880, 1175, 0.14, 0.065, 'sine'), 90);
      return;
    }
    // 그 외 모든 버튼/동작은 같은 톡 소리
    tone(620, 760, 0.075, 0.04, 'sine');
  }

  function updateSoundButton(){
    const btn = document.getElementById('soundToggle');
    if (!btn) return;
    btn.textContent = soundEnabled ? '🔊 ON' : '🔇 OFF';
    btn.classList.toggle('sound-on', soundEnabled);
    btn.classList.toggle('sound-off', !soundEnabled);
  }

  window.playUiClickSound = () => playTone('click');
  window.playUiDoneSound = () => playTone('done');
  window.playUiErrorSound = () => playTone('click');

  document.addEventListener('DOMContentLoaded', updateSoundButton);
  updateSoundButton();

  document.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if (!btn) return;

    if (btn.id === 'soundToggle') {
      soundEnabled = !soundEnabled;
      localStorage.setItem(KEY, soundEnabled ? '1' : '0');
      updateSoundButton();
      if (soundEnabled) playTone('click');
      else uiVibrate('click');
      return;
    }

    // 모든 버튼은 같은 톡 소리로 통일
    playTone('click');
  }, true);
})();

(function(){

    '강원중부산지',
    '강원남부산지',

      if (key.indexOf('강원') === 0 && key.indexOf('산지') >= 0) {

        x = c[0];
        y = c[1] - 10;
        if (key === '강원북부산지') { x -= 24; y -= 52; }
        else if (key === '강원남부산지') { x += 24; y += 52; }
      }

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class','mountain-icon-group startup-mountain-icon');
      g.dataset.mountain = key;
      g.dataset.amount = '';
      g.dataset.x = x;
      g.dataset.y = y;

      const tri = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      tri.setAttribute('class','mountain-triangle');
      tri.setAttribute('d','M 0 -16 L 17 14 L -17 14 Z');

      const title = document.createElementNS('http://www.w3.org/2000/svg','title');

      g.addEventListener('click', function(e){

      });

      try { makeDraggableMountain(g, key, 'startup'); } catch(_) {}
      mountainIconsG.appendChild(g);
    });
  };

  const __oldClearRainMatch = window.clearRainMatch || (typeof clearRainMatch === 'function' ? clearRainMatch : null);
  if (__oldClearRainMatch) {
    window.clearRainMatch = clearRainMatch = function(){
      __oldClearRainMatch.apply(this, arguments);
      setTimeout(window.renderStartupMountainMarkers, 0);
    };
  }

  const __oldRenderMountainIcons = window.renderMountainIcons || (typeof renderMountainIcons === 'function' ? renderMountainIcons : null);
  if (__oldRenderMountainIcons) {
    window.renderMountainIcons = renderMountainIcons = function(){
      __oldRenderMountainIcons.apply(this, arguments);
      if (!hasForecastMountainIcons()) setTimeout(window.renderStartupMountainMarkers, 0);

  if (document.readyState === 'loading') {

/* ===== v7.80 지역 수동 매칭 안정화 =====
   - 기본 메뉴는 항상 원본 기준으로 복원한 뒤 customMenu만 뒤에 붙입니다.
   - 초기화/매칭 후에도 산지 같은 기본 버튼이 사라지지 않습니다.
   - 예보 매칭 후 잡힌 지역 버튼은 수동 매칭 패널에서 자동으로 표시됩니다.
*/
(function(){
  window.__manualMatchedRegionNames = new Set();

  function __cloneMenu(obj) {
    const out = {};
    Object.keys(obj || {}).forEach(z => out[z] = (obj[z] || []).map(normText).filter(Boolean));
    return out;
  }

  function __filterOnlyCustomMenu(obj) {
    const out = {};
    Object.keys(obj || {}).forEach(zone => {
      const z = zoneName(zone);
      if (!z || !MANUAL_REGION_BASE_MENU[z]) return;
      const baseSet = new Set((MANUAL_REGION_BASE_MENU[z] || []).map(normText));
      const arr = (Array.isArray(obj[zone]) ? obj[zone] : []).map(normText).filter(Boolean)
        .filter(name => !baseSet.has(name));
      if (arr.length) out[z] = Array.from(new Set(arr));
    });
    return out;
  }

  const __oldGetCustom = window.getManualRegionCustomMenu || (typeof getManualRegionCustomMenu === 'function' ? getManualRegionCustomMenu : null);
  if (__oldGetCustom) {
    window.getManualRegionCustomMenu = getManualRegionCustomMenu = function(){
      const clean = __filterOnlyCustomMenu(__oldGetCustom.apply(this, arguments) || {});
      try { localStorage.setItem(MANUAL_REGION_CUSTOM_MENU_KEY, JSON.stringify(clean)); } catch(e) {}
      return clean;
    };
  }

  const __oldSaveCustom = window.saveManualRegionCustomMenu || (typeof saveManualRegionCustomMenu === 'function' ? saveManualRegionCustomMenu : null);
  if (__oldSaveCustom) {
    window.saveManualRegionCustomMenu = saveManualRegionCustomMenu = function(obj){
      return __oldSaveCustom.call(this, __filterOnlyCustomMenu(obj || {}));
    };
  }

  window.rebuildManualRegionMenuStable = function(){
    const next = __cloneMenu(MANUAL_REGION_BASE_MENU);
    const custom = __filterOnlyCustomMenu((typeof getManualRegionCustomMenu === 'function' ? getManualRegionCustomMenu() : {}));
    Object.keys(custom).forEach(zone => {
      const z = zoneName(zone);
      if (!next[z]) return;
      const seen = new Set(next[z].map(normText));
      custom[zone].forEach(name => {
        const key = normText(name);
        if (key && !seen.has(key)) { next[z].push(key); seen.add(key); }
      });
    });

    const hidden = (typeof getManualRegionHiddenMenu === 'function' ? getManualRegionHiddenMenu() : {});
    Object.keys(hidden || {}).forEach(zone => {
      const z = zoneName(zone);
      if (!next[z]) return;
      const baseSet = new Set((MANUAL_REGION_BASE_MENU[z] || []).map(normText));
      const hiddenSet = new Set((hidden[zone] || []).map(normText).filter(v => !baseSet.has(v)));
      if (hiddenSet.size) next[z] = next[z].filter(name => !hiddenSet.has(normText(name)));
    });

    const order = (typeof getManualRegionOrderMenu === 'function' ? getManualRegionOrderMenu() : {});
    Object.keys(order || {}).forEach(zone => {
      const z = zoneName(zone);
      if (!next[z]) return;
      const current = next[z].map(normText);
      const seen = new Set();
      const ordered = [];
      (order[zone] || []).map(normText).filter(Boolean).forEach(name => {
        if (current.includes(name) && !seen.has(name)) { ordered.push(name); seen.add(name); }
      });
      current.forEach(name => { if (!seen.has(name)) ordered.push(name); });
      next[z] = ordered;
    });

    Object.keys(MANUAL_REGION_MENU).forEach(k => delete MANUAL_REGION_MENU[k]);
    Object.keys(next).forEach(k => MANUAL_REGION_MENU[k] = next[k]);
  };

  function __collectMatchedManualRegionsFromForecast() {
    const out = new Set();

    function __addMatchedManualName(name) {
      const key = normText(name);
      if (!key || key === '__NO_MATCH__') return;
      out.add(key);

      // v7.81: 강원산지는 대표 버튼 1개만 켜지는 것이 아니라
      // 실제 표시 단위인 강원북부산지/강원중부산지/강원남부산지도 함께 켭니다.
      // 그래야 치환 확인/수정 시 산지 세부 구역이 모두 잡힌 것으로 보입니다.
      const expand = {
        '강원산지': ['강원북부산지','강원중부산지','강원남부산지'],
        '강원북부': ['강원북부내륙','강원북부동해안','강원북부산지'],
        '강원중부': ['강원중부내륙','강원중부동해안','강원중부산지'],
        '강원남부': ['강원남부내륙','강원남부동해안','강원남부산지'],
        '강원영동': ['강원북부동해안','강원중부동해안','강원남부동해안','강원북부산지','강원중부산지','강원남부산지']
      };
      (expand[key] || []).forEach(v => out.add(normText(v)));
    }
    try {
      const raw = (document.getElementById('forecastText') && document.getElementById('forecastText').value) || '';
      const lines = raw.split(/\n+/).map(v => v.trim()).filter(Boolean);
      const allParts = [];
      lines.forEach(line => splitForecastParts(line).forEach(p => allParts.push(p)));
      const parts = (typeof applyAutoHeavyGroupingToParts === 'function') ? applyAutoHeavyGroupingToParts(allParts) : allParts;
      parts.forEach(part => {
        const area = part.area || '';
        const zone = part.zone || '';
        let tokens = [];
        try { tokens = tokensFromArea(area, zone) || []; } catch(e) { tokens = []; }
        if (part.type === 'mountain') tokens.push(area);
        tokens.forEach(t => {
          const c = resolveManualRegionCanonical(normText(t));
          if (c && c !== '__NO_MATCH__') __addMatchedManualName(c);
        });
      });
    } catch(e) {}

    try {
      const matchedIds = new Set(Array.from(document.querySelectorAll('.region.matched')).map(pathRegionId));
      if (matchedIds.size) {
        allManualRegionNames().forEach(name => {
          const paths = getManualRegionPaths(name) || [];
          if (paths.some(p => matchedIds.has(pathRegionId(p)))) __addMatchedManualName(name);
        });
      }
    } catch(e) {}
    return out;
  }

  window.refreshManualMatchedButtonMarks = function(){
    document.querySelectorAll('#manualRegionButtons button').forEach(btn => {
      const key = normText(btn.dataset.region || '');
      const on = !!(key && window.__manualMatchedRegionNames && window.__manualMatchedRegionNames.has(key));
      btn.classList.toggle('matched-auto', on);
      if (on) btn.title = '예보 매칭에 포함된 지역';
      else btn.removeAttribute('title');
    });
  };

  const __oldRenderButtons = window.renderManualRegionButtons || (typeof renderManualRegionButtons === 'function' ? renderManualRegionButtons : null);
  if (__oldRenderButtons) {
    window.renderManualRegionButtons = renderManualRegionButtons = function(zone){
      try { window.rebuildManualRegionMenuStable(); } catch(e) {}
      const result = __oldRenderButtons.apply(this, arguments);
      try { window.refreshManualMatchedButtonMarks(); } catch(e) {}
      return result;
    };
  }

  const __oldResetMapContentsOnly = window.resetMapContentsOnly || (typeof resetMapContentsOnly === 'function' ? resetMapContentsOnly : null);
  if (__oldResetMapContentsOnly) {
    window.resetMapContentsOnly = resetMapContentsOnly = function(){
      const result = __oldResetMapContentsOnly.apply(this, arguments);
      window.__manualMatchedRegionNames = new Set();
      try { window.rebuildManualRegionMenuStable(); } catch(e) {}
      const activeZone = document.querySelector('#manualRegionZones button.active');
      if (activeZone) renderManualRegionButtons(activeZone.dataset.zone);
      else try { window.refreshManualMatchedButtonMarks(); } catch(e) {}
      return result;
    };
    const clearBtn = document.getElementById('clearBtn');
    if (clearBtn) {
      clearBtn.replaceWith(clearBtn.cloneNode(true));
      const newClear = document.getElementById('clearBtn');
      if (newClear) newClear.addEventListener('click', window.resetMapContentsOnly);
    }
  }

  const __oldApplyForecastMatch = window.applyForecastMatch || (typeof applyForecastMatch === 'function' ? applyForecastMatch : null);
  if (__oldApplyForecastMatch) {
    window.applyForecastMatch = applyForecastMatch = function(){
      const result = __oldApplyForecastMatch.apply(this, arguments);
      try {
        window.__manualMatchedRegionNames = __collectMatchedManualRegionsFromForecast();
        window.rebuildManualRegionMenuStable();
        const activeZone = document.querySelector('#manualRegionZones button.active');
        if (activeZone) renderManualRegionButtons(activeZone.dataset.zone);
        else window.refreshManualMatchedButtonMarks();
      } catch(e) {}
      return result;
    };
  }

  setTimeout(() => {
    try { window.rebuildManualRegionMenuStable(); } catch(e) {}
    const activeZone = document.querySelector('#manualRegionZones button.active');
    if (activeZone) renderManualRegionButtons(activeZone.dataset.zone);
  }, 0);
})();

    }, 350);

    return result;
  };

  wrappedManual.__v211ResetAfterColor = true;
  window.applyManualIndexColorToSelectedAmount =
    applyManualIndexColorToSelectedAmount = wrappedManual;
})();
</script>

<script id="v2-13-freeze-label-position-on-color-change">
(function(){
  var oldManual = (typeof applyManualIndexColorToSelectedAmount === 'function')
    ? applyManualIndexColorToSelectedAmount
    : null;

  if (!oldManual || oldManual.__v213FreezeLabelPosition) return;

  function norm(v){
    try { return normalizeAmountKey(String(v || '')); }
    catch(e){ return String(v || '').replace(/\s+/g,'').replace(/mm/gi,''); }
  }

  function capturePositions(){
    var map = {};
    document.querySelectorAll('.amount-label-group').forEach(function(el){
      var key = norm(el.dataset.amount || '');
      if (!key) return;

      var x = Number(el.dataset.x);
      var y = Number(el.dataset.y);

      if (!Number.isFinite(x) || !Number.isFinite(y)) {
        var tr = el.getAttribute('transform') || '';
        var m = tr.match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/);
        if (m) {
          x = Number(m[1]);
          y = Number(m[2]);
        }
      }

      if (Number.isFinite(x) && Number.isFinite(y)) {
        map[key] = {x:x, y:y};
      }
    });
    return map;
  }

  function restorePositions(map){
    document.querySelectorAll('.amount-label-group').forEach(function(el){
      var key = norm(el.dataset.amount || '');
      var p = map[key];
      if (!p) return;

      el.dataset.x = p.x;
      el.dataset.y = p.y;
      el.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ')');

      /*
        이후 다른 색을 다시 변경해도 같은 자리를 유지하도록
        현재 화면 위치를 저장 위치에도 반영합니다.
      */
      try {
        if (typeof saveLabelPos === 'function') {
          saveLabelPos(el.dataset.amount || key, p.x, p.y);
        }
      } catch(e) {}
    });
  }

  var wrappedManual = function(){
    /*
      수동 인덱스 색 변경 전 현재 모든 수치 박스 위치를 먼저 보관합니다.
      색 변경 과정에서 renderAmountLabels()가 다시 실행되더라도
      변경 후 원래 위치를 그대로 복원합니다.
    */
    var positions = capturePositions();
    var result = oldManual.apply(this, arguments);

    restorePositions(positions);
    requestAnimationFrame(function(){
      restorePositions(positions);
      setTimeout(function(){ restorePositions(positions); }, 60);
    });

    return result;
  };

  wrappedManual.__v213FreezeLabelPosition = true;
  window.applyManualIndexColorToSelectedAmount =
    applyManualIndexColorToSelectedAmount = wrappedManual;
})();
</script>


<script id="v2-15-auto-reset-after-2s">
(function(){
  var resetTimer = null;
  var RESET_DELAY = 2000;

  function clearResetTimer(){
    if (resetTimer !== null) {
      clearTimeout(resetTimer);
      resetTimer = null;
    }
  }

  function restoreWholeMap(){
    clearResetTimer();

    document.querySelectorAll(
      '.region.hover-dim, .region.hover-focus,' +
      '.amount-label-group.hover-dim, .amount-label-group.hover-focus,' +
      '.mountain-value-label-group.hover-dim, .mountain-value-label-group.hover-focus,' +
      '.mountain-icon-group.hover-dim, .mountain-icon-group.hover-focus'
    ).forEach(function(el){
      el.classList.remove('hover-dim', 'hover-focus');
      el.style.removeProperty('opacity');
    });

    document.querySelectorAll('.amount-label-group.manual-index-selected')
      .forEach(function(el){
        el.classList.remove('manual-index-selected');
      });

    try { selectedManualAmountKey = ''; } catch(e) {}
    try { selectedManualColor = ''; } catch(e) {}
    try { selectedAmountKey = ''; } catch(e) {}
    window.__selectedManualAmountElementKey = '';

    var mapwrap = document.querySelector('.mapwrap');
    if (mapwrap) mapwrap.classList.remove('manual-color-changing');
  }

  function startResetTimer(){
    clearResetTimer();
    resetTimer = setTimeout(function(){
      restoreWholeMap();
    }, RESET_DELAY);
  }

  /*
    수치 박스를 누르면 2초 타이머 시작.
    다른 수치를 누르면 기존 타이머를 취소하고 새로 2초 시작.
  */
  document.addEventListener('pointerup', function(e){
    var amountGroup = e.target && e.target.closest
      ? e.target.closest('.amount-label-group')
      : null;

    if (!amountGroup) return;

    setTimeout(function(){
      if (document.querySelector('.amount-label-group.manual-index-selected')) {
        startResetTimer();
      }
    }, 0);
  }, true);

  /*
    수동 인덱스 색을 누르면 자동복귀 타이머를 즉시 취소.
    이후 기존 색 변경 완료 로직이 전체 지도를 복원합니다.
  */
  document.addEventListener('pointerdown', function(e){
    var colorChip = e.target && e.target.closest
      ? e.target.closest('.manual-color-chip')
      : null;

    if (colorChip) clearResetTimer();
  }, true);

  /*
    색 변경 함수가 실행될 때도 타이머를 확실히 취소합니다.
  */
  var oldManual = (typeof applyManualIndexColorToSelectedAmount === 'function')
    ? applyManualIndexColorToSelectedAmount
    : null;

  if (oldManual && !oldManual.__v215AutoResetCancel) {
    var wrappedManual = function(){
      clearResetTimer();
      return oldManual.apply(this, arguments);
    };
    wrappedManual.__v215AutoResetCancel = true;
    window.applyManualIndexColorToSelectedAmount =
      applyManualIndexColorToSelectedAmount = wrappedManual;
  }

  window.__restoreWholeMapAfterAmountIdle = restoreWholeMap;
})();
</script>

<script id="v2-20-manual-palette-and-mixed-map-script">
(function(){
  const RAIN_12 = [
    '#EAF8FF','#CDEEFF','#9DD7FF','#63B8FF','#2F91F2','#176FD1',
    '#1257B5','#173F96','#282A78','#5940A8','#76258F','#4A075F'
  ];
  const SHOWER_12 = [
    '#EDFFE8','#D3F7C8','#ACEB9B','#7FDA74','#58C55B','#37AF49',
    '#23983D','#147F34','#0B682B','#075424','#043F1B','#022D13'
  ];

  window.__manualPaletteMode = window.__manualPaletteMode || 'rain';

  const rainBtn = document.getElementById('manualRainModeBtn');
  const showerBtn = document.getElementById('manualShowerModeBtn');
  const bothBtn = document.getElementById('manualBothModeBtn');

  function nk(v){
    try { return normalizeAmountKey(String(v || '')); }
    catch(e){ return String(v || '').replace(/\s+/g,'').replace(/mm/gi,''); }
  }

  function renderPaletteOnly(){
    const grid = document.getElementById('manualColorGrid');
    const title = document.getElementById('manualColorTitleText');
    if (!grid) return;

    grid.innerHTML = '';
    grid.classList.remove('mode-12','mode-24');

    let items = [];
    if (window.__manualPaletteMode === 'rain') {
      if (title) title.textContent = '예상 강우량 단계 인덱스';
      grid.classList.add('mode-12');
      items = RAIN_12.map((color,i)=>({color, title:'예상 강우량 '+(i+1)+'단계 색상'}));
    } else if (window.__manualPaletteMode === 'shower') {
      if (title) title.textContent = '소나기 단계 인덱스';
      grid.classList.add('mode-12');
      items = SHOWER_12.map((color,i)=>({color, title:'소나기 '+(i+1)+'단계 색상'}));
    } else {
      if (title) title.textContent = '강우량+소나기 단계 인덱스';
      grid.classList.add('mode-24');
      items = RAIN_12.map((color,i)=>({color, title:'강우량 '+(i+1)+'단계 색상'}))
        .concat(SHOWER_12.map((color,i)=>({color, title:'소나기 '+(i+1)+'단계 색상'})));
    }

    items.forEach(function(item, index){
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'manual-color-chip mode-palette-chip';
      chip.style.background = item.color;
      chip.dataset.color = item.color;
      chip.title = item.title;
      chip.setAttribute('aria-label', item.title);
      chip.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        if (!selectedManualAmountKey) return;
        applyManualIndexColorToSelectedAmount(item.color);
      });
      grid.appendChild(chip);
    });

    if (typeof updateManualColorPaletteState === 'function') {
      updateManualColorPaletteState();
    }
  }

  function refreshButtons(){
    if (rainBtn) rainBtn.classList.toggle('mode-active', window.__manualPaletteMode === 'rain');
    if (showerBtn) showerBtn.classList.toggle('mode-active', window.__manualPaletteMode === 'shower');
    if (bothBtn) bothBtn.classList.toggle('mode-active', window.__manualPaletteMode === 'both');
  }

  function setPaletteMode(mode){
    /*
      중요: 이 버튼들은 수동 인덱스에 보이는 색상표만 바꿉니다.
      지도와 수치 박스의 현재 색상은 절대 변경하지 않습니다.
    */
    window.__manualPaletteMode = mode;
    refreshButtons();
    renderPaletteOnly();
  }

  if (rainBtn) rainBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); setPaletteMode('rain'); });
  if (showerBtn) showerBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); setPaletteMode('shower'); });
  if (bothBtn) bothBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); setPaletteMode('both'); });

  /*
    기존 코드가 팔레트를 다시 그리는 경우에도 현재 수동 팔레트 모드를 유지합니다.
    지도 색상 모드(currentMapColorMode)는 건드리지 않습니다.
  */
  const oldRenderPalette = (typeof renderManualColorPalette === 'function') ? renderManualColorPalette : null;
  if (oldRenderPalette && !oldRenderPalette.__v220PaletteOnly) {
    const wrapped = function(){
      renderPaletteOnly();
    };
    wrapped.__v220PaletteOnly = true;
    window.renderManualColorPalette = renderManualColorPalette = wrapped;
  }

  function splitLinesWithKind(raw){
    const rows = [];
    let kind = '';
    String(raw || '').split(/\n+/).forEach(function(line){
      const s = String(line || '').trim();
      if (!s) return;

      if (/소나기에\s*의한\s*예상\s*강수량/i.test(s)) {
        kind = 'shower';
        return;
      }
      if (/예상\s*강수량/i.test(s) && !/소나기에\s*의한/i.test(s)) {
        kind = 'rain';
        return;
      }
      if (!kind) return;

      try {
        splitForecastParts(s).forEach(function(part){
          rows.push({kind:kind, part:part});
        });
      } catch(e) {}
    });
    return rows;
  }

  function recolorMixedRainShower(){
    const input = document.getElementById('forecastText');
    const raw = input ? input.value : '';
    const hasRain = /(?:^|\n)\s*\*?\s*예상\s*강수량/im.test(raw);
    const hasShower = /소나기에\s*의한\s*예상\s*강수량/im.test(raw);
    if (!(hasRain && hasShower)) return;

    const records = splitLinesWithKind(raw);
    if (!records.length) return;

    const rainKeys = [];
    const showerKeys = [];
    records.forEach(function(rec){
      const k = nk(rec.part && rec.part.amount);
      if (!k) return;
      const arr = rec.kind === 'shower' ? showerKeys : rainKeys;
      if (!arr.includes(k)) arr.push(k);
    });

    const rainMap = buildDistinctModeColorMap(rainKeys, 'rain');
    const showerMap = buildDistinctModeColorMap(showerKeys, 'shower');
    window.__mixedAmountKindMap = {};

    /* 강우량+소나기 겹침 지역용 SVG 사선 빗금 패턴 */
    const svgRoot = document.querySelector('.mapwrap svg') || document.querySelector('svg');
    let defs = svgRoot ? svgRoot.querySelector('defs') : null;
    if (svgRoot && !defs) {
      defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      svgRoot.insertBefore(defs, svgRoot.firstChild);
    }
    if (defs) defs.querySelectorAll('pattern[data-rain-shower-hatch="1"]').forEach(function(p){ p.remove(); });

    const patternCache = {};
    function safeColorId(color){ return String(color || '').replace(/[^a-z0-9]/gi,'').toLowerCase(); }
    function ensureOverlapPattern(rainColor, showerColor){
      const cacheKey = String(rainColor) + '|' + String(showerColor);
      if (patternCache[cacheKey]) return patternCache[cacheKey];
      if (!defs) return rainColor;

      const id = 'rainShowerHatch_' + safeColorId(rainColor) + '_' + safeColorId(showerColor);
      let pattern = defs.querySelector('#' + id);
      if (!pattern) {
        pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
        pattern.setAttribute('id', id);
        pattern.setAttribute('data-rain-shower-hatch', '1');
        pattern.setAttribute('patternUnits', 'userSpaceOnUse');
        pattern.setAttribute('width', '10');
        pattern.setAttribute('height', '10');
        pattern.setAttribute('patternTransform', 'rotate(45)');

        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', '10');
        bg.setAttribute('height', '10');
        bg.setAttribute('fill', rainColor);
        pattern.appendChild(bg);

        const stripe = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        stripe.setAttribute('x', '0');
        stripe.setAttribute('y', '0');
        stripe.setAttribute('width', '3');
        stripe.setAttribute('height', '10');
        stripe.setAttribute('fill', showerColor);
        pattern.appendChild(stripe);
        defs.appendChild(pattern);
      }
      patternCache[cacheKey] = 'url(#' + id + ')';
      return patternCache[cacheKey];
    }

    document.querySelectorAll('.region').forEach(function(el){
      delete el.dataset.rainMixColor;
      delete el.dataset.showerMixColor;
      delete el.dataset.precipKind;
    });

    /*
      원문 순서대로 적용하되, 같은 지역에 강우량과 소나기가 모두 있으면
      강우량 색을 배경으로 두고 소나기 색 45도 사선 빗금을 올립니다.
    */
    // v2.4.1: 산지 ▲도 수치가 아니라 원문 문단(예상 강수량/소나기)을 기준으로 색을 기억합니다.
    const mountainKindColorMap = {};

    records.forEach(function(rec){
      const part = rec.part || {};
      const key = nk(part.amount);
      if (!key) return;

      const color = rec.kind === 'shower'
        ? (showerMap[key] || makeModeColor(key,'shower'))
        : (rainMap[key] || makeModeColor(key,'rain'));

      if (!window.__mixedAmountKindMap[key]) window.__mixedAmountKindMap[key] = rec.kind;
      else if (window.__mixedAmountKindMap[key] !== rec.kind) window.__mixedAmountKindMap[key] = 'both';

      if (part.type === 'mountain') {
        const mountainKey = String(part.area || '').replace(/[.·ㆍ\s]/g, '');
        if (mountainKey) mountainKindColorMap[mountainKey + '|' + key] = { kind:rec.kind, color:color };
        return;
      }

      let tokens = [];
      try { tokens = tokensFromArea(part.area, part.zone) || []; } catch(e) {}
      tokens.forEach(function(token){
        document.querySelectorAll('.region').forEach(function(el){
          const sido = el.dataset.sido || '';
          const sig = el.dataset.sig || el.dataset.name || '';
          if (regionMatchesToken(sido, sig, token, el.dataset.code || '')) {
            if (rec.kind === 'rain') el.dataset.rainMixColor = color;
            else el.dataset.showerMixColor = color;

            const rainColor = el.dataset.rainMixColor || '';
            const showerColor = el.dataset.showerMixColor || '';
            if (rainColor && showerColor) {
              el.dataset.precipKind = 'both';
              el.style.fill = ensureOverlapPattern(rainColor, showerColor);
            } else if (showerColor) {
              el.dataset.precipKind = 'shower';
              el.style.fill = showerColor;
            } else {
              el.dataset.precipKind = 'rain';
              el.style.fill = rainColor;
            }
          }
        });
      });
    });

    /*
      수치별 기본 색상도 강우량/소나기 계열로 정리합니다.
      같은 수치가 양쪽에 동시에 있으면 지역 색은 각각 유지되고,
      공통 수치 박스는 강우량 계열을 우선 사용합니다.
    */
    Object.keys(window.__mixedAmountKindMap).forEach(function(key){
      const kind = window.__mixedAmountKindMap[key];
      if (kind === 'shower') amountColorMap[key] = showerMap[key] || makeModeColor(key,'shower');
      else amountColorMap[key] = rainMap[key] || makeModeColor(key,'rain');
    });

    if (typeof renderAmountLabels === 'function') renderAmountLabels();
    if (typeof renderMountainIcons === 'function') renderMountainIcons();
    if (typeof renderRainLegend === 'function') renderRainLegend();

    // v2.4.1: renderMountainIcons()가 공통 amountColorMap으로 다시 칠한 뒤에도
    // 각 산지 ▲와 산지 전용 수치 글자는 실제 문단의 색으로 최종 확정합니다.
    document.querySelectorAll('.mountain-icon-group').forEach(function(g){
      const mountainKey = String(g.dataset.mountain || '').replace(/[.·ㆍ\s]/g, '');
      const amountKey = nk(g.dataset.amount || '');
      const info = mountainKindColorMap[mountainKey + '|' + amountKey];
      if (!info) return;
      g.dataset.precipKind = info.kind;
      const tri = g.querySelector('.mountain-triangle');
      if (tri) tri.setAttribute('fill', info.color);
    });
    document.querySelectorAll('.mountain-value-label-group').forEach(function(g){
      const mountainKey = String(g.dataset.mountain || '').replace(/[.·ㆍ\s]/g, '');
      const amountKey = nk(g.dataset.amount || '');
      const info = mountainKindColorMap[mountainKey + '|' + amountKey];
      if (!info) return;
      g.dataset.precipKind = info.kind;
      const txt = g.querySelector('.amount-label');
      if (txt) txt.style.fill = info.color;
    });

    /*
      렌더링 후 지역별 혼합 색을 다시 고정합니다.
    */
    document.querySelectorAll('.region.matched').forEach(function(el){
      const rainColor = el.dataset.rainMixColor || '';
      const showerColor = el.dataset.showerMixColor || '';
      if (rainColor && showerColor) {
        el.dataset.precipKind = 'both';
        el.style.fill = ensureOverlapPattern(rainColor, showerColor);
      } else if (showerColor) {
        el.dataset.precipKind = 'shower';
        el.style.fill = showerColor;
      } else if (rainColor) {
        el.dataset.precipKind = 'rain';
        el.style.fill = rainColor;
      }
    });

    if (typeof updateShowerCharacterVisibility === 'function') {
      updateShowerCharacterVisibility();
    }
  }

  const oldApply = (typeof applyForecastMatch === 'function') ? applyForecastMatch : null;
  if (oldApply && !oldApply.__v220MixedRainShower) {
    const wrappedApply = function(){
      const result = oldApply.apply(this, arguments);
      recolorMixedRainShower();
      return result;
    };
    wrappedApply.__v220MixedRainShower = true;
    window.applyForecastMatch = applyForecastMatch = wrappedApply;
  }

  window.recolorMixedRainShower = recolorMixedRainShower;

  refreshButtons();
  renderPaletteOnly();
})();
</script>

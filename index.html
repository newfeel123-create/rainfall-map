<script id="v2-21-mountain-selection-focus">
(function(){
  function norm(v){
    try { return normalizeAmountKey(String(v || '')); }
    catch(e){ return String(v || '').replace(/\s+/g,'').replace(/mm/gi,''); }
  }

  function clearMountainManualFocus(){
    document.querySelectorAll('.manual-mountain-selected')
      .forEach(function(el){ el.classList.remove('manual-mountain-selected'); });
  }

  function clearAllFocusClasses(){
    document.querySelectorAll(
      '.region.hover-dim, .region.hover-focus,' +
      '.amount-label-group.hover-dim, .amount-label-group.hover-focus,' +
      '.mountain-value-label-group.hover-dim, .mountain-value-label-group.hover-focus,' +
      '.mountain-icon-group.hover-dim, .mountain-icon-group.hover-focus'
    ).forEach(function(el){
      el.classList.remove('hover-dim','hover-focus');
      el.style.removeProperty('opacity');
    });
    clearMountainManualFocus();
  }

  function focusMountainAmount(amountKey, mountainKey, clickedValueGroup){
    var key = norm(amountKey);
    if (!key) return;

    clearAllFocusClasses();

    // 일반 지도 지역은 산지 선택 중에는 흐리게 표시
    document.querySelectorAll('.region').forEach(function(el){
      el.classList.add('hover-dim');
    });

    // 모든 일반 수치/산지 수치 박스를 흐리게 한 뒤 선택한 수치만 강조
    document.querySelectorAll('.amount-label-group').forEach(function(el){
      var same = norm(el.dataset.amount || '') === key;
      el.classList.toggle('hover-focus', same);
      el.classList.toggle('hover-dim', !same);
      el.classList.remove('manual-index-selected');
    });

    // 산지 아이콘은 동일 수치, 가능하면 동일 산지만 강조
    document.querySelectorAll('.mountain-icon-group').forEach(function(el){
      var sameAmount = norm(el.dataset.amount || '') === key;
      var sameMountain = !mountainKey || (el.dataset.mountain || '') === mountainKey;
      var focus = sameAmount && sameMountain;

      el.classList.toggle('hover-focus', focus);
      el.classList.toggle('hover-dim', !focus);
      el.classList.toggle('manual-mountain-selected', focus);
    });

    if (clickedValueGroup) {
      clickedValueGroup.classList.remove('hover-dim');
      clickedValueGroup.classList.add('hover-focus','manual-index-selected');
    }

    selectedManualAmountKey = key;
    window.__selectedManualAmountElementKey = key;

    try {
      if (typeof updateManualColorPaletteState === 'function') {
        updateManualColorPaletteState();
      }
    } catch(e) {}
  }

  /*
    산지 수치 박스 또는 산지 삼각형을 누르면
    일반 수치와 동일하게 노란 표시 + 해당 산지만 부각합니다.
  */
  document.addEventListener('click', function(e){
    var valueGroup = e.target && e.target.closest
      ? e.target.closest('.mountain-value-label-group')
      : null;
    var iconGroup = e.target && e.target.closest
      ? e.target.closest('.mountain-icon-group')
      : null;

    if (!valueGroup && !iconGroup) return;

    e.preventDefault();
    e.stopPropagation();

    var source = valueGroup || iconGroup;
    var amount = source.dataset.amount || '';
    var mountain = source.dataset.mountain || '';

    // 삼각형을 눌렀을 때 연결된 산지 수치 박스를 찾아 함께 노란 테두리 표시
    if (!valueGroup) {
      valueGroup = Array.from(document.querySelectorAll('.mountain-value-label-group'))
        .find(function(el){
          return norm(el.dataset.amount || '') === norm(amount) &&
                 (!mountain || (el.dataset.mountain || '') === mountain);
        }) || null;

      // 동일 산지 전용 수치 박스가 없으면 같은 수치 박스를 사용
      if (!valueGroup) {
        valueGroup = Array.from(document.querySelectorAll('.mountain-value-label-group'))
          .find(function(el){ return norm(el.dataset.amount || '') === norm(amount); }) || null;
      }
    }

    focusMountainAmount(amount, mountain, valueGroup);
  }, true);

  /*
    선택 해제나 색 변경 완료 후 산지 선택 표시도 같이 제거합니다.
  */
  var offBtn = document.getElementById('manualColorOff');
  if (offBtn) {
    offBtn.addEventListener('click', function(){
      setTimeout(clearAllFocusClasses, 0);
    });
  }

  var oldApplyManual = (typeof applyManualIndexColorToSelectedAmount === 'function')
    ? applyManualIndexColorToSelectedAmount
    : null;

  if (oldApplyManual && !oldApplyManual.__v221MountainFocusReset) {
    var wrappedApply = function(){
      var result = oldApplyManual.apply(this, arguments);
      setTimeout(clearAllFocusClasses, 360);
      return result;
    };
    wrappedApply.__v221MountainFocusReset = true;
    window.applyManualIndexColorToSelectedAmount =
      applyManualIndexColorToSelectedAmount = wrappedApply;
  }
})();
</script>

<script id="v245-overall-speed-optimization">
/* v2.4.5 전체 속도 추가 최적화
   - 기상청 원문 90초 메모리 캐시
   - 빠른 프록시 3개 병렬 경쟁(첫 성공 즉시 사용)
   - 페이지 로드 직후 백그라운드 사전 불러오기
   - 같은 원문 파싱 결과 재사용
*/
(function(){
  'use strict';

  const RAW_CACHE_MS = 90000;
  const rawCache = new Map();
  const pendingCache = new Map();
  const blockCache = new Map();

  function validKmaRaw(raw){
    if (!raw || String(raw).length < 80) return false;
    let plain = String(raw);
    try { if (typeof __kmaPlainText === 'function') plain = __kmaPlainText(raw); } catch(e) {}
    return /(예상\s*강수량|소나기|강수량)/.test(plain) && /mm/.test(plain);
  }

  async function fetchCandidate(url, timeoutMs){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs || 7000);
    try {
      const res = await fetch(url, {
        cache:'no-store',
        signal:controller.signal,
        headers:{'Accept':'text/html,text/plain,application/json,*/*'}
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const raw = await res.text();
      if (!validKmaRaw(raw)) throw new Error('예상 강수량 문구 없음');
      return raw;
    } finally {
      clearTimeout(timer);
    }
  }

  async function fastFetchKma(url, onTry){
    const now = Date.now();
    const cached = rawCache.get(url);
    if (cached && now - cached.time < RAW_CACHE_MS) return cached.raw;
    if (pendingCache.has(url)) return pendingCache.get(url);

    const encoded = encodeURIComponent(url);
    const candidates = [
      'https://r.jina.ai/' + url,
      'https://api.allorigins.win/raw?url=' + encoded,
      'https://api.codetabs.com/v1/proxy?quest=' + encoded
    ];

    const task = (async function(){
      if (onTry) onTry(1, candidates.length);
      let winner;
      try {
        // 세 경로를 동시에 요청해 가장 먼저 정상 응답한 결과를 사용합니다.
        winner = await Promise.any(candidates.map((u, i) =>
          new Promise((resolve, reject) => {
            setTimeout(() => {
              if (onTry) onTry(i + 1, candidates.length);
              fetchCandidate(u, 7500).then(resolve, reject);
            }, i * 120);
          })
        ));
      } catch(e) {
        // 병렬 경로가 모두 실패하면 기존의 폭넓은 순차 fallback을 그대로 사용합니다.
        if (typeof window.__v244OriginalFetchTextWithFallback === 'function') {
          winner = await window.__v244OriginalFetchTextWithFallback(url, onTry);
        } else {
          throw e;
        }
      }
      rawCache.set(url, {time:Date.now(), raw:winner});
      return winner;
    })();

    pendingCache.set(url, task);
    try { return await task; }
    finally { pendingCache.delete(url); }
  }

  if (typeof fetchTextWithFallback === 'function') {
    window.__v244OriginalFetchTextWithFallback = fetchTextWithFallback;
    window.fetchTextWithFallback = fetchTextWithFallback = fastFetchKma;
  }

  if (typeof __extractKmaRainBlocksDetailed === 'function') {
    const oldExtract = __extractKmaRainBlocksDetailed;
    window.__extractKmaRainBlocksDetailed = __extractKmaRainBlocksDetailed = function(raw){
      const key = String(raw || '');
      const hit = blockCache.get(key);
      if (hit) return hit;
      const value = oldExtract(raw);
      if (blockCache.size > 5) blockCache.clear();
      blockCache.set(key, value);
      return value;
    };
  }

  // 사용자가 오늘/내일 버튼을 누르기 전에 원문을 미리 받아 둡니다.
  function prewarmKma(){
    const url = 'https://www.weather.go.kr/w/forecast/overall/short-term.do';
    fastFetchKma(url).catch(function(){});
  }
  if (document.readyState === 'complete') setTimeout(prewarmKma, 250);
  else window.addEventListener('load', function(){ setTimeout(prewarmKma, 250); }, {once:true});

  window.__kmaFastCacheClear = function(){ rawCache.clear(); blockCache.clear(); };
})();
</script>

        var color=getColor(rec,maps,hasBoth);
        var finalKind=(mode==='rain'||mode==='shower')?mode:rec.kind;
        document.querySelectorAll('.mountain-icon-group').forEach(function(g){
          if(clean(g.dataset.mountain||'')===rec.mountain && nk(g.dataset.amount||'')===rec.amount){
            g.dataset.precipKind=finalKind;
            var tri=g.querySelector('.mountain-triangle');
            if(tri){
              if(tri.getAttribute('fill')!==color) tri.setAttribute('fill',color);
              if(tri.style.fill!==color) tri.style.setProperty('fill',color,'important');
            }
          }
        });
        document.querySelectorAll('.mountain-value-label-group').forEach(function(g){
          if(clean(g.dataset.mountain||'')===rec.mountain && nk(g.dataset.amount||'')===rec.amount){
            g.dataset.precipKind=finalKind;
            var rect=g.querySelector('rect');
            if(rect){
              if(rect.getAttribute('fill')!==color) rect.setAttribute('fill',color);
              if(rect.style.fill!==color) rect.style.setProperty('fill',color,'important');
            }
          }
        });
      });
    }finally{ correcting=false; }
  }

  // 버튼 토글 직후, 브라우저가 화면을 그리기 전에 올바른 산지색으로 확정합니다.
  ['mapRainColorToggle','mapShowerColorToggle','kmaChoiceRain','kmaChoiceShower','kmaChoiceBoth','pasteMatchBtn'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('click',function(){ queueMicrotask(correctNow); },true);
  });

  // 기존 지연 렌더링이 산지를 잠깐 초록색으로 되돌려도 같은 렌더링 주기 안에서 즉시 복구합니다.
  var svg=document.getElementById('mapSvg') || document.querySelector('svg');
  if(svg && window.MutationObserver){
    var queued=false;
    var obs=new MutationObserver(function(muts){
      if(correcting) return;
      var relevant=muts.some(function(m){
        var el=m.target;
        return el && el.closest && (el.closest('.mountain-icon-group') || el.closest('.mountain-value-label-group'));
      });
      if(relevant && !queued){
        queued=true;
        queueMicrotask(function(){ queued=false; correctNow(); });
      }
    });
    obs.observe(svg,{subtree:true,attributes:true,attributeFilter:['fill','style']});
  }

  var oldSet=(typeof setMapColorMode==='function')?setMapColorMode:null;
  if(oldSet && !oldSet.__v248NoFlash){
    var wrapped=function(){
      var r=oldSet.apply(this,arguments);
      correctNow();
      return r;
    };
    wrapped.__v248NoFlash=true;
    window.setMapColorMode=setMapColorMode=wrapped;
  }

  window.addEventListener('load',function(){correctNow();});
})();
</script>

</body></html>
